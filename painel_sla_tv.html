const PERIODS=[['u4s','Últimas 4 semanas'],['today','Hoje'],['yesterday','Ontem'],['u7','Últimos 7 dias'],['u14','Últimos 14 dias'],['u30','Últimos 30 dias'],['u8s','Últimas 8 semanas'],['u13s','Últimas 13 semanas'],['current','Mês atual'],['previous','Mês anterior'],['year','Ano atual'],['all','Todo o período'],['custom','Período personalizado']];
const state={period:'u4s',grain:'semana',custom:null,today:C.today(),playing:true,seconds:20,position:0,elapsed:0,lastTick:performance.now(),busy:false};
let dataset,derived,cache,deck=[],wake=null,messageTimer,clockMinute='';
function notice(text,error=false){const n=$('#message');n.textContent=text;n.className=error?'error':'';n.hidden=false;clearTimeout(messageTimer);messageTimer=setTimeout(()=>{n.hidden=true},error?9000:6500)}
function buildPeriods(){const months=new Set();C.ORDER.forEach(c=>derived[c].items.forEach(d=>months.add(C.iso(d.prev).slice(0,7))));$('#period').innerHTML=PERIODS.map(([v,l])=>'<option value="'+v+'">'+l+'</option>').join('')+'<optgroup label="Meses da base">'+[...months].sort().reverse().map(m=>'<option value="'+m+'">'+m.slice(5)+'/'+m.slice(0,4)+'</option>').join('')+'</optgroup>';$('#period').value=state.period}
function resetClock(){state.elapsed=0;state.lastTick=performance.now();$('#progress').style.width='0%'}
function chosenPage(){return deck[state.position]?.page||0}
function rebuild(page=chosenPage()){
  const rg=C.range(state.period,state.today,state.custom),lists={},totals={},buckets={};
  for(const c of C.ORDER){lists[c]=C.filter(derived[c].items,rg);totals[c]=C.stats(lists[c]);buckets[c]=new Map(C.buckets(lists[c],rg,state.grain).map(d=>[d.day,d]))}
  const all=C.ORDER.flatMap(c=>lists[c]),timeline=C.buckets(all,rg,state.grain);
  cache={rg,lists,totals,buckets,timeline,total:C.stats(all)};
  deck=[];
  for(let p=0;p<4;p++){
    const capacity=p===0?(state.grain==='dia'?7:8):(state.grain==='dia'?14:12),groups=[];
    const displayTimeline=state.grain==='dia'?timeline.filter(r=>p===0?r.base>0:(buckets[C.ORDER[p-1]].get(r.day)?.base||0)>0):timeline;
    // Newest group first, retaining chronological order within each group.
    for(let end=displayTimeline.length;end>0;end-=capacity)groups.push(displayTimeline.slice(Math.max(0,end-capacity),end));
    if(!groups.length)groups.push([]);
    groups.forEach((rows,i)=>deck.push({page:p,rows,part:i+1,parts:groups.length}));
  }
  state.position=Math.max(0,deck.findIndex(d=>d.page===page));resetClock();render();
}
function periodCaption(){const label=PERIODS.find(([v])=>v===state.period)?.[1]||state.period.slice(5)+'/'+state.period.slice(0,4);const rg=cache.rg;if(Number.isFinite(rg[0])&&Number.isFinite(rg[1]))return (state.period==='custom'?'':label+' · ')+C.fmt(rg[0])+' a '+C.fmt(rg[1]);if(cache.timeline.length)return label+' · '+C.fmt(cache.timeline[0].from)+' a '+C.fmt(cache.timeline.at(-1).to);return label}
function card(c,withChart){const s=cache.totals[c],lv=C.level(s.pct),diff=s.pct==null?null:s.pct-C.META;const diffText=diff==null?'Sem pedidos elegíveis':(diff>=0?'+':'')+pct(diff)+' p.p. da meta';return '<article class="card" style="--carrier:var(--'+c+');color:var(--'+lv+')"><div class="card-head"><h3 class="name">'+C.NAMES[c]+'</h3><span class="status">'+C.status(s.pct)+'</span></div><div class="pct">'+pct(s.pct)+(s.pct==null?'':'<small>%</small>')+'</div><div class="muted">SLA no período</div><div class="track" aria-hidden="true"><i style="width:'+(s.pct||0)+'%"></i></div><div class="gap">'+diffText+'</div><div class="metrics"><div><b>'+count(s.ok)+'</b><span>No prazo</span></div><div><b>'+count(s.late_deliv)+'</b><span>Entregues com atraso</span></div><div><b>'+count(s.late_open)+'</b><span>Vencidos em aberto</span></div></div><div class="ref">'+count(s.base)+' no SLA · '+count(s.open)+' em andamento<br>Base até '+C.fmt(derived[c].ref)+'</div>'+(withChart?chart(c):'')+'</article>'}
function chart(c){const screen=deck[state.position],weekly=state.grain==='semana',rows=weekly?screen.rows:screen.rows.filter(r=>(cache.buckets[c].get(r.day)?.base||0)>0);if(!rows.length)return '<div class="empty">'+(cache.totals[c].base?'Sem SLA neste bloco':'Sem SLA no período')+'</div>';
  const empty=C.stats([]),values=rows.map(r=>({...r,...(cache.buckets[c].get(r.day)||empty)}));
  const span=C.fmt(rows[0].from,false)+'–'+C.fmt(rows.at(-1).to,false);
  return '<div class="chart-block" style="--columns:'+rows.length+'"><div class="chart-head"><h3>SLA '+(weekly?'semanal':'diário')+'</h3><span>'+span+' · Meta 95%</span></div><div class="plot" role="img" aria-label="'+C.NAMES[c]+': SLA '+(weekly?'por semana':'por dia')+'. '+values.map(r=>esc(C.fmt(r.from)+(weekly?' a '+C.fmt(r.to):'')+': '+(r.pct==null?'sem SLA':pct(r.pct)+'%'))).join('; ')+'">'+values.map(r=>{const lv=C.level(r.pct),value=r.pct||0,title=C.fmt(r.from)+(weekly?' a '+C.fmt(r.to):'')+' · '+(r.pct==null?'Sem SLA':pct(r.pct)+'%')+' · '+count(r.base)+' no SLA';return '<div class="bar '+(r.pct==null?'none':value===0?'zero':'')+'" style="--pct:'+value+';color:var(--'+lv+')" title="'+esc(title)+'"><i class="bar-fill"></i><span class="bar-value">'+pct(r.pct)+(r.pct==null?'':'%')+'</span></div>'}).join('')+'</div><div class="date-row">'+rows.map(r=>'<span>'+C.fmt(r.from,false)+(weekly?'<small>a '+C.fmt(r.to,false)+'</small>':'')+'</span>').join('')+'</div></div>';
}
function render(){const screen=deck[state.position],page=screen.page,name=page===0?'Visão geral':C.NAMES[C.ORDER[page-1]],s=cache.total;$('#view').innerHTML='<div class="intro"><div><h2>'+name+'</h2><p>'+esc(periodCaption())+'</p></div><div class="target">META<b>95%</b></div></div>'+(page===0?'<div class="cards">'+C.ORDER.map(c=>card(c,true)).join('')+'</div><div class="summary"><span>SLA consolidado</span><strong style="color:var(--'+C.level(s.pct)+')">'+pct(s.pct)+(s.pct==null?'':'%')+'</strong><span>'+count(s.ok)+' no prazo / '+count(s.base)+' no SLA</span></div>':'<div class="detail">'+card(C.ORDER[page-1],false)+'<section class="trend" aria-label="Evolução do SLA '+name+'">'+chart(C.ORDER[page-1])+'</section></div>');
  document.querySelectorAll('#nav [data-page]').forEach(b=>{if(+b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  $('#counter').textContent=(state.position+1)+' / '+deck.length;
  $('#foot').textContent=(state.playing?'Rotação automática':'Rotação pausada')+' · '+(state.grain==='dia'?'Diário':'Semanal')+(screen.parts>1?' · Bloco '+screen.part+'/'+screen.parts:'')+baseInfo;
}
function move(delta){state.position=(state.position+delta+deck.length)%deck.length;resetClock();render()}
function jump(page){const pos=deck.findIndex(d=>d.page===page);if(pos>=0){state.position=pos;resetClock();render()}}
async function syncWake(){const wanted=state.playing&&!!document.fullscreenElement&&!document.hidden;if(!wanted&&wake){const old=wake;wake=null;try{await old.release()}catch{}}else if(wanted&&!wake&&navigator.wakeLock){try{wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null},{once:true})}catch{}}}
function togglePlay(){state.playing=!state.playing;$('#pause').textContent=state.playing?'Pausar rotação':'Retomar rotação';$('#pause').setAttribute('aria-pressed',String(!state.playing));state.lastTick=performance.now();render();syncWake()}
function tick(){const now=performance.now(),dt=now-state.lastTick;state.lastTick=now;
  const key=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'}).format(new Date());
  if(key!==clockMinute){clockMinute=key;$('#clock b').textContent=key;$('#clock small').textContent=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date());const T=C.today();if(T!==state.today){state.today=T;derived=C.derive(dataset,T);rebuild()}}
  if(state.playing&&!document.hidden&&!state.busy&&$('#custom').hidden&&!(document.activeElement&&document.activeElement.matches('select,input'))){state.elapsed+=Math.min(dt,1500);if(state.elapsed>=state.seconds*1000)move(1)}
  $('#progress').style.width=Math.min(100,state.elapsed/(state.seconds*10))+'%';
}
function installData(next){const fresh=C.derive(next,state.today);dataset=next;derived=fresh;buildPeriods();rebuild()}
/* ===== dados vêm do Firebase: são os mesmos que o app "SLA Transportadoras" importa (transportadoras/sla/{car}) ===== */
const FB_ROOT='transportadoras/sla/';
const fbc=car=>firebase.database().ref(FB_ROOT+car);
let stamps={},baseInfo='';
function cleanRows(car,recs){
  const out=[];
  recs.forEach(r=>{
    if(!r||typeof r!=='object')return;
    const id=String(r.id!=null&&r.id!==''?r.id:(r.k!=null?r.k:''));
    const x={id:id.slice(0,150),base:r.base||null,prazo:car==='correios'?(parseInt(r.prazo,10)||0):0,prev:r.prev||null,ent:r.ent||null,st:String(r.st==null?'':r.st).slice(0,250)};
    if(!x.id.trim())return;
    for(const k of ['base','prev','ent'])if(x[k]!=null&&C.dateDay(x[k])==null)return;
    if(car==='correios'&&(C.dateDay(x.base)==null||x.prazo<0||x.prazo>3650))return;
    if(car!=='correios'&&C.dateDay(x.prev)==null)return;
    out.push(x);
  });
  return out;
}
async function loadDataset(){
  const carriers={},imps=[],nextStamps={};
  await Promise.all(C.ORDER.map(async car=>{
    const v=(await fbc(car).once('value')).val()||{};
    let recs=[];Object.keys(v.chunks||{}).sort().forEach(k=>{try{recs=recs.concat(JSON.parse(v.chunks[k]))}catch(e){}});
    carriers[car]=cleanRows(car,recs);nextStamps[car]=v.updatedAt||0;
    try{JSON.parse(v.imports||'[]').forEach(i=>imps.push(i))}catch(e){}
  }));
  stamps=nextStamps;
  const last=imps.filter(i=>i.ts).sort((p,q)=>new Date(q.ts)-new Date(p.ts))[0];
  baseInfo=last?' · Base atualizada em '+new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(last.ts)):' · Base ainda vazia';
  return {schema:'stin-sla-tv-v2',carriers};
}
async function reloadData(manual){
  if(state.busy)return;state.busy=true;$('#update').disabled=true;
  try{const next=await loadDataset();installData(next);if(manual)notice('Dados atualizados.')}
  catch(error){notice('Não foi possível atualizar: '+(error.message||error),true)}
  finally{state.busy=false;$('#update').disabled=false;resetClock()}
}
/* a cada 5 min só olha o carimbo de atualização (leitura minúscula); baixa tudo só se alguém importou algo novo */
async function checkFresh(){
  if(state.busy||document.hidden)return;
  try{const now=await Promise.all(C.ORDER.map(async car=>(await fbc(car).child('updatedAt').once('value')).val()||0));
    if(C.ORDER.some((car,i)=>now[i]!==(stamps[car]||0)))await reloadData(false);}catch(e){}
}
async function init(){
  dataset=await loadDataset();derived=C.derive(dataset,state.today);buildPeriods();rebuild(0);
  $('#granularity').onchange=e=>{state.grain=e.target.value;rebuild()};
  $('#period').onchange=e=>{
    if(e.target.value==='custom'){const r=state.custom||cache.rg,first=cache.timeline[0]?.from||state.today-27,last=cache.timeline.at(-1)?.to||state.today;$('#from').value=C.iso(Number.isFinite(r[0])?r[0]:first);$('#to').value=C.iso(Number.isFinite(r[1])?r[1]:last);$('#custom').hidden=false;$('#filterError').textContent='';$('#from').focus();return}
    state.period=e.target.value;$('#custom').hidden=true;rebuild();
  };
  $('#custom').onsubmit=e=>{e.preventDefault();const a=C.dateDay($('#from').value),b=C.dateDay($('#to').value);if(a==null||b==null||a>b){$('#filterError').textContent='Confira as datas: o início deve ser anterior ou igual ao fim.';return}state.custom=[a,b];state.period='custom';$('#custom').hidden=true;$('#filterError').textContent='';rebuild()};
  $('#cancel').onclick=()=>{$('#custom').hidden=true;$('#period').value=state.period;state.lastTick=performance.now()};
  $('#nav').onclick=e=>{const b=e.target.closest('[data-page]');if(b)jump(+b.dataset.page)};
  $('#previous').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#pause').onclick=togglePlay;
  $('#speed').onchange=e=>{state.seconds=+e.target.value;resetClock()};
  $('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else notice('Use F11 para exibir em tela cheia.')}catch{notice('Use F11 para exibir em tela cheia.')}};
  document.addEventListener('fullscreenchange',()=>{$('#full').textContent=document.fullscreenElement?'Sair da tela cheia':'Tela cheia';syncWake()});
  document.addEventListener('visibilitychange',()=>{state.lastTick=performance.now();syncWake()});
  $('#update').onclick=()=>reloadData(true);
  document.addEventListener('keydown',e=>{if(e.target.closest('input,select,button,textarea')||!$('#custom').hidden)return;if(e.key==='ArrowRight'){e.preventDefault();move(1)}else if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}else if(e.code==='Space'){e.preventDefault();togglePlay()}});
  tick();setInterval(tick,250);setInterval(checkFresh,300000);
}
function start(){init().catch(error=>{$('#view').innerHTML='<div class="empty">Não foi possível carregar o painel.<small>'+esc(error.message||String(error))+'</small></div>';notice('Não consegui ler os dados do banco. Recarregue a página.',true)})}
window.__startApp=start;if(window.__gateOk)start();
})();
</script>
