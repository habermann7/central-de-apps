<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu QG</title>
<style>
:root{
  --bg:#e8ebee;--bg2:#f5f6f8;--card:rgba(255,255,255,.82);--card2:#fff;
  --line:rgba(21,24,28,.09);--line2:rgba(21,24,28,.17);
  --ink:#14171b;--mut:#646c75;--faint:#97a0a9;
  --acc:#1b1f24;--accInk:#fff;
  --ok:#2c7a55;--okBg:rgba(44,122,85,.12);--warn:#a96f12;--warnBg:rgba(169,111,18,.13);
  --bad:#b3433a;--badBg:rgba(179,67,58,.12);--info:#386a9b;--infoBg:rgba(56,106,155,.12);
  --r:16px;--r2:10px;--ease:cubic-bezier(.23,1,.32,1);
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 10px 32px rgba(20,24,30,.07);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1114;--bg2:#15181c;--card:rgba(32,36,42,.7);--card2:#22262c;
    --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.17);
    --ink:#eceff2;--mut:#98a1ab;--faint:#677079;
    --acc:#eceff2;--accInk:#14171b;
    --ok:#58b88a;--okBg:rgba(88,184,138,.15);--warn:#d9a24a;--warnBg:rgba(217,162,74,.15);
    --bad:#e0766c;--badBg:rgba(224,118,108,.15);--info:#7aa9d6;--infoBg:rgba(122,169,214,.15);
    --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 10px 32px rgba(0,0,0,.35);
  }
  .chip.sup{color:#b49ae0}
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,system-ui,sans-serif;
  color:var(--ink);background:var(--bg);min-height:100dvh;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1100px 600px at 12% -10%,var(--bg2),transparent 70%);background-attachment:fixed;
}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-weight:650;letter-spacing:-.01em;text-wrap:balance}
.mut{color:var(--mut)}.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}

/* layout */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;padding:22px 14px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line)}
.brand{font-size:18px;font-weight:700;letter-spacing:-.02em;padding:0 10px 14px}
.brand small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;font-size:12px;font-weight:500;color:var(--mut);letter-spacing:0;margin-top:2px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:var(--r2);background:none;cursor:pointer;text-align:left;color:var(--mut);font-weight:550;transition:background .15s var(--ease),color .15s var(--ease),transform .12s var(--ease)}
.nav:hover{background:var(--line)}
.nav:active{transform:scale(.97)}
.nav[aria-current=page]{background:var(--card2);color:var(--ink);box-shadow:var(--shadow)}
.nav .ic{width:18px;text-align:center}
.badge{margin-left:auto;font-size:11px;font-weight:650;background:var(--acc);color:var(--accInk);border-radius:99px;padding:1px 7px;min-width:20px;text-align:center}
.side .sp{flex:1}
.side .foot{display:flex;flex-direction:column;gap:2px}
main{padding:28px clamp(16px,4vw,48px) 96px;max-width:1100px;width:100%}
.view{animation:in .22s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.vh h2{font-size:26px}
.vh p{color:var(--mut);margin-top:2px}

/* espaços */
.ws{display:flex;flex-direction:column;gap:2px;margin:0 0 10px;padding:0 0 10px;border-bottom:1px solid var(--line)}
.ws .lbl{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);padding:4px 10px}
.ws button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:7px 10px;border-radius:9px;cursor:pointer;color:var(--mut);font-weight:550;text-align:left;width:100%;transition:background .15s var(--ease),transform .12s var(--ease)}
.ws button:hover{background:var(--line)}.ws button:active{transform:scale(.97)}
.ws button[aria-pressed=true]{background:var(--card2);color:var(--ink);box-shadow:var(--shadow)}
.ws button span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsbar{display:none;margin-bottom:14px}
.wsbar select{flex:1;min-width:0}.wsbar .btn{white-space:nowrap}
.who{font-size:12px;color:var(--faint)}
/* arquivos */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.th{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--card2);overflow:hidden;cursor:pointer;transition:transform .12s var(--ease),border-color .15s;display:flex;flex-direction:column}
.th:hover{border-color:var(--line2)}.th:active{transform:scale(.98)}
.th .pv{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:var(--bg2);font-weight:700;color:var(--mut);font-size:15px;letter-spacing:.04em}
.th .pv img{width:100%;height:100%;object-fit:cover;display:block}
.th .cap{padding:7px 9px;font-size:12px;line-height:1.3}
.th .cap b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th .cap span{color:var(--faint)}
.th .ac{position:absolute;top:5px;right:5px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.th:hover .ac,.th:focus-within .ac{opacity:1}
@media (hover:none){.th .ac{opacity:1}}
.th .ac button{border:0;border-radius:7px;background:rgba(20,23,27,.72);color:#fff;font-size:12px;padding:3px 7px;cursor:pointer}
.drop{border:1.5px dashed var(--line2);border-radius:12px;padding:16px;text-align:center;color:var(--mut);transition:background .15s,border-color .15s}
.drop.on{background:var(--infoBg);border-color:var(--info)}
.lb{max-width:min(92vw,980px);width:auto;padding:12px;text-align:center}
.lb img{max-width:100%;max-height:74vh;border-radius:10px;display:block;margin:0 auto}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;flex:none}
.seg button{display:inline-flex;align-items:center}
/* componentes */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card2);border-radius:var(--r2);padding:8px 13px;font-weight:600;cursor:pointer;transition:transform .12s var(--ease),background .15s var(--ease),opacity .15s}
.btn:hover{background:var(--bg2)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.btn.pri:hover{opacity:.88}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--mut)}
.btn.bad{color:var(--bad)}
input[type=text],input[type=url],input[type=date],select,textarea{width:100%;background:var(--card2);border:1px solid var(--line2);border-radius:var(--r2);padding:9px 11px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--info);box-shadow:0 0 0 3px var(--infoBg)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
label.f{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:0 0 5px;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--mut);white-space:nowrap}
.chip.ok{background:var(--okBg);color:var(--ok)}.chip.warn{background:var(--warnBg);color:var(--warn)}
.chip.bad{background:var(--badBg);color:var(--bad)}.chip.sup{background:rgba(124,92,181,.14);color:#7a5cb5}.chip.info{background:var(--infoBg);color:var(--info)}
.seg{display:inline-flex;background:var(--line);border-radius:var(--r2);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--mut);cursor:pointer;transition:background .15s var(--ease),transform .12s var(--ease)}
.seg button:active{transform:scale(.97)}
.seg button[aria-pressed=true]{background:var(--card2);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .3s var(--ease)}
.sec{margin-top:26px}
.sec>h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;text-align:left;width:100%;transition:transform .12s var(--ease),border-color .15s,background .15s}
.item:hover{border-color:var(--line2)}.item:active{transform:scale(.99)}
.item .t{font-weight:600}.item .s{font-size:13px;color:var(--mut)}
.item .grow{flex:1;min-width:0}
.item .grow>*{overflow:hidden;text-overflow:ellipsis}
.empty{padding:26px;text-align:center;color:var(--mut);border:1px dashed var(--line2);border-radius:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{padding:14px 16px}.stat b{display:block;font-size:26px;letter-spacing:-.02em}.stat span{font-size:12px;color:var(--mut);font-weight:600}
.pc{display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:transform .12s var(--ease),border-color .15s}
.pc:hover{border-color:var(--line2)}.pc:active{transform:scale(.985)}
.pc h3{font-size:16px}
.next{font-size:13.5px;padding:8px 10px;border-radius:9px;background:var(--bg2);border:1px solid var(--line)}
.next.none{color:var(--bad);background:var(--badBg);border-color:transparent}
.big{font-size:20px;font-weight:650;padding:10px 12px;border:0;border-bottom:1px solid var(--line2);border-radius:0;background:none}
.notes{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.ed{display:flex;flex-direction:column;gap:12px}
.ed .tt{font-size:22px;font-weight:650;border:0;background:none;padding:4px 0;box-shadow:none}
.ed textarea{min-height:46dvh}
.saved{font-size:12px;color:var(--faint)}
.tl{border-left:2px solid var(--line2);margin-left:6px;padding-left:16px;display:flex;flex-direction:column;gap:12px}
.tl .e{position:relative;font-size:14px}.tl .e::before{content:"";position:absolute;left:-22px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--line2)}
.tl .e small{display:block;color:var(--faint);font-size:12px}
.hint{font-size:12px;color:var(--faint)}
kbd{font:600 11px ui-monospace,monospace;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--card2)}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--warnBg);color:var(--warn);font-weight:600;margin-bottom:16px}
.banner .btn{margin-left:auto}

/* captura rápida */
.fab{position:fixed;right:22px;bottom:22px;width:54px;height:54px;border-radius:50%;border:0;background:var(--acc);color:var(--accInk);font-size:26px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.28);transition:transform .15s var(--ease);z-index:40}
.fab:hover{transform:scale(1.05)}.fab:active{transform:scale(.94)}
.modal{position:fixed;inset:0;z-index:100;background:rgba(10,12,15,.45);display:flex;align-items:flex-start;justify-content:center;padding:14vh 16px 16px;animation:fade .16s var(--ease)}
.modal .box{width:100%;max-width:520px;background:var(--card2);border-radius:18px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:pop .2s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--acc);color:var(--accInk);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:200;animation:pop .2s var(--ease);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.err{background:var(--bad);color:#fff}

/* mobile */
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:var(--bg);z-index:50;justify-content:space-around;gap:0}
  .brand,.side .sp,.side .foot,.side .ws{display:none}
  .wsbar{display:flex;gap:8px}
  .nav{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;text-align:center;justify-content:center;position:relative}
  .nav .badge{position:absolute;top:2px;right:6px;margin:0}
  .fab{bottom:calc(76px + env(safe-area-inset-bottom));right:16px}
  .grid2{grid-template-columns:1fr}
  .notes{grid-template-columns:1fr}
  :root{--vb:inline-flex}
  .notes.edit .nl{display:none}.notes:not(.edit) .ne{display:none}
  main{padding-top:20px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<div class="shell" id="app" hidden>
  <nav class="side" aria-label="Seções">

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-database-compat.min.js"></script>
<script>
(function(){
  /* CADEADO PADRÃO DA ESTANTE. Só esta linha muda (o ✎ Editar troca ela). "*" = qualquer pessoa cadastrada na Estante (os dados continuam protegidos por espaço). */
  var GRUPOS_PERMITIDOS = ["*"];
  var firebaseConfig = {
    apiKey: "AIzaSyCpG7o-CF3twF0Jti0bRchrS97SWYQBuyo",
    authDomain: "stinpharma-qualidade.firebaseapp.com",
    databaseURL: "https://stinpharma-qualidade-default-rtdb.firebaseio.com",
    projectId: "stinpharma-qualidade",
    storageBucket: "stinpharma-qualidade.firebasestorage.app",
    messagingSenderId: "422803826984",
    appId: "1:422803826984:web:6e72e2470f3678eb8d881d",
    measurementId: "G-6C0TLHH2VP"
  };
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  function norm(x){ return String(x).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().trim(); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function liberar(){
    var st = document.getElementById('__gateStyle');
    var ov = document.getElementById('__gateOverlay');
    if(st) st.remove();
    if(ov) ov.remove();
    window.__gateOk = true;
    if(window.__startApp) window.__startApp();
  }
  function negar(msg){
    document.getElementById('__gateMsg').innerHTML = msg + '<br><br><a href="./index.html" style="color:#4d9fff;">&larr; Voltar pra Estante</a>';
  }
  var jaResolveu = false;
  setTimeout(function(){
    if(!jaResolveu) negar('Não foi possível confirmar seu acesso (conexão lenta ou instável). <a href="javascript:location.reload()" style="color:#4d9fff;">Tentar de novo</a>');
  }, 10000);
  firebase.auth().onAuthStateChanged(function(user){
    jaResolveu = true;
    if(!user){ negar('Você precisa entrar pela Estante.'); return; }
    firebase.database().ref('centralApps/usuarios/' + user.uid).once('value').then(function(snap){
      var dados = snap.val() || {};
      var lista = (dados.grupos || []).slice();
      if(dados.gruposMap && typeof dados.gruposMap === 'object'){ Object.keys(dados.gruposMap).forEach(function(k){ if(dados.gruposMap[k]) lista.push(k); }); }
      var chave = function(x){ return norm(x).replace(/[^A-Z0-9]/g,'_'); };
      var meus = lista.map(chave);
      var cadastrado = Object.keys(dados).length > 0;
      var permitido = dados.admin === true || (GRUPOS_PERMITIDOS.indexOf('*') !== -1 && cadastrado) || GRUPOS_PERMITIDOS.some(function(g){ return meus.indexOf(chave(g)) !== -1; });
      if(permitido){ liberar(); return; }
      negar('Você não tem permissão pra acessar este app.<br><span style="font-size:12px;">Seus grupos: ' + esc(lista.join(', ') || 'nenhum') + '<br>Grupos com acesso: ' + esc(GRUPOS_PERMITIDOS.join(', ') || 'só administrador') + '</span>');
    }).catch(function(){ negar('Não foi possível checar sua permissão agora. Tente recarregar.'); });
  });
})();
</script>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const DIA=864e5;
/* [nome, classe antiga, cor do status]. A cor do STATUS (identidade) é diferente da cor do ANDAMENTO (vermelho/amarelo/verde). */
const STATUS={mapeamento:['Mapeamento','','#64748b'],producao:['Em Produção','ok','#4f46e5'],andamento:['Em Andamento','info','#2563eb'],homologacao:['Em Homologação','warn','#ea580c'],suporte:['Suporte','sup','#9333ea'],concluido:['Concluído','','#0d9488'],paralisado:['Paralisado','bad','#78716c']};
const stCor=k=>(STATUS[k]||STATUS.mapeamento)[2];
const stChip=k=>{const [l,,c]=STATUS[k]||STATUS.mapeamento;return `<span class="chip" style="background:color-mix(in srgb,${c} 15%,transparent);color:${c}">${l}</span>`;};
const ORDEM_STATUS=['andamento','producao','homologacao','mapeamento','suporte','concluido','paralisado'];
/* % que cada status assume ao ser escolhido (dá pra ajustar depois no controle). Paralisado não tem %: é caso à parte. */
const PRESET={mapeamento:10,producao:30,andamento:50,homologacao:80,concluido:100,suporte:90};
const MOV=['andamento','producao','homologacao']; /* "em movimento": entram nos alertas e nas próximas ações */
const LEGADO={ideia:'mapeamento',fazendo:'andamento',parado:'paralisado'}; /* nomes antigos, convertidos ao ler */
const VIEWS=['hoje','projetos','notas','aguardando','caixa','revisao','membros'];
const S={uid:null,email:'',nome:'',ws:'pessoal',esp:{},dir:{},dirAdm:{},anx:{},d:{projetos:{},notas:{},aguardando:{},inbox:{},config:{}},view:'hoje',proj:null,nota:null,filtro:'ativos',busca:'',notaProj:'',verFeitos:false};
let db=null;

/* ---------- utilitários ---------- */
/* Andamento: vermelho até 20%, amarelo até 70%, verde acima disso */
const corProg=v=>{v=+v||0;return v<=20?'var(--bad)':v<=70?'var(--warn)':'var(--ok)';};
const corP=p=>p.status==='paralisado'?'var(--faint)':corProg(p.progresso);
const PES=()=>'meuQG/'+S.uid;
/* inbox e config são sempre pessoais; o resto vive no espaço escolhido (Pessoal ou um espaço de time) */
const baseDe=p=>{const k=(p||'').split('/')[0];return(!p||k==='inbox'||k==='config'||S.ws==='pessoal')?PES():'qgEspacos/'+S.ws+'/dados';};
const R=p=>db.ref(baseDe(p)+(p?'/'+p:''));
const newId=()=>db.ref(PES()).push().key;
const DIR=()=>Object.assign({},S.dir,S.dirAdm);
const espAtual=()=>S.ws==='pessoal'?null:S.esp[S.ws]||null;
const ehDono=()=>{const e=espAtual();return !!e&&e.dono===S.uid;};
const nomeDe=u=>{if(u===S.uid)return 'você';const e=espAtual();return (e&&e.nomes&&e.nomes[u])||(DIR()[u]&&DIR()[u].nome)||'';};
const autor=()=>S.ws==='pessoal'?{}:{por:S.uid};
const now=()=>Date.now();
const obj0=k=>{ if(k==='inbox'||k==='config'||S.ws==='pessoal')return S.d[k]||{}; const e=S.esp[S.ws]; return (e&&e.dados&&e.dados[k])||{}; };
const obj=k=>{ const o=obj0(k); if(k!=='projetos')return o; const r={}; Object.keys(o).forEach(id=>{ const p=o[id]; if(p&&typeof p==='object'){ r[id]=LEGADO[p.status]?Object.assign({},p,{status:LEGADO[p.status]}):p; } }); return r; };
const lista=(k)=>Object.keys(obj(k)).map(id=>Object.assign({id},obj(k)[id]));
const dias=ts=>Math.max(0,Math.floor((now()-ts)/DIA));
function fmtData(ts){const d=new Date(ts);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function prazoDias(str){ if(!str)return null; const [y,m,d]=str.split('-').map(Number); if(!y)return null; const alvo=new Date(y,m-1,d).getTime(); const hoje=new Date();hoje.setHours(0,0,0,0); return Math.round((alvo-hoje.getTime())/DIA); }
function prazoChip(str){
  const n=prazoDias(str); if(n==null)return '';
  const [y,m,d]=str.split('-'); const txt=d+'/'+m;
  if(n<0)return `<span class="chip bad">Venceu ${txt}</span>`;
  if(n===0)return `<span class="chip bad">Hoje</span>`;
  if(n<=7)return `<span class="chip warn">${txt} · ${n}d</span>`;
  return `<span class="chip">${txt}</span>`;
}
function ago(ts){ if(!ts)return ''; const n=dias(ts); return n===0?'hoje':n===1?'ontem':'há '+n+' dias'; }
function toast(msg,err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.setAttribute('role','status'); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
function guard(p){ return p.catch(e=>{ toast('Não consegui salvar. Confira a conexão e as regras do banco.',true); console.error(e); }); }
const set=(p,v)=>guard(R(p).set(v));
const upd=(p,v)=>guard(R(p).update(v));
const del=p=>guard(R(p).remove());
function tocaProjeto(id,extra){ if(id&&obj('projetos')[id]) upd('projetos/'+id,Object.assign({atualizadoEm:now()},extra||{})); }
const nomeProj=id=>(obj('projetos')[id]||{}).nome||'';

/* ---------- regras de "atenção" ---------- */
const ativos=()=>lista('projetos').filter(p=>p.status!=='concluido');
const semProxima=()=>lista('projetos').filter(p=>MOV.includes(p.status)&&!(p.proximaAcao||'').trim());
const parados=()=>lista('projetos').filter(p=>MOV.includes(p.status)&&dias(p.atualizadoEm||p.criadoEm||now())>=7);
const prazosPerto=()=>lista('projetos').filter(p=>!['concluido','paralisado','suporte'].includes(p.status)&&p.prazo&&prazoDias(p.prazo)!=null&&prazoDias(p.prazo)<=7).sort((a,b)=>a.prazo.localeCompare(b.prazo));
const agAbertos=()=>lista('aguardando').filter(a=>!a.feito).sort((a,b)=>(a.desde||0)-(b.desde||0));
const agVelhos=()=>agAbertos().filter(a=>dias(a.desde||now())>=7);
const inbox=()=>lista('inbox').sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0));
const chaveRev=()=>S.ws==='pessoal'?'ultimaRevisao':'ultimaRevisao_'+S.ws;
const revisaoVencida=()=>{const u=(S.d.config||{})[chaveRev()]; return !u||dias(u)>=7;};

/* ---------- navegação ---------- */
function go(v,opts){
  if(!VIEWS.includes(v)||(v==='membros'&&S.ws==='pessoal'))v='hoje';
  S.view=v; if(!opts||!opts.keepProj)S.proj=null; if(!opts||!opts.keepNota)S.nota=null;
  history.replaceState(null,'','#'+v);
  render(true);
  window.scrollTo(0,0);
}
function abrirProjeto(id){ S.view='projetos';S.proj=id;S.nota=null; render(true); window.scrollTo(0,0); }

/* ---------- render ---------- */
function wsLabel(id){return id==='pessoal'?'🔒 Pessoal':'👥 '+((S.esp[id]||{}).nome||'Espaço');}
function wsBar(){
  const ids=['pessoal',...Object.keys(S.esp)];
  return `<div class="wsbar"><select data-act-change="ws" aria-label="Espaço">${ids.map(i=>`<option value="${i}"${S.ws===i?' selected':''}>${esc(wsLabel(i))}</option>`).join('')}</select><button class="btn" data-act="novo-espaco">+ Espaço</button></div>`;
}
function wsList(){
  const ids=Object.keys(S.esp).sort((a,b)=>(S.esp[a].nome||'').localeCompare(S.esp[b].nome||''));
  $('#wsList').innerHTML=`<div class="lbl">Espaços</div><button data-act="ws" data-id="pessoal" aria-pressed="${S.ws==='pessoal'}"><span>🔒</span><span class="n">Pessoal</span></button>`+
   ids.map(i=>`<button data-act="ws" data-id="${i}" aria-pressed="${S.ws===i}"><span>👥</span><span class="n">${esc(S.esp[i].nome||'Espaço')}</span></button>`).join('')+
   `<button data-act="novo-espaco" style="color:var(--faint)"><span>＋</span><span class="n">Novo espaço</span></button>`;
}
function badges(){
  wsList(); $('#navMem').hidden=S.ws==='pessoal';
  const a=agAbertos().length,c=inbox().length;
  const ba=$('#bAg'),bc=$('#bCx');
  ba.hidden=!a;ba.textContent=a;bc.hidden=!c;bc.textContent=c;
  $$('.nav[data-go]').forEach(b=>{ if(b.dataset.go===S.view)b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
}
function render(animate){
  badges();
  const m=$('#main');
  let html='';
  if(S.view==='hoje')html=vHoje();
  else if(S.view==='projetos')html=S.proj&&obj('projetos')[S.proj]?vProjeto(S.proj):vProjetos();
  else if(S.view==='notas')html=vNotas();
  else if(S.view==='aguardando')html=vAguardando();
  else if(S.view==='caixa')html=vCaixa();
  else if(S.view==='membros'&&espAtual())html=vMembros();
  else if(S.view==='revisao')html=vRevisao();
  else html='<div class="empty">Carregando…</div>';
  m.innerHTML=`<div class="view"${animate?'':' style="animation:none"'}>${wsBar()}${html}</div>`;
  if(S.view==='projetos'&&S.proj&&obj('projetos')[S.proj])carregaAnexos(S.proj);
}
/* Re-render vindo do banco: não atropela quem está digitando. */
function renderSafe(){
  badges();
  const a=document.activeElement;
  if(a&&$('#main').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.dataset.keep!==undefined)return;
  render(false);
}

function projRow(p,extra){
  const prox=(p.proximaAcao||'').trim();
  return `<button class="item" data-act="abrir" data-id="${p.id}" style="border-left:4px solid ${stCor(p.status)}">
    <div class="grow"><div class="t">${esc(p.nome)}</div>
    <div class="s">${prox?'→ '+esc(prox):'<span style="color:var(--bad)">definir próxima ação</span>'}</div></div>
    ${extra||''}${prazoChip(p.prazo)}${stChip(p.status)}</button>`;
}

  <div class="stats sec">
    <div class="card stat"><b class="num">${lista('projetos').filter(p=>MOV.includes(p.status)).length}</b><span>Em movimento</span></div>

    <div class="card stat"><b class="num">${agAbertos().length}</b><span>Aguardando</span></div>

  </div>
  ${atencao.length?`<div class="sec"><h3>Atenção</h3><div class="list">${atencao.map(p=>projRow(p,parados().some(x=>x.id===p.id)?`<span class="chip warn">sem mexer ${dias(p.atualizadoEm||p.criadoEm)}d</span>`:'')).join('')}</div></div>`:''}

  ${ag.length?`<div class="sec"><h3>Esperando resposta</h3><div class="list">${ag.map(a=>`<button class="item" data-go="aguardando"><div class="grow"><div class="t">${esc(a.quem||'—')}</div><div class="s">${esc(a.oque||'')}</div></div><span class="chip ${dias(a.desde||now())>=7?'warn':''}">${dias(a.desde||now())}d</span></button>`).join('')}</div></div>`:''}`;

  let ps=lista('projetos');
  if(S.filtro==='ativos')ps=ps.filter(p=>p.status!=='concluido'); else if(S.filtro==='concluidos')ps=ps.filter(p=>p.status==='concluido');
  const grupos=ORDEM_STATUS.map(st=>[st,ps.filter(p=>p.status===st).sort((a,b)=>(b.atualizadoEm||0)-(a.atualizadoEm||0))]).filter(g=>g[1].length);
  return `<div class="vh"><div><h2>Projetos</h2><p>${ativos().length} ativos · ${lista('projetos').length} no total</p></div>
    <div class="seg" role="group" aria-label="Filtro">${[['ativos','Ativos'],['todos','Todos'],['concluidos','Concluídos']].map(([k,l])=>`<button data-act="filtro" data-v="${k}" aria-pressed="${S.filtro===k}">${l}</button>`).join('')}</div></div>
  <form class="card row" data-form="novo-projeto"><input type="text" id="npNome" placeholder="Novo projeto… (Enter para criar)" autocomplete="off"><button class="btn pri" type="submit">Criar</button></form>

    ${(p.status==='concluido'&&(!prox||prox==='—'))?'':`<div class="next${prox?'':' none'}">${prox?'→ '+esc(prox):'Definir próxima ação'}</div>`}

    <div class="row hint" style="justify-content:space-between"><span class="num" style="color:${corP(p)};font-weight:650">${p.status==='paralisado'?'parado em '+(+p.progresso||0)+'%':(+p.progresso||0)+'%'}</span><span>${nn?nn+' nota'+(nn>1?'s':'')+' · ':''}mexido ${ago(p.atualizadoEm||p.criadoEm)}</span></div></div>`;
}

/* ---------- arquivos (foto/PDF) ----------
   Plano sem Storage: o arquivo vai como base64 no banco, num nó separado (anexos/{projeto}) que só é baixado
   quando o projeto é aberto. O projeto guarda só a ficha (anexosMeta). */
const MAX_FILE=4*1024*1024,MAX_FILES=20;
const fmtSize=b=>b>=1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(b/1024))+' KB';
const isImg=t=>/^image\//.test(t||'');
const tipoLabel=t=>isImg(t)?'FOTO':/pdf/.test(t||'')?'PDF':/sheet|excel|csv/.test(t||'')?'XLS':/word/.test(t||'')?'DOC':'ARQ';
const ckey=id=>S.ws+':'+id;
const readAsDataURL=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f);});
async function compressImage(f){
  const src=await readAsDataURL(f);
  if(f.size<350*1024&&/jpe?g|png|webp/.test(f.type))return{data:src,type:f.type,size:f.size};
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src;});
  const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  const data=c.toDataURL('image/jpeg',.82);return{data,type:'image/jpeg',size:Math.round((data.length-23)*.75)};
}
function anxHtml(id){
  const p=obj('projetos')[id]||{}; const meta=Object.entries(p.anexosMeta||{}).map(([k,m])=>Object.assign({k},m)).sort((a,b)=>(a.t||0)-(b.t||0));
  const cache=S.anx[ckey(id)];
  if(!meta.length)return '<div class="hint" style="margin-top:10px">Nenhum arquivo ainda.</div>';
  return `<div class="thumbs">${meta.map(m=>{
    const d=cache&&cache[m.k]&&cache[m.k].data;
    const pv=isImg(m.type)&&d&&/^data:image\//.test(d)?`<img src="${esc(d)}" alt="">`:tipoLabel(m.type);
    return `<div class="th" data-act="anx-ver" data-id="${id}" data-k="${m.k}" tabindex="0" role="button" aria-label="Abrir ${esc(m.nome)}">

async function carregaAnexos(id){
  const k=ckey(id); if(S.anx[k]!==undefined)return S.anx[k];
  try{ const sn=await db.ref(baseDe('anexos')+'/anexos/'+id).once('value'); S.anx[k]=sn.val()||{}; }catch(e){ S.anx[k]={}; }
  if(S.proj===id&&S.ws+':'+id===k){ const bx=$('#anxBox'); if(bx)bx.innerHTML=anxHtml(id); }
  return S.anx[k];
}
async function addAnexos(id,files){
  files=[...files]; if(!files.length||!obj('projetos')[id])return;
  const ja=Object.keys((obj('projetos')[id]||{}).anexosMeta||{}).length;
  const cache=await carregaAnexos(id); const up={}; let n=0;
  for(const f of files){
    if(ja+n>=MAX_FILES*3||n>=MAX_FILES){toast('Máximo de '+MAX_FILES+' arquivos por vez',true);break;}
    const type=f.type||'application/octet-stream',nome=f.name||'print.png';
    if(!(isImg(type)||/pdf|msword|officedocument|spreadsheet|csv|text\//.test(type)||/\.(pdf|docx?|xlsx?|csv|txt)$/i.test(nome))){toast(nome+': tipo não aceito',true);continue;}
    try{
      let r;
      if(isImg(type)){ r=await compressImage(f); if(r.size>MAX_FILE){toast(nome+': imagem muito grande',true);continue;} r.nome=r.type!==type?nome.replace(/\.[^.]+$/,'')+'.jpg':nome; }
      else{ if(f.size>MAX_FILE){toast(nome+' passa de 4 MB',true);continue;} r={data:await readAsDataURL(f),type,size:f.size,nome}; }
      const k=newId(), meta={nome:r.nome,type:r.type,size:r.size,t:now()}; if(S.ws!=='pessoal')meta.por=S.uid;
      up['anexos/'+id+'/'+k]=Object.assign({},meta,{data:r.data}); up['projetos/'+id+'/anexosMeta/'+k]=meta;
      cache[k]=up['anexos/'+id+'/'+k]; n++;
    }catch(e){toast('Não consegui ler '+nome,true);}
  }
  if(!n)return;
  up['projetos/'+id+'/atualizadoEm']=now();
  guard(db.ref(baseDe('anexos')).update(up)).then(()=>toast(n+(n>1?' arquivos adicionados':' arquivo adicionado')));
}
function dataToBlob(d){ const [h,b]=d.split(','); const mime=(h.match(/:(.*?);/)||[])[1]||'application/octet-stream'; const bin=atob(b); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return new Blob([u],{type:mime}); }
function baixar(m,d){ const a=document.createElement('a'); a.href=URL.createObjectURL(dataToBlob(d)); a.download=m.nome||'arquivo'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800); }
async function verAnexo(id,k){

    $('#layer').innerHTML=`<div class="modal" data-act="fecha-modal" style="padding-top:5vh"><div class="box lb"><img src="${esc(d)}" alt="${esc(m.nome)}"><div class="row" style="justify-content:space-between;margin-top:10px"><span class="hint">${esc(m.nome)} · ${fmtSize(m.size||0)}</span><span class="row"><button class="btn sm" data-act="anx-dl" data-id="${id}" data-k="${k}">Baixar</button><button class="btn sm" data-act="fecha-modal-x">Fechar</button></span></div></div></div>`;
  } else if(/pdf/.test(m.type||'')){ const u=URL.createObjectURL(dataToBlob(d)); const w=window.open(u,'_blank'); if(!w)baixar(m,d); setTimeout(()=>URL.revokeObjectURL(u),60000); }
  else baixar(m,d);
}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ e.preventDefault(); go(g.dataset.go); return; }
  const b=e.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='fecha-modal'){ if(e.target===b)fechaModal(); return; }
  if(e.target.closest('input,select,textarea')&&a!=='abrir')return;
  switch(a){
    case 'abrir': abrirProjeto(id); break;
    case 'voltar': S.proj=null; render(true); break;
    case 'filtro': S.filtro=b.dataset.v; render(false); break;
    case 'status': {
      const ex={status:b.dataset.v};
      if(PRESET[b.dataset.v]!=null)ex.progresso=PRESET[b.dataset.v];
      if(b.dataset.v==='concluido'){ex.concluidoEm=now();} else ex.concluidoEm=null;
      tocaProjeto(id,ex); break; }
    case 'del-proj': if(confirm('Excluir este projeto? As notas dele ficam, só perdem a ligação.')){
      lista('notas').filter(n=>n.projetoId===id).forEach(n=>upd('notas/'+n.id,{projetoId:''}));
      lista('aguardando').filter(x=>x.projetoId===id).forEach(x=>upd('aguardando/'+x.id,{projetoId:''}));
      del('anexos/'+id); delete S.anx[ckey(id)]; del('projetos/'+id); S.proj=null; } break;
    case 'del-diario': del('projetos/'+id+'/diario/'+b.dataset.k); tocaProjeto(id); break;
    case 'anx-add': { const i=$('#anxIn'); if(i)i.click(); break; }
    case 'anx-ver': verAnexo(id,b.dataset.k); break;
    case 'anx-dl': { const m=((obj('projetos')[id]||{}).anexosMeta||{})[b.dataset.k]; const c=S.anx[ckey(id)]; if(m&&c&&c[b.dataset.k])baixar(m,c[b.dataset.k].data); break; }
    case 'anx-ren': { e.stopPropagation(); const k=b.dataset.k,m=((obj('projetos')[id]||{}).anexosMeta||{})[k]; if(!m)break; const nn=prompt('Novo nome do arquivo:',m.nome); if(nn&&nn.trim()){ const v=nn.trim(); db.ref(baseDe('anexos')).update({['projetos/'+id+'/anexosMeta/'+k+'/nome']:v,['anexos/'+id+'/'+k+'/nome']:v}).catch(erroSalvar); if(S.anx[ckey(id)]&&S.anx[ckey(id)][k])S.anx[ckey(id)][k].nome=v; } break; }
    case 'anx-del': { e.stopPropagation(); if(confirm('Excluir este arquivo?')){ const k=b.dataset.k; db.ref(baseDe('anexos')).update({['projetos/'+id+'/anexosMeta/'+k]:null,['anexos/'+id+'/'+k]:null}).catch(erroSalvar); if(S.anx[ckey(id)])delete S.anx[ckey(id)][k]; } break; }
    case 'fecha-modal-x': fechaModal(); break;
    case 'del-link': del('projetos/'+id+'/links/'+b.dataset.k); break;
    case 'nova-nota': novaNota(id||''); break;
    case 'abrir-nota': S.view='notas';S.nota=id;S.proj=null;render(true);window.scrollTo(0,0); break;
    case 'voltar-nota': S.nota=null;render(true); break;
    case 'fixar': upd('notas/'+id,{fixada:!(obj('notas')[id]||{}).fixada}); break;
    case 'del-nota': if(confirm('Excluir esta nota?')){del('notas/'+id);S.nota=null;} break;
    case 'feito-ag': upd('aguardando/'+id,{feito:true,feitoEm:now()}); toast('Marcado como recebido'); break;
    case 'reabrir-ag': upd('aguardando/'+id,{feito:false,feitoEm:null,desde:now()}); break;
    case 'del-ag': del('aguardando/'+id); break;
    case 'ver-feitos': S.verFeitos=!S.verFeitos; render(false); break;
    case 'cx-nota': { const i=obj('inbox')[id]; if(!i)break; const t=i.texto; novaNota('',{titulo:t.slice(0,60),texto:t.length>60?t:''}); del('inbox/'+id); break; }
    case 'cx-proj': { const i=obj('inbox')[id]; if(!i)break; const pid=novoProjeto(i.texto.slice(0,80)); del('inbox/'+id); toast('Projeto criado'); abrirProjeto(pid); break; }
    case 'cx-ag': { const i=obj('inbox')[id]; if(!i)break; set('aguardando/'+newId(),Object.assign(autor(),{quem:'',oque:i.texto,projetoId:'',desde:now(),feito:false})); del('inbox/'+id); toast('Movido para Aguardando'); break; }
    case 'cx-del': del('inbox/'+id); break;
    case 'concluir-revisao': upd('config',{[chaveRev()]:now()}); toast('Revisão concluída ✓'); break;
    case 'backup': backup(); break;
    case 'ws': trocaWs(id); break;
    case 'novo-espaco': abrirNovoEspaco(); break;
    case 'rm-membro': if(confirm('Remover esta pessoa do espaço?')){const eid=S.ws;
      db.ref().update({['qgEspacos/'+eid+'/membros/'+id]:null,['qgEspacos/'+eid+'/nomes/'+id]:null,['qgIndice/'+id+'/'+eid]:null}).catch(erroSalvar);} break;
    case 'sair-espaco': if(confirm('Sair deste espaço? Você perde o acesso ao que está nele.')){const eid=S.ws;
      db.ref().update({['qgEspacos/'+eid+'/membros/'+S.uid]:null,['qgIndice/'+S.uid+'/'+eid]:null}).then(()=>{delete S.esp[eid];trocaWs('pessoal');}).catch(erroSalvar);} break;
    case 'del-espaco': if(confirm('Excluir o espaço e TUDO que está nele, para todos os membros? Não dá para desfazer.')){const eid=S.ws,e=espAtual();
      const u={};['dados','nome','dono','membros','nomes'].forEach(k=>u['qgEspacos/'+eid+'/'+k]=null);
      Object.keys((e&&e.membros)||{}).forEach(m=>u['qgIndice/'+m+'/'+eid]=null);
      db.ref().update(u).then(()=>{delete S.esp[eid];desligaEsp(eid);trocaWs('pessoal');}).catch(erroSalvar);} break;
  }
});
function erroSalvar(e){ toast('Não consegui salvar. Confira a conexão e as regras do banco.',true); console.error(e); }
function trocaWs(id){
  if(id!=='pessoal'&&!S.esp[id])id='pessoal';
  S.ws=id;S.anx={};S.proj=null;S.nota=null;S.notaProj='';S.busca='';
  try{localStorage.setItem('meuqg_ws_'+S.uid,id);}catch(_){}
  if(S.view==='membros'&&id==='pessoal')S.view='hoje';
  render(true);window.scrollTo(0,0);
}
function abrirNovoEspaco(){
  $('#layer').innerHTML=`<div class="modal" data-act="fecha-modal"><form class="box" data-form="novo-espaco"><label class="f" for="neNome">Nome do espaço</label><input id="neNome" type="text" class="big" placeholder="Ex.: Time Logística" autocomplete="off"><p class="hint" style="margin-top:8px">Um espaço é uma área compartilhada: você escolhe quem entra, e tudo dentro dele é visto e editado por todos os membros.</p><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn pri" type="submit">Criar espaço</button></div></form></div>`;
  setTimeout(()=>{const i=$('#neNome');if(i)i.focus();},30);
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ fechaModal(); return; }
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('tt')){ e.preventDefault(); e.target.blur(); return; }
  if((e.key==='c'||e.key==='C')&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''))&&!e.target.isContentEditable&&S.uid){ e.preventDefault(); abrirCaptura(); return; }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.pc[data-act=abrir]')){ e.preventDefault(); abrirProjeto(e.target.dataset.id); }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.th[data-act=anx-ver]')){ e.preventDefault(); verAnexo(e.target.dataset.id,e.target.dataset.k); }
});
$('#fab').addEventListener('click',abrirCaptura);

document.addEventListener('change',e=>{ const t=e.target; if(t&&t.id==='anxIn'){ addAnexos(t.dataset.id,t.files).then(()=>{t.value='';}); } });
document.addEventListener('paste',e=>{
  if(S.view!=='projetos'||!S.proj)return;
  const fs=[...(e.clipboardData&&e.clipboardData.files||[])]; if(!fs.length)return;
  e.preventDefault(); addAnexos(S.proj,fs);
});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{
  const d=e.target.closest&&e.target.closest('#drop'); if(!d||S.view!=='projetos'||!S.proj)return;
  e.preventDefault();
  if(ev==='dragover')d.classList.add('on'); else d.classList.remove('on');
  if(ev==='drop')addAnexos(S.proj,e.dataTransfer.files);
}));
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]'); if(!f)return; e.preventDefault();
  const k=f.dataset.form;
  const val=sel=>{const i=$(sel,f);return i?i.value.trim():'';};
  if(k==='captura-hoje'){ if(capturar(val('#capH')))f.reset(); }
  else if(k==='captura'){ if(capturar(val('#capC')))f.reset(); }
  else if(k==='captura-modal'){ if(capturar(val('#capM')))fechaModal(); }
  else if(k==='novo-projeto'){ const n=val('#npNome'); if(!n)return; const id=novoProjeto(n); abrirProjeto(id); setTimeout(()=>{const x=$('#pa');if(x)x.focus();},40); }
  else if(k==='diario'){ const t=val('#dIn'); if(!t)return; const id=f.dataset.id; set('projetos/'+id+'/diario/'+newId(),{txt:t,t:now()}); tocaProjeto(id); f.reset(); }
  else if(k==='link'){ const t=val('#lT'); let u=val('#lU'); if(!u)return; if(!/^https?:\/\//i.test(u))u='https://'+u; set('projetos/'+f.dataset.id+'/links/'+newId(),{t:t||u,u}); f.reset(); }
  else if(k==='novo-espaco'){ const n=val('#neNome'); if(!n)return; const eid=db.ref('qgEspacos').push().key; fechaModal();
    db.ref().update({['qgEspacos/'+eid+'/nome']:n,['qgEspacos/'+eid+'/dono']:S.uid,['qgEspacos/'+eid+'/membros/'+S.uid]:true,['qgEspacos/'+eid+'/nomes/'+S.uid]:S.nome||S.email,['qgIndice/'+S.uid+'/'+eid]:true})
      .then(()=>{ ligaEsp(eid); S.ws=eid; S.view='membros'; render(true); toast('Espaço criado. Adicione as pessoas.'); }).catch(erroSalvar); }
  else if(k==='renomear-espaco'){ const n=val('#enome'); if(n)db.ref('qgEspacos/'+S.ws+'/nome').set(n).then(()=>toast('Renomeado')).catch(erroSalvar); }
  else if(k==='add-membro'){ const u=$('#amSel').value; if(!u)return; const eid=S.ws,d=DIR()[u]||{};
    db.ref().update({['qgEspacos/'+eid+'/membros/'+u]:true,['qgEspacos/'+eid+'/nomes/'+u]:d.nome||d.email||'',['qgIndice/'+u+'/'+eid]:true}).then(()=>toast('Pessoa adicionada')).catch(erroSalvar); }
  else if(k==='aguardando'){ const q=val('#agQ'),o=val('#agO'); if(!q&&!o)return; const sp=$('#agP',f); const pid=f.dataset.proj||(sp?sp.value:'');
    set('aguardando/'+newId(),Object.assign(autor(),{quem:q,oque:o,projetoId:pid||'',desde:now(),feito:false})); if(pid)tocaProjeto(pid); f.reset(); toast('Adicionado'); }
});

/* edição de campos (salva ao sair do campo / ao mudar) */
let nTimer=null;
document.addEventListener('change',e=>{
  const t=e.target; if(!t.dataset)return;
  if(t.dataset.actChange==='ws'){ trocaWs(t.value); return; }
  if(t.id==='fNP'){ S.notaProj=t.value; render(false); return; }
  if(t.dataset.f&&t.dataset.id){
    let v=t.value; const f=t.dataset.f;
    if(f==='progresso')v=+v; if(f==='nome'){v=v.trim(); if(!v){render(false);return;}}
    const ex={[f]:v}; if(f==='progresso'&&v===100&&(obj('projetos')[t.dataset.id]||{}).status!=='concluido'){}
    tocaProjeto(t.dataset.id,ex);
  } else if(t.dataset.ag){ upd('aguardando/'+t.dataset.id,{[t.dataset.ag]:t.value.trim()}); }
  else if(t.dataset.nf){ salvaNota(t); }
});
document.addEventListener('input',e=>{
  const t=e.target; if(!t.dataset)return;
  if(t.id==='busca'){ S.busca=t.value; const pos=t.selectionStart; render(false); const n=$('#busca'); if(n){n.focus();n.setSelectionRange(pos,pos);} return; }
  if(t.id==='pr'){ const v=$('#prv'),b=$('#prb'),c=corProg(t.value); if(v){v.textContent=t.value+'%';v.style.color=c;} if(b){b.style.width=t.value+'%';b.style.background=c;} t.style.accentColor=c; return; }
  if(t.dataset.nf){ const s=$('#saved'); if(s)s.textContent='Salvando…'; clearTimeout(nTimer); nTimer=setTimeout(()=>salvaNota(t),600); }
});
function salvaNota(t){
  const id=t.dataset.id; if(!obj('notas')[id])return;
  upd('notas/'+id,{[t.dataset.nf]:t.value,atualizadoEm:now()}).then(()=>{ const s=$('#saved'); if(s)s.textContent='Salvo'; });
  if(t.dataset.nf==='projetoId'&&t.value)tocaProjeto(t.value);
}

/* ---------- boot ---------- */
let started=false;
function start(){
  if(started)return; started=true;
  db=firebase.database();
  firebase.auth().onAuthStateChanged(u=>{
    if(!u)return;
    S.uid=u.uid;S.email=u.email||'';
    $('#meMail').textContent=S.email;
    $('#app').hidden=false;$('#fab').hidden=false;
    const h=location.hash.slice(1); S.view=VIEWS.includes(h)?h:'hoje';
    render(true);
    const nomeBase=(S.email||'').split('@')[0];
    db.ref('centralApps/usuarios/'+u.uid).once('value').then(sn=>{ const d=sn.val()||{}; S.nome=d.nome||nomeBase;
      if(d.admin===true)db.ref('centralApps/usuarios').once('value').then(all=>{ const v=all.val()||{}; S.dirAdm={}; Object.keys(v).forEach(k=>{ const x=v[k]||{}; S.dirAdm[k]={nome:x.nome||(x.email||'').split('@')[0],email:x.email||''}; }); if(S.view==='membros')renderSafe(); }).catch(()=>{});
      db.ref('qgDiretorio/'+u.uid).set({nome:S.nome,email:S.email}).catch(()=>{}); }).catch(()=>{ db.ref('qgDiretorio/'+u.uid).set({nome:nomeBase,email:S.email}).catch(()=>{}); });
    db.ref('qgDiretorio').on('value',sn=>{ S.dir=sn.val()||{}; if(S.view==='membros')renderSafe(); },()=>{});
    db.ref('qgIndice/'+u.uid).on('value',sn=>{
      const ids=Object.keys(sn.val()||{});
      ids.forEach(ligaEsp);
      Object.keys(espOff).forEach(id=>{ if(!ids.includes(id))soltaEsp(id); });
    },()=>{});
    /* um ouvinte por coleção: assim os arquivos (pesados) NÃO são baixados junto com a lista */
    ['projetos','notas','aguardando','inbox','config'].forEach(k=>{
      db.ref(PES()+'/'+k).on('value',sn=>{ S.d[k]=sn.val()||{}; renderSafe(); },
        err=>{ console.error(err); toast('Sem permissão para ler seus dados. Falta publicar as regras do banco.',true); });
    });
  });
}
const espOff={};
function ligaEsp(id){
  if(espOff[id])return;
  const E={dados:{}},offs=[];
  const on=(path,fn)=>{ const r=db.ref('qgEspacos/'+id+'/'+path); const cb=sn=>fn(sn.val()); r.on('value',cb,()=>soltaEsp(id)); offs.push(()=>r.off('value',cb)); };
  ['nome','dono','nomes'].forEach(k=>on(k,v=>{ E[k]=v; renderSafe(); }));
  on('membros',v=>{ if(!v||!v[S.uid]){ soltaEsp(id); return; } E.membros=v; S.esp[id]=E; renderSafe(); });
  ['projetos','notas','aguardando'].forEach(k=>on('dados/'+k,v=>{ E.dados[k]=v||{}; renderSafe(); }));
  espOff[id]=()=>offs.forEach(f=>f());
}
function desligaEsp(id){ if(espOff[id]){espOff[id]();delete espOff[id];} }
function soltaEsp(id){
  desligaEsp(id); delete S.esp[id];
  if(S.ws===id){ trocaWs('pessoal'); toast('Você não tem mais acesso a esse espaço.'); } else renderSafe();
}
window.__startApp=start;
if(window.__gateOk)start();
})();
</script>
