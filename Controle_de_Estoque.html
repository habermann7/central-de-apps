    const code = addrCode({ rua: r, estante: e, prateleira: p, nivel: n });
    if (S.addresses[code]) continue;
    ops.push(op('addresses', { id: code, rua: r, corredor: '', estante: e, prateleira: p, nivel: n, posicao: '', capacity: cap, type: 'storage', blocked: false, createdAt: isoNow() }));
  }
  if (ops.length) { ops.push(auditOp(user, 'ENDERECOS_GERADOS', ops.length + ' endereços')); await commit(ops); }
  return ops.length ? ops.length - 1 : 0;
}
async function setAddressBlocked(user, code, blocked, reason) {

}
async function saveSettings(user, d) {

/* ---- recebimento ---- */
async function receiveItem(user, ctx, it) {
  need(user, 'receive');
  const docNo = norm(ctx.doc);
  if (!docNo) fail('Informe a nota fiscal ou o documento de recebimento.', 'DOC');
  const p = S.products[norm(it.productId)];
  if (!p) fail('Produto não cadastrado.', 'NAOCAD');
  if (!p.active) fail('Produto inativo: recebimento não permitido.', 'INATIVO');
  const qty = Number(it.qty);
  if (!Number.isInteger(qty) || qty <= 0) fail('Informe a quantidade recebida (inteiro maior que zero).', 'QTD');
  const lotNo = norm(it.lotNo);
  if (!lotNo) fail('Entrada sem identificação do lote não é permitida.', 'LOTE');
  if (!it.expiry) fail('Entrada sem data de validade não é permitida.', 'VALIDADE');
  if (!validDate(it.expiry)) fail('Data de validade inválida.', 'VALIDADE');
  const authOk = !!(it.authUser && can(it.authUser, 'approve'));
  const expired = daysUntil(it.expiry) < 0;
  if (expired && !authOk) fail('Produto vencido: só entra com autorização de responsável e fica bloqueado (quarentena).', 'VENCIDO');
  if (it.mfg) {
    if (!validDate(it.mfg)) fail('Data de fabricação inválida.', 'VALIDADE');
    if (it.mfg > it.expiry) fail('A fabricação não pode ser posterior à validade.', 'VALIDADE');
    if (it.mfg > todayStr()) fail('A fabricação não pode estar no futuro.', 'VALIDADE');
  }
  const demand = ctx.demandId ? S.demands[ctx.demandId] : null;
  if (ctx.demandId && !demand) fail('Demanda não encontrada.', 'DEMANDA');
  if (demand && demand.status !== 'aberta') fail('Esta demanda não está aberta para conferência.', 'DEMANDA');
  const divs = demand ? receiptDivergences(demand, p, { lotNo, expiry: it.expiry, mfg: it.mfg }) : [];
  if (expired) divs.push({ code: 'VENCIDO', text: 'produto vencido em ' + it.expiry });
  const needJust = divs.filter(d => d.code !== 'VENCIDO');
  if (needJust.length || expired) {
    if (!authOk) fail('Divergência no recebimento: ' + divs.map(d => d.text).join('; ') + '. Informe a justificativa e obtenha autorização de responsável.', 'DIVERG');
    if (!String(it.justification || '').trim()) fail('Informe a justificativa da divergência: ' + divs.map(d => d.text).join('; ') + '.', 'JUST');
  }
  const exp = demand ? null : ((it.expected === '' || it.expected == null) ? null : Number(it.expected));
  if (exp !== null && exp !== qty && !String(it.justification || '').trim()) fail(`Quantidade recebida (${qty}) diverge da esperada (${exp}): informe a justificativa.`, 'DIVERGE');
  const release = (it.release === 'quarentena' || expired) ? 'quarentena' : 'liberado';
  return withProductLocks([p.id], async () => {
    if (ctx.receiptId) await Store.refreshDoc('receipts', ctx.receiptId);
    let lot = findLot(p.id, lotNo), isNewLot = false;
    if (lot && lot.expiry !== it.expiry) fail(`O lote ${lotNo} já existe com validade ${lot.expiry}.`, 'LOTE_VALIDADE');
    const dup = Object.values(S.receipts).some(r => norm(r.doc) === docNo && r.items.some(x => x.productId === p.id && x.lotNo === lotNo));
    if (dup && !authOk) fail('Recebimento duplicado (mesmo documento, produto e lote): exige autorização de responsável.', 'DUP');
    const rcOld = ctx.receiptId && S.receipts[ctx.receiptId];
    const rc = rcOld ? clone(rcOld) : { id: uid('RC'), doc: docNo, supplier: String(ctx.supplier || '').trim(), user: user.id, userName: user.name, ts: isoNow(), status: 'aberto', items: [] };
    if (demand && !rc.demandId) { rc.demandId = demand.id; rc.demandFile = demand.fileName; }
    if (!lot) {
      isNewLot = true;
      lot = { id: uid('L'), productId: p.id, lotNo, mfg: it.mfg || '', expiry: it.expiry, status: release, receivedAt: isoNow(), receiptId: rc.id, createdBy: user.id };
    }
    const just = String(it.justification || '').trim();
    rc.items.push({ productId: p.id, lotNo, lotId: lot.id, qty, expected: exp, justification: just, expiry: it.expiry, mfg: it.mfg || '', release: lot.status, ts: isoNow(), user: user.id, dupAuth: dup ? it.authUser.id : null, divergences: divs.map(d => d.text), authBy: divs.length && authOk ? it.authUser.id : null });
    const mv = mkMove(user, lot, { type: 'RECEBIMENTO', toAddr: DOCA, qty, ref: docNo, reason: just, authBy: (dup || divs.length) && authOk ? it.authUser.id : null });
    const extra = [op('receipts', rc)];
    if (isNewLot) extra.push(op('lots', lot));
    divs.forEach(d => {
      const o = occOp(user, 'DIVERGENCIA_RECEBIMENTO', `${docNo}: ${p.name} lote ${lotNo} - ${d.text}`, { demandId: demand ? demand.id : null, productId: p.id, lotNo, kind: d.code });
      o.data.justification = just; o.data.authBy = it.authUser.id; extra.push(o);
    });
    await postMoves([mv], extra);
    return { lot, move: mv, receipt: rc, divergences: divs };
  });
}
async function closeReceipt(user, id, o) {
  need(user, 'receive'); o = o || {};
  const rc = S.receipts[id]; if (!rc) fail('Recebimento não encontrado.', 'VALID');
  if (rc.status === 'concluído') fail('Este recebimento já foi finalizado.', 'VALID');
  if (!rc.items.length) fail('Registre ao menos um item antes de finalizar.', 'VALID');
  const extra = [], res = { divergences: [] };
  const demand = rc.demandId && S.demands[rc.demandId];
  let treatments = {}, authBy = null;
  if (demand) {
    const bad = demandCompare(demand.id).filter(r => r.status !== 'ok');
    if (bad.length) {
      if (!o.authUser || !can(o.authUser, 'approve')) fail('Há divergências de quantidade: o encerramento exige justificativa e autorização de responsável.', 'DIVERG_PEND');
      authBy = o.authUser.id;
      for (const r of bad) {
        const j = String((o.treatments || {})[r.key] || '').trim();
        if (!j) fail('Informe a justificativa para: ' + r.name + ' (' + r.label + ').', 'JUST');
        treatments[r.key] = j;
        const oc = occOp(user, 'DIVERGENCIA_RECEBIMENTO', `${rc.doc}: ${r.name} - ${r.label}: previsto ${r.expected}, recebido ${r.received}`, { demandId: demand.id, productId: r.productId, kind: r.status });
        oc.data.justification = j; oc.data.authBy = authBy; extra.push(oc); res.divergences.push(r);
      }
    }
    extra.push(op('demands', Object.assign({}, demand, { status: 'concluída', closedAt: isoNow(), closedBy: user.id })));
  }
  const pend = new Set(rc.items.map(i => i.lotId)).size;
  await commit([op('receipts', Object.assign({}, rc, { status: 'concluído', closedAt: isoNow(), closedBy: user.id, treatments, closeAuth: authBy })), ...extra,
    auditOp(user, 'RECEBIMENTO_FINALIZADO', rc.doc + ' - ' + pend + ' tarefa(s) de armazenagem criada(s)' + (res.divergences.length ? ', ' + res.divergences.length + ' divergência(s) tratada(s)' : ''))]);
  return res;
}

/* ---- armazenagem / transferência ---- */
async function storeStock(user, o) {
  need(user, 'store');
  const lot0 = S.lots[o.lotId]; if (!lot0) fail('Lote não encontrado.', 'LOTE');
  const kind = o.kind === 'TRANSFERENCIA' ? 'TRANSFERENCIA' : 'ARMAZENAGEM';
  return withProductLocks([lot0.productId], async () => {
    const lot = S.lots[o.lotId], p = S.products[lot.productId];
    const to = getAddr(o.toAddr), from = getAddr(o.fromAddr);
    if (!from) fail('Endereço de origem inexistente.', 'ENDERECO');
    if (!to) fail('Endereço de destino inexistente.', 'ENDERECO');
    if (to.id === DOCA) fail('Não é possível armazenar de volta na doca de recebimento.', 'ENDERECO');
    if (to.blocked) fail(`Endereço ${to.id} bloqueado: armazenamento não permitido.`, 'BLOQ');
    if (to.id === from.id) fail('Origem e destino são o mesmo endereço.', 'ENDERECO');
    if (kind === 'ARMAZENAGEM' && from.id !== DOCA) fail('Armazenagem parte da doca de recebimento. Use Transferência entre endereços.', 'ENDERECO');
    if (kind === 'TRANSFERENCIA' && from.id === DOCA) fail('Para sair da doca use Armazenagem.', 'ENDERECO');
    if (p.allowed.length && !p.allowed.includes(to.id)) fail(`Endereço ${to.id} não é permitido para ${p.name}.`, 'NAOPERMITIDO');
    const qty = Number(o.qty);
    if (!Number.isInteger(qty) || qty <= 0) fail('Quantidade inválida.', 'QTD');
    if (to.capacity > 0 && occupancy(to.id) + qty > to.capacity) fail(`Capacidade excedida em ${to.id}: ocupação ${occupancy(to.id)} + ${qty} > ${to.capacity}.`, 'CAPACIDADE');
    let authBy = null;
    if (kind === 'TRANSFERENCIA') {
      if (!String(o.reason || '').trim()) fail('Informe o motivo da transferência.', 'VALID');
      if (!o.authUser || !can(o.authUser, 'approve')) fail('Transferência entre endereços exige autorização de responsável.', 'AUTH');
      authBy = o.authUser.id;
    }
    const mv = mkMove(user, lot, { type: kind, fromAddr: from.id, toAddr: to.id, qty, reason: o.reason || '', authBy, scans: o.scans || [] });
    await postMoves([mv]);
    return mv;
  });
}

/* ---- pedidos e FEFO ---- */
function allocate(productId, qty, pend) {
  const rows = Object.values(S.stock).filter(r => {
    if (r.productId !== productId || r.addr === DOCA) return false;
    const a = S.addresses[r.addr], l = S.lots[r.lotId];
    return a && !a.blocked && pickable(l) && (freeQty(r) - (pend[r.id] || 0)) > 0;
  }).sort(fefoCmp);
  let left = qty; const picks = [];
  for (const r of rows) {
    if (left <= 0) break;
    const take = Math.min(left, freeQty(r) - (pend[r.id] || 0));
    picks.push({ rowId: r.id, lotId: r.lotId, addr: r.addr, qty: take });
    pend[r.id] = (pend[r.id] || 0) + take; left -= take;
  }
  return { picks, short: left };
}
async function createOrder(user, d) {
  need(user, 'orders');
  const number = norm(d.number);
  if (!number || !ID_RE.test(number)) fail('Número do pedido inválido (letras, números e - _ .).', 'VALID');
  const id = 'PED-' + number;
  const lines = (d.lines || []).map(l => ({ productId: norm(l.productId), qty: Number(l.qty) }));
  if (!lines.length) fail('Inclua ao menos um item no pedido.', 'VALID');
  for (const l of lines) {
    if (!S.products[l.productId]) fail('Produto inexistente no pedido: ' + l.productId, 'VALID');
    if (!S.products[l.productId].active) fail('Produto inativo: ' + l.productId, 'VALID');
    if (!Number.isInteger(l.qty) || l.qty <= 0) fail('Quantidade inválida no pedido.', 'VALID');
  }
  return withProductLocks(lines.map(l => l.productId), async () => {
    await Store.refreshDoc('orders', id);
    if (S.orders[id]) fail('Já existe um pedido com este número.', 'DUP');
    const pend = {}, picks = [], shorts = [];
    lines.forEach((l, li) => {
      const r = allocate(l.productId, l.qty, pend);
      r.picks.forEach(pk => {
        const lot = S.lots[pk.lotId];
        picks.push({ id: 'k' + picks.length, line: li, productId: l.productId, lotId: pk.lotId, lotNo: lot.lotNo, expiry: lot.expiry, addr: pk.addr, qty: pk.qty, done: 0, status: 'pendente' });
      });
      if (r.short > 0) shorts.push({ productId: l.productId, qty: r.short });
    });
    picks.sort((a, b) => a.addr.localeCompare(b.addr) || a.expiry.localeCompare(b.expiry));
    picks.forEach((p, i) => { p.id = 'k' + i; });
    const rows = {};
    picks.forEach(pk => { const rid = rowId(pk.lotId, pk.addr); rows[rid] = rows[rid] || clone(S.stock[rid]); rows[rid].reserved += pk.qty; });
    const ord = { id, number, client: String(d.client || '').trim(), lines, picks, shorts, status: picks.length ? 'Aberto' : 'Sem estoque', createdBy: user.id, createdAt: isoNow() };
    const ops = [op('orders', ord), ...Object.values(rows).map(r => op('stock', r)), auditOp(user, 'PEDIDO_CRIADO', number)];
    shorts.forEach(s => ops.push(occOp(user, 'FALTA_ESTOQUE', `Pedido ${number}: faltam ${s.qty} un. de ${S.products[s.productId].name} (${s.productId}).`, { kind: 'order', id })));
    await commit(ops);
    return ord;
  });
}
async function cancelOrder(user, id, reason) {
  need(user, 'orders');
  const o0 = S.orders[id]; if (!o0) fail('Pedido não encontrado.', 'VALID');
  return withProductLocks([...new Set(o0.picks.map(p => p.productId))], async () => {
    await Store.refreshDoc('orders', id);
    const o = S.orders[id];
    if (!['Aberto', 'Sem estoque'].includes(o.status) || o.picks.some(p => p.status !== 'pendente')) fail('Só é possível cancelar pedidos sem itens separados.', 'STATUS');
    if (!String(reason || '').trim()) fail('Informe o motivo do cancelamento.', 'VALID');
    const rows = {};
    o.picks.forEach(pk => { const rid = rowId(pk.lotId, pk.addr); rows[rid] = rows[rid] || clone(S.stock[rid]); rows[rid].reserved = Math.max(0, rows[rid].reserved - pk.qty); });
    await commit([op('orders', Object.assign({}, o, { status: 'Cancelado', cancelReason: reason, cancelledAt: isoNow(), cancelledBy: user.id })), ...Object.values(rows).map(r => op('stock', r)), auditOp(user, 'PEDIDO_CANCELADO', o.number + ' - ' + reason)]);
  });
}
async function forwardOrder(user, id) {
  if (!(can(user, 'orders') || can(user, 'pick'))) fail('Sem permissão para esta operação.', 'PERM');
  const o = S.orders[id]; if (!o || o.status !== 'Separado') fail('Só pedidos separados podem seguir para a próxima etapa.', 'STATUS');
  await commit([op('orders', Object.assign({}, o, { status: 'Encaminhado', forwardedAt: isoNow(), forwardedBy: user.id })), auditOp(user, 'PEDIDO_ENCAMINHADO', o.number)]);
}

/* ---- separação com bipagem ---- */
async function pickConfirm(user, o) {
  need(user, 'pick');
  const ord0 = S.orders[o.orderId]; if (!ord0) fail('Pedido não encontrado.', 'VALID');
  return withProductLocks([...new Set(ord0.picks.map(p => p.productId))], async () => {
    await Store.refreshDoc('orders', o.orderId);
    const ord = S.orders[o.orderId];
    if (!ord || !['Aberto', 'Em separação'].includes(ord.status)) fail('Pedido não está disponível para separação.', 'STATUS');
    const pk = ord.picks.find(p => p.id === o.pickId);
    if (!pk || pk.status !== 'pendente') fail('Este item já foi separado ou está indisponível.', 'STATUS');
    const prod = resolveProduct(o.prodScan);
    if (!prod || prod.id !== pk.productId) fail('Produto bipado diferente do solicitado.', 'PRODUTO');
    const addr = norm(o.addrScan);
    if (!addr) fail('Bipe o endereço de origem.', 'ENDERECO');
    const c = cfg(), lotNo = norm(o.lotScan);
    if (c.requireLotConfirm && !lotNo) fail('Confirme o lote impresso na embalagem.', 'LOTE');
    const lot = lotNo ? findLot(pk.productId, lotNo) : S.lots[pk.lotId];
    if (!lot) fail('Lote informado não existe para este produto.', 'LOTE');
    if (!pickable(lot)) fail(`Lote ${lot.lotNo} está ${lotState(lot)}: separação não permitida.`, 'LOTE_BLOQ');
    const exception = lot.id !== pk.lotId || addr !== pk.addr;
    if (exception && !(o.authUser && can(o.authUser, 'approve'))) fail('Endereço ou lote diferente do indicado: exige autorização de responsável.', 'AUTH');
    const row = getRow(lot.id, addr);
    if (!row || row.qty <= 0) fail('Não há saldo deste lote no endereço bipado.', 'SALDO');
    const qty = Number(o.qty);
    if (!Number.isInteger(qty) || qty < 0) fail('Quantidade inválida.', 'QTD');
    if (qty > pk.qty) fail(`Quantidade superior à solicitada (${pk.qty}).`, 'QTD');
    const short = qty < pk.qty;
    if (short && !String(o.shortReason || '').trim()) fail('Quantidade inferior à solicitada: informe o motivo (será registrada uma ocorrência).', 'OCORRENCIA');
    const plannedRid = rowId(pk.lotId, pk.addr);
    const moves = [], releases = [];
    if (qty > 0) {
      moves.push(mkMove(user, lot, { type: 'SEPARACAO', fromAddr: addr, qty, ref: ord.number, reason: short ? o.shortReason : '', authBy: exception ? o.authUser.id : null, useReserved: exception ? 0 : pk.qty, scans: o.scans || [] }));
      if (exception) releases.push({ rowId: plannedRid, qty: pk.qty });
    } else releases.push({ rowId: plannedRid, qty: pk.qty });
    const picks = ord.picks.map(p => p.id !== pk.id ? p : Object.assign({}, p, { done: qty, status: qty === 0 ? 'sem saldo' : short ? 'parcial' : 'separado', by: user.id, ts: isoNow(), lotUsed: lot.lotNo, addrUsed: addr, exception, authBy: exception ? o.authUser.id : null, scans: o.scans || [] }));
    const allDone = picks.every(p => p.status !== 'pendente');
    const nord = Object.assign({}, ord, { picks, status: allDone ? 'Separado' : 'Em separação', hasShortage: !!(ord.hasShortage || short || (ord.shorts || []).length) });
    if (allDone) { nord.separatedAt = isoNow(); nord.nextStage = 'Montagem / Expedição'; }
    const extra = [op('orders', nord)];
    if (short) extra.push(occOp(user, 'SEPARACAO_PARCIAL', `Pedido ${ord.number}: separado ${qty} de ${pk.qty} (${prod.name}). Motivo: ${o.shortReason}`, { kind: 'order', id: ord.id }));
    if (exception) extra.push(auditOp(user, 'EXCECAO_SEPARACAO', `${ord.number}: planejado ${pk.lotNo}@${pk.addr}, usado ${lot.lotNo}@${addr}; autorizado por ${o.authUser.id}`));
    await postMoves(moves, extra, releases);
    return { order: nord, move: moves[0] || null };
  });
}

/* ---- saídas manuais ---- */
const EXIT_TYPES = { TRANSFERENCIA_EXTERNA: 'Transferência para outra unidade', DEVOLUCAO_FORNECEDOR: 'Devolução ao fornecedor', AVARIA_DESCARTE: 'Avaria ou descarte', OUTRA: 'Outra saída autorizada' };
async function exitStock(user, o) {
  need(user, 'exit');
  if (!EXIT_TYPES[o.type]) fail('Tipo de saída inválido.', 'VALID');
  const lot0 = S.lots[o.lotId]; if (!lot0) fail('Lote não encontrado.', 'LOTE');
  return withProductLocks([lot0.productId], async () => {
    const lot = S.lots[o.lotId];
    if (!String(o.reason || '').trim()) fail('Informe a justificativa da saída.', 'VALID');

  });
}

/* ---- estorno ---- */
async function reverseMove(user, moveId, reason, authUser) {
  if (!(can(user, 'approve') || can(user, 'history'))) fail('Sem permissão para esta operação.', 'PERM');
  if (!authUser || !can(authUser, 'approve')) fail('Estorno exige autorização de responsável.', 'AUTH');
  if (!String(reason || '').trim()) fail('Informe o motivo do estorno.', 'VALID');
  const m = S.moves[moveId]; if (!m) fail('Movimentação não encontrada.', 'VALID');
  if (m.type === 'ESTORNO') fail('Um estorno não pode ser estornado.', 'VALID');
  if (m.type === 'ENVIO_EXP' || m.type === 'RETORNO_EXP') fail('Movimento de remessa à expedição: use Expedição, Remessas (cancelar ou tratar).', 'VALID');
  if (m.type === 'SEPARACAO') fail('Separação vinculada a pedido: registre ocorrência e corrija por ajuste de inventário.', 'VALID');
  return withProductLocks([m.productId], async () => {
    if (Object.values(S.moves).some(x => x.reverses === moveId)) fail('Esta movimentação já foi estornada.', 'DUP');
    const lot = S.lots[m.lotId];
    const mv = mkMove(user, lot, { type: 'ESTORNO', reverses: m.id, fromAddr: m.toAddr, toAddr: m.fromAddr, qty: m.qty, reason, authBy: authUser.id, ref: m.ref || '' });
    await postMoves([mv], [auditOp(user, 'ESTORNO', `${m.type} ${m.id}: ${reason}`)]);
    return mv;
  });
}
function isReversed(id) { return Object.values(S.moves).some(x => x.reverses === id); }

/* ---- lotes ---- */
async function setLotStatus(user, lotId, status, reason, ref) {
  need(user, 'lots');
  const l = S.lots[lotId]; if (!l) fail('Lote não encontrado.', 'LOTE');
  if (!['liberado', 'quarentena', 'bloqueado'].includes(status)) fail('Status inválido.', 'VALID');

function niceMax(v) {

}

}

async function estanteLogin() {
  const fu = firebase.auth().currentUser; if (!fu) { user = null; return; }
  const email = String(fu.email || '').toLowerCase();
  let id = email.split('@')[0].replace(/[^a-z0-9_.\-]/g, '.').replace(/^\.+|\.+$/g, '');
  if (id.length < 3) id = (id + 'usr').slice(0, 30);
  id = id.slice(0, 30);
  if (S.users[id] && S.users[id].email && S.users[id].email !== email) id = id.slice(0, 24) + '.' + fu.uid.slice(0, 4).toLowerCase();
  Env.me = { id, email, uid: fu.uid };
  let isAdm = false;
  try { isAdm = (await firebase.database().ref('centralApps/usuarios/' + fu.uid + '/admin').once('value')).val() === true; } catch (e) { isAdm = false; }
  let u = S.users[id];
  if (!u) {
    const first = !Object.keys(S.users).length, boss = first || isAdm;
    const nm = String(fu.displayName || '').trim() || id.split(/[._\-]/).filter(Boolean).map(w => w[0].toUpperCase() + w.slice(1)).join(' ');
    u = { id, name: nm, email, role: boss ? 'admin' : 'recebimento', active: boss, pending: !boss, createdAt: isoNow() };
    await commit([op('users', u), auditOp(u, boss ? 'USUARIO_CRIADO' : 'ACESSO_SOLICITADO', id + ' (' + email + ')')]);
  }
  Env.pending = !u.active;
  user = u.active ? u : null;
}

  });
  return a;
}

  }));
  const mv = Object.values(S.moves);

    const a = x.pid ? availOf(x.pid) : { lib: 0, quar: 0, bloq: 0, venc: 0, doca: 0 };
    const rec = x.pid ? mv.filter(m => m.productId === x.pid && m.type === 'RECEBIMENTO' && m.ts >= x.since).reduce((s, m) => s + m.qty, 0) : 0;
    const saiu = x.pid ? mv.filter(m => m.productId === x.pid && ['SAIDA', 'SEPARACAO', 'ENVIO_EXP'].includes(m.type) && m.ts >= x.since).reduce((s, m) => s + m.qty, 0) - mv.filter(m => m.productId === x.pid && m.type === 'RETORNO_EXP' && m.ts >= x.since).reduce((s, m) => s + m.qty, 0) : 0;
    const cexp = x.pid ? Object.values(S.remessas).filter(r => r.createdAt >= x.since).flatMap(r => r.lines).filter(l => l.productId === x.pid).reduce((s, l) => s + (l.conf || 0), 0) : 0;

/* ---- Firebase (Estante): mesmo contrato do banco usado pelo app. Cada documento é gravado como texto JSON para não perder listas vazias. ---- */
const FB = { enc: id => String(id).replace(/[.#$\[\]\/%]/g, c => '%' + c.charCodeAt(0).toString(16).toUpperCase().padStart(2, '0')) };
function makeFbDb() {
  const root = firebase.database().ref('controleEstoque');
  const wrap = snap => { const docs = []; snap.forEach(ch => { const v = ch.val(); if (v && v.j) { try { const d = JSON.parse(v.j); docs.push({ id: d.id, data: () => d }); } catch (e) { /* documento ilegível */ } } }); return docs; };
  return {
    collection(c) {
      const ref = root.child(c);
      return {
        onSnapshot(ok, bad) { ref.on('value', s => ok({ docs: wrap(s), metadata: { fromCache: false } }), e => { if (bad) bad(e); }); },
        where(f, o, v) { return { get: () => ref.orderByChild('p').equalTo(String(v)).once('value').then(s => ({ docs: wrap(s) })) }; }
      };
    },
    doc(path) {
      const i = path.indexOf('/'), c = path.slice(0, i), id = path.slice(i + 1), ref = root.child(c).child(FB.enc(id));
      return {
        get: () => ref.once('value').then(s => { const v = s.val(), d = v && v.j ? JSON.parse(v.j) : null; return { exists: !!d, data: () => d }; }),
        set: data => ref.set({ j: JSON.stringify(data), p: data.productId || null }),
        delete: () => ref.remove(),
        acquire: o => firebase.database().ref('controleEstoque/locks/' + FB.enc(id)).transaction(cur => { const now = Date.now(); if (cur && cur.exp > now && cur.holder !== o.holder) return; return { holder: o.holder, exp: now + o.ttlMs }; }).then(r => ({ acquired: !!r.committed })),
        release: holder => firebase.database().ref('controleEstoque/locks/' + FB.enc(id)).transaction(cur => (cur && cur.holder === holder) ? null : cur).then(() => {})
      };
    }
  };
}

/* ===== Expedição: o estoque envia uma remessa e a expedição confere bipando ===== */
const REM_ST = { enviada: ['Em trânsito', 'warn'], conferencia: ['Em conferência', 'info'], conferida: ['Conferida', 'ok'], divergente: ['Com divergência', 'bad'], tratada: ['Tratada', 'muted'], cancelada: ['Cancelada', 'muted'] };
const remBadge = r => badge(REM_ST[r.status][0], REM_ST[r.status][1]);
const remOpen = r => r.status === 'enviada' || r.status === 'conferencia';
const remTotals = r => ({ qty: r.lines.reduce((s, l) => s + l.qty, 0), conf: r.lines.reduce((s, l) => s + (l.conf || 0), 0) });
function remNumber() {
  const d = todayStr().replace(/-/g, '').slice(2); let n = Object.values(S.remessas).filter(r => r.id.indexOf('REM-' + d) === 0).length + 1, id;
  do { id = 'REM-' + d + '-' + String(n++).padStart(2, '0'); } while (S.remessas[id]);
  return id;
}
/* envio: a mercadoria sai do endereço e fica "em trânsito" até a expedição conferir */
async function createRemessa(user, o) {
  need(user, 'ship');
  const lines = o.lines || []; if (!lines.length) fail('Inclua ao menos um item na remessa.', 'VALID');
  const pids = lines.map(l => { const lot = S.lots[l.lotId]; if (!lot) fail('Lote não encontrado.', 'LOTE'); return lot.productId; });
  return withProductLocks(pids, async () => {
    const id = remNumber(), moves = [], out = [];
    for (const l of lines) {
      const lot = S.lots[l.lotId], qty = Number(l.qty);
      if (!pickable(lot)) fail('Lote ' + lot.lotNo + ' está ' + lotState(lot) + ': não pode ir para a expedição.', 'LOTE_BLOQ');
      if (!Number.isInteger(qty) || qty < 1) fail('Quantidade inválida na remessa.', 'QTD');
      if (l.fromAddr === DOCA || !S.addresses[l.fromAddr]) fail('Envie só o que já está guardado em um endereço. Guarde antes em Mover.', 'ENDERECO');
      moves.push(mkMove(user, lot, { type: 'ENVIO_EXP', fromAddr: l.fromAddr, toAddr: null, qty, ref: id, reason: o.note || '', scans: [{ step: 'origem', value: l.fromAddr, ok: true }] }));
      out.push({ productId: lot.productId, lotId: lot.id, lotNo: lot.lotNo, expiry: lot.expiry, fromAddr: l.fromAddr, qty, conf: 0 });
    }
    const rem = { id, status: 'enviada', lines: out, pedido: String(o.pedido || '').trim().toUpperCase(), note: String(o.note || '').trim(), createdAt: isoNow(), createdBy: user.id, createdByName: user.name, scans: [] };
    await postMoves(moves, [op('remessas', rem), auditOp(user, 'REMESSA_ENVIADA', id + ': ' + out.length + ' item(ns), ' + out.reduce((s, l) => s + l.qty, 0) + ' un')]);
    return rem;
  });
}
/* conferência: cada bipe confere o produto contra a remessa; o que não bate é recusado com aviso */
async function remScan(user, id, o) {
  need(user, 'recvexp');
  await Store.refreshDoc('remessas', id);
  const cur = S.remessas[id]; if (!cur) fail('Remessa não encontrada.', 'VALID');
  if (!remOpen(cur)) fail('Esta remessa não está aberta para conferência.', 'STATUS');
  const r = clone(cur), qty = Number(o.qty || 1); if (!Number.isInteger(qty) || qty < 1) fail('Quantidade por bipe inválida.', 'QTD');
  let i = o.lineIdx;
  if (o.code != null) {
    const p = resolveProduct(o.code);
    if (!p) fail('PRODUTO DESCONHECIDO: o código ' + o.code + ' não é de nenhum produto cadastrado.', 'FORA');
    const idx = r.lines.map((l, k) => l.productId === p.id ? k : -1).filter(k => k >= 0);
    if (!idx.length) fail('FORA DA REMESSA: ' + p.name + ' não consta em ' + id + '. Separe e não confira este item.', 'FORA');
    if (idx.length === 1) i = idx[0]; else if (o.lotNo) i = idx[0];
    else if (!idx.includes(i) && !o.lotNo) fail(p.name + ' veio em ' + idx.length + ' lotes nesta remessa (' + idx.map(k => r.lines[k].lotNo).join(', ') + '). Toque no lote que você está conferindo e bipe de novo.', 'LOTE');
  }
  if (o.code != null && o.lotNo) {
    const same = r.lines.map((x, k) => (x.productId === r.lines[i].productId && x.lotNo === norm(o.lotNo)) ? k : -1).filter(k => k >= 0);
    if (same.length) i = same[0];
    else fail('LOTE DIFERENTE: a caixa é do lote ' + norm(o.lotNo) + ', mas a remessa enviou ' + [...new Set(r.lines.filter(x => x.productId === r.lines[i].productId).map(x => x.lotNo))].join(', ') + '.', 'LOTE');
  }
  const l = r.lines[i]; if (!l) fail('Linha da remessa não encontrada.', 'VALID');
  if (o.expiry && l.expiry && o.expiry !== l.expiry) fail('VALIDADE DIFERENTE: a caixa vence em ' + fmtD(o.expiry) + ', mas o lote ' + l.lotNo + ' foi enviado com validade ' + fmtD(l.expiry) + '.', 'LOTE');
  if ((l.conf || 0) + qty > l.qty) fail('A MAIS DO QUE O ENVIADO: ' + prodName(l.productId) + ' lote ' + l.lotNo + ' foi enviado com ' + l.qty + ' un e já tem ' + (l.conf || 0) + ' conferidas.', 'EXCESSO');
  l.conf = (l.conf || 0) + qty; r.status = 'conferencia';
  r.scans = (r.scans || []).concat([{ ts: isoNow(), user: user.id, productId: l.productId, lotNo: l.lotNo, qty }]).slice(-300);
  await commit([op('remessas', r)]);
  return { rem: r, line: l, done: l.conf === l.qty, all: r.lines.every(x => (x.conf || 0) === x.qty) };
}
async function remReset(user, id, idx) {
  need(user, 'recvexp'); await Store.refreshDoc('remessas', id);
  const cur = S.remessas[id]; if (!cur || !remOpen(cur)) fail('Esta remessa não está aberta para conferência.', 'STATUS');

}
async function remClose(user, id, o) {
  need(user, 'recvexp'); await Store.refreshDoc('remessas', id);
  const cur = S.remessas[id]; if (!cur || !remOpen(cur)) fail('Esta remessa não está aberta para conferência.', 'STATUS');
  const r = clone(cur), diffs = r.lines.filter(l => (l.conf || 0) !== l.qty), ops = [];
  r.closedAt = isoNow(); r.closedBy = user.id; r.closedByName = user.name;
  if (!diffs.length) { r.status = 'conferida'; ops.push(auditOp(user, 'REMESSA_CONFERIDA', id + ': tudo certo')); }
  else {
    if (!String(o.justification || '').trim()) fail('Informe a justificativa da divergência.', 'JUST');

    r.status = 'divergente'; r.justification = String(o.justification).trim(); r.authBy = o.authUser.id;
    const txt = id + ': ' + diffs.map(l => prodName(l.productId) + ' lote ' + l.lotNo + ' enviado ' + l.qty + ', conferido ' + (l.conf || 0)).join('; ');
    ops.push(occOp(user, 'DIVERGENCIA_EXPEDICAO', txt, { remessa: id }), auditOp(user, 'REMESSA_DIVERGENTE', txt + ' · ' + r.justification));

}
/* tratar a diferença: devolver ao estoque (doca) ou registrar a perda */
async function remTreat(user, id, o) {
  need(user, 'approve'); await Store.refreshDoc('remessas', id);

    r.status = 'tratada'; r.treatment = o.action; r.treatReason = String(o.reason).trim(); r.treatedBy = user.id; r.treatedAt = isoNow();
    const occ = Object.values(S.occurrences).find(x => x.ref && x.ref.remessa === id && x.status === 'aberta');

Scan.rx = async (v, name) => {
  if (name === 'open') return rxOpenByCode(v);
  const rx = ui.rx, q = Number(($('#rx_q') || {}).value) || 1, g = gs1Parse(v);
  try { const res = await remScan(user, rx.id, { code: v, lineIdx: rx.sel, qty: q, lotNo: g && g.lot, expiry: g && g.expiry }); rxResult(res); beep('ok'); }
  catch (e) {
    if (!(e instanceof WmsError) || !['FORA', 'LOTE', 'EXCESSO'].includes(e.code)) throw e;
    rx.alert = { kind: 'bad', text: e.message }; beep('bad');
    try { await logAudit(user, 'EXPEDICAO_BIPE_INVALIDO', rx.id + ': ' + e.message); } catch (x) { /* segue */ }
  }
  render();
};
Act.rxall = async t => {
  const rx = ui.rx, i = Number(t.dataset.i), l = S.remessas[rx.id].lines[i];
  const res = await remScan(user, rx.id, { lineIdx: i, qty: l.qty - (l.conf || 0) }); rxResult(res); render();
};
Act.rxzero = async t => { await remReset(user, ui.rx.id, Number(t.dataset.i)); ui.rx.alert = null; render(); };
Act.rxclose = async () => {
  const rx = ui.rx, r = S.remessas[rx.id], diffs = r.lines.filter(l => (l.conf || 0) !== l.qty), o = {};
  if (diffs.length) {
    const j = await dialog({ title: 'Divergência na conferência', ok: 'Continuar', body: '<p class="muted">Não bate com o que o estoque enviou:</p><ul>' + diffs.map(l => '<li>' + esc(prodName(l.productId)) + ' lote ' + esc(l.lotNo) + ': enviado ' + nf(l.qty) + ', conferido ' + nf(l.conf || 0) + '</li>').join('') + '</ul>' + field('Justificativa', '<input name="j" autocomplete="off" required>'), onOk: f => { const v = f.j.value.trim(); if (!v) throw new WmsError('Informe a justificativa.'); return v; } });
    if (!j) return; o.justification = j;
    o.authUser = await askAuth('Fechar ' + r.id + ' com divergência: o estoque será avisado e a ocorrência fica aberta.'); if (!o.authUser) return;
  } else if (!(await confirmBox('Finalizar conferência', 'Tudo conferido e certo. Finalizar ' + esc(r.id) + '?', 'Finalizar'))) return;
  const res = await remClose(user, rx.id, o); ui.rx = null; render({ reset: true });
  toast(res.status === 'conferida' ? 'Remessa conferida: tudo certo.' : 'Remessa fechada com divergência. O estoque foi avisado.', res.status === 'conferida' ? 'ok' : 'info');
};

function expRemessas() {
  const fq = ui.rmf || (ui.rmf = { q: '' }), q = norm(fq.q || '');
  const all = Object.values(S.remessas).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  if (!all.length) return card('', '<p class="muted">Nenhuma remessa ainda.</p>');
  const list = all.filter(r => !q || norm(r.id + ' ' + (r.pedido || '') + ' ' + (r.note || '') + ' ' + r.lines.map(l => prodName(l.productId) + ' ' + l.lotNo).join(' ')).includes(q)).slice(0, 60);
  const since = Date.now() - 30 * 864e5, rec = all.filter(r => new Date(r.createdAt).getTime() >= since), fech = rec.filter(r => r.closedAt);
  const avg = fech.length ? fech.reduce((s, r) => s + (new Date(r.closedAt) - new Date(r.createdAt)), 0) / fech.length / 36e5 : null;
  const dv = fech.filter(r => r.status === 'divergente' || r.status === 'tratada').length, late = all.filter(r => remOpen(r) && Date.now() - new Date(r.createdAt) > 4 * 36e5).length;
  let top = '<div class="kgrid">' + kpiT('Remessas em 30 dias', nf(rec.length), nf(rec.reduce((s, r) => s + remTotals(r).qty, 0)) + ' un enviadas') + kpiT('Tempo até conferir', avg == null ? '—' : String(avg < 1 ? Math.round(avg * 60) + ' min' : avg.toFixed(1).replace('.', ',') + ' h'), 'média do envio até o fim da conferência') +
    kpiT('Com divergência', fech.length ? String(Math.round(dv * 100 / fech.length)).replace('.', ',') + '%' : '—', nf(dv) + ' de ' + nf(fech.length) + ' conferidas', dv ? 'warn' : '') + kpiT('Paradas há mais de 4 h', nf(late), 'esperando a expedição conferir', late ? 'warn' : '') + '</div>' +
    card('', field('Buscar remessa', liveIn('rmf', 'q', 'rmf_q', fq.q, 'Número, pedido, produto ou lote')));
  return top + list.map(r => {
    const T = remTotals(r), act = [];
    if (r.status === 'divergente' && can(user, 'approve')) act.push('<button class="btn sm" data-act="rtdev" data-id="' + esc(r.id) + '">Devolver diferença à doca</button>', '<button class="btn sm ghost" data-act="rtperda" data-id="' + esc(r.id) + '">Registrar perda</button>');
    if (r.status === 'enviada' && can(user, 'ship')) act.push('<button class="btn sm ghost" data-act="rtcancel" data-id="' + esc(r.id) + '">Cancelar remessa</button>');
    return '<details class="card more"><summary><b>' + esc(r.id) + '</b> ' + remBadge(r) + '<span class="muted">' + (r.pedido ? ' · pedido ' + esc(r.pedido) : '') + ' · ' + fmtTs(r.createdAt) + ' · ' + esc(r.createdByName) + ' · ' + nf(T.conf) + '/' + nf(T.qty) + ' un</span></summary>' +
      ((r.pedido ? 'Pedido ' + esc(r.pedido) : '') + (r.note ? (r.pedido ? ' · ' : '') + esc(r.note) : '') ? '<p class="muted">' + (r.pedido ? 'Pedido ' + esc(r.pedido) : '') + (r.note ? (r.pedido ? ' · ' : '') + esc(r.note) : '') + '</p>' : '') +
      tbl(['Produto', 'Lote', 'De', 'Enviado', 'Conferido', 'Diferença'], r.lines.map(l => [esc(prodName(l.productId)), esc(l.lotNo), esc(l.fromAddr), nf(l.qty), nf(l.conf || 0), l.qty === (l.conf || 0) ? '—' : badge(nf((l.conf || 0) - l.qty), 'bad')]), { num: [3, 4, 5] }) +
      (r.closedAt ? '<p class="muted">Conferida por ' + esc(r.closedByName) + ' em ' + fmtTs(r.closedAt) + (r.justification ? ' · justificativa: ' + esc(r.justification) : '') + '</p>' : '') +
      (r.treatment ? '<p class="muted">Tratada: ' + (r.treatment === 'devolver' ? 'diferença devolvida à doca' : 'perda registrada') + ' · ' + esc(r.treatReason) + '</p>' : '') + (r.cancelReason ? '<p class="muted">Cancelada: ' + esc(r.cancelReason) + '</p>' : '') +
      '<div class="row">' + act.join('') + '<button class="btn sm ghost" data-act="rtprint" data-id="' + esc(r.id) + '">Imprimir romaneio</button></div></details>';
  }).join('');
}
Act.rtdev = async t => { const r = await askText('Devolver diferença à doca', 'Motivo (a diferença volta para a doca e pode ser guardada de novo)'); if (!r) return; await remTreat(user, t.dataset.id, { action: 'devolver', reason: r }); render(); toast('Diferença devolvida à doca.', 'ok'); };
Act.rtperda = async t => { const r = await askText('Registrar perda', 'Motivo da perda (a diferença não volta ao estoque)'); if (!r) return; await remTreat(user, t.dataset.id, { action: 'perda', reason: r }); render(); toast('Perda registrada.', 'ok'); };
Act.rtcancel = async t => { const r = await askText('Cancelar remessa', 'Motivo do cancelamento (tudo volta para a doca)'); if (!r) return; const a = await askAuth('Cancelar a remessa ' + t.dataset.id + '.'); if (!a) return; await remCancel(user, t.dataset.id, r, a); render(); toast('Remessa cancelada. Os itens voltaram para a doca.', 'ok'); };

const remPedidos = () => { const set = new Set(); Object.values(S.demands).filter(d => d.status === 'aberta').forEach(d => d.lines.forEach(l => (l.ords || []).forEach(o => set.add(String(o))))); return [...set].slice(0, 400); };
async function rxOpenByCode(v) {
  const id = norm(String(v).replace(/\s+/g, '')), r = S.remessas[id];
  if (!r) fail('Remessa ' + id + ' não encontrada.');
  if (!remOpen(r)) fail('A remessa ' + id + ' já está ' + REM_ST[r.status][0].toLowerCase() + '.');
  ui.rx = { id, alert: { kind: 'ok', text: 'Remessa ' + id + ' aberta. Pode bipar os produtos.' }, sel: null }; render({ reset: true }); beep('ok');
}
/* romaneio: folha para imprimir com código de barras da remessa */
Act.rtprint = async t => {
  const r = S.remessas[t.dataset.id], T = remTotals(r);
  const html = '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Romaneio ' + esc(r.id) + '</title><style>body{font:14px Arial,sans-serif;margin:28px;color:#000}h1{font-size:22px;margin:0 0 4px}table{border-collapse:collapse;width:100%;margin-top:14px}th,td{border:1px solid #000;padding:6px 8px;text-align:left}th{background:#eee}td.n,th.n{text-align:right}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.sig{display:flex;gap:40px;margin-top:60px}.sig div{flex:1;border-top:1px solid #000;padding-top:4px}@media print{button{display:none}}</style></head><body>' +
    '<div class="top"><div><h1>Romaneio de remessa à expedição</h1><div>Remessa <b>' + esc(r.id) + '</b>' + (r.pedido ? ' · Pedido <b>' + esc(r.pedido) + '</b>' : '') + '</div><div>Enviada em ' + fmtTs(r.createdAt) + ' por ' + esc(r.createdByName) + '</div>' + (r.note ? '<div>' + esc(r.note) + '</div>' : '') + '</div><div>' + barcodeSVG(r.id, { h: 60, mod: 2 }) + '</div></div>' +
    '<table><thead><tr><th>Produto</th><th>Lote</th><th>Validade</th><th class="n">Enviado</th><th class="n">Conferido</th></tr></thead><tbody>' + r.lines.map(l => '<tr><td>' + esc(prodName(l.productId)) + '</td><td>' + esc(l.lotNo) + '</td><td>' + fmtD(l.expiry) + '</td><td class="n">' + nf(l.qty) + '</td><td class="n"></td></tr>').join('') + '<tr><td colspan="3"><b>Total</b></td><td class="n"><b>' + nf(T.qty) + '</b></td><td class="n"></td></tr></tbody></table>' +
    '<div class="sig"><div>Enviou (estoque)</div><div>Conferiu (expedição)</div></div><p><button onclick="window.print()">Imprimir</button></p></body></html>';
  let w = null; try { w = window.open('', '_blank'); } catch (e) { w = null; }
  if (w) { w.document.write(html); w.document.close(); try { w.focus(); setTimeout(() => w.print(), 400); } catch (e) { /* segue */ } }
  else await saveFile('romaneio-' + r.id + '.html', html);
};

async function boot() {
  if (booted) return; booted = true;
  $('#app').innerHTML = '<main class="login"><div class="lg"><h1>Carregando…</h1></div></main>';
  try {
    const db = makeFbDb(); Env.mode = 'db'; Env.db = db; Env.usersConfirmed = false; setStore(dbStore(db));
    await subscribeAll(db); Env.usersConfirmed = true;
    if (Env.denied) throw new Error('O banco recusou a leitura (' + Env.denied + '). Isso acontece quando as regras do Firebase ainda não foram publicadas ou quando o seu usuário não está no grupo do app dentro da Estante. Avise o administrador da Estante.');
    await estanteLogin();
    if (user) { ui.view = (location.hash || '').slice(1) || ''; try { await logAudit(user, 'LOGIN', ''); } catch (e) { /* ignora */ } routeFromHash(); }
  } catch (e) {
    console.error(e);
    $('#app').innerHTML = '<main class="login"><div class="lg"><h1>Não foi possível abrir</h1><p class="muted">Sem conexão com o banco ou sem permissão. ' + esc(e && e.message || '') + '</p><div class="row"><a class="btn" href="javascript:location.reload()">Tentar de novo</a><a class="btn ghost" href="./index.html">Voltar à Estante</a></div></div></main>';
    return;
  }
  render({ reset: true });
}
window.__startApp = boot;
if (window.__gateOk) boot();
window.addEventListener('error', e => { const a = document.getElementById('app'); if (a && /Carregando o Controle/.test(a.textContent)) a.innerHTML = '<p style="padding:24px;font:16px/1.5 system-ui,sans-serif">Não foi possível iniciar o aplicativo neste navegador: ' + String(e.message).replace(/</g, '&lt;') + '. Abra pelo Chrome ou use o link do aplicativo.</p>'; });

</script>
