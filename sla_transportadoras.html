<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLA Transportadoras STIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: painel de torre de controle — barra de abas no topo, faixa de período, cartões por transportadora e gráficos por dia/semana.
   Dark-first (tela de acompanhamento), com versão clara completa. */
:root{
  color-scheme:dark;
  --bg:#0f1316; --panel:#161c20; --panel-2:#1d252a; --line:#2a343a;
  --ink:#eef2f3; --ink-2:#a9b5ba; --ink-3:#71808a;
  --accent:#4fb3c9; --accent-ink:#06171c;
  --c-correios:#d95926; --c-azul:#3987e5; --c-ativa:#199e70;
  --ok:#2fbf4a; --warn:#f0a92a; --late:#ec835a; --crit:#e5534b; --open:#7c93a6;
  --ok-soft:rgba(47,191,74,.14); --warn-soft:rgba(240,169,42,.15); --crit-soft:rgba(229,83,75,.16); --open-soft:rgba(124,147,166,.16);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset;
  --f-display:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#eef1f2; --panel:#ffffff; --panel-2:#f5f7f8; --line:#dde3e6;
  --ink:#10181c; --ink-2:#4a5a62; --ink-3:#7d8c94;
  --accent:#1f7f94; --accent-ink:#ffffff;
  --c-correios:#d14f1c; --c-azul:#2a78d6; --c-ativa:#148a62;
  --ok:#14892a; --warn:#b97806; --late:#c4572b; --crit:#c8322b; --open:#5e7487;
  --ok-soft:rgba(20,137,42,.10); --warn-soft:rgba(185,120,6,.12); --crit-soft:rgba(200,50,43,.10); --open-soft:rgba(94,116,135,.12);
  --shadow:0 1px 2px rgba(16,24,28,.06);
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#eef1f2; --panel:#ffffff; --panel-2:#f5f7f8; --line:#dde3e6;
  --ink:#10181c; --ink-2:#4a5a62; --ink-3:#7d8c94;
  --accent:#1f7f94; --accent-ink:#ffffff;
  --c-correios:#d14f1c; --c-azul:#2a78d6; --c-ativa:#148a62;
  --ok:#14892a; --warn:#b97806; --late:#c4572b; --crit:#c8322b; --open:#5e7487;
  --ok-soft:rgba(20,137,42,.10); --warn-soft:rgba(185,120,6,.12); --crit-soft:rgba(200,50,43,.10); --open-soft:rgba(94,116,135,.12);
  --shadow:0 1px 2px rgba(16,24,28,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding-inline:20px;padding-block:18px 48px}

/* topo */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.brand .eyebrow{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
.clock{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);text-align:right}
.clock b{font-family:var(--f-display);font-size:22px;color:var(--ink);font-weight:700;display:block;letter-spacing:.02em}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:8px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.02em;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink);background:var(--panel)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--panel);border-color:var(--line)}
.tab .dot{width:9px;height:9px;border-radius:50%}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.btn:hover{color:var(--ink);border-color:var(--ink-3)}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--crit)}
.lbl{font-family:var(--f-display);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}

/* painéis */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0;letter-spacing:.01em}
.panel .sub{color:var(--ink-3);font-size:13px;margin:2px 0 12px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
@media (max-width:980px){.g3,.g-main{grid-template-columns:1fr}}
.stack{display:grid;gap:14px}

/* cartões de transportadora (visão geral) */
.carrier{cursor:pointer;position:relative;overflow:hidden;display:grid;gap:10px;text-align:left;font:inherit;color:inherit;width:100%}
.carrier:hover{border-color:var(--ink-3)}
.carrier .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.carrier .name{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.02em;display:flex;align-items:center;gap:9px}
.carrier .name i{width:12px;height:12px;border-radius:3px;display:inline-block}
.carrier .pct{font-family:var(--f-display);font-weight:800;font-size:68px;line-height:.95;letter-spacing:-.02em}
.carrier .pct small{font-size:30px;font-weight:700;margin-left:2px}
.carrier .meta{color:var(--ink-2);font-size:13.5px}
.carrier .mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:10px}
.carrier .mini div{display:grid;gap:1px}
.carrier .mini b{font-family:var(--f-display);font-size:22px;font-weight:700}
.carrier .mini span{font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}
.carrier .upd{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.carrier .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}

.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-display);font-weight:700;font-size:12.5px;letter-spacing:.04em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.open{background:var(--open-soft);color:var(--open)}
.chip.none{background:var(--panel-2);color:var(--ink-3)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left;display:grid;gap:4px;min-width:0}
.kpi:hover{border-color:var(--ink-3)}
.kpi .k{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-family:var(--f-display);font-size:38px;font-weight:800;line-height:1}
.kpi .s{font-size:12.5px;color:var(--ink-2)}
.kpi.hero .v{font-size:46px}
.v.ok{color:var(--ok)} .v.warn{color:var(--warn)} .v.crit{color:var(--crit)} .v.late{color:var(--late)} .v.open{color:var(--open)}
.kpi .bar-sla{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;margin-top:4px}
.kpi .bar-sla i{display:block;height:100%}

.chart-box{position:relative;height:300px}
.chart-box.tall{height:340px}

/* tabelas */
.tscroll{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:420px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{position:sticky;top:0;background:var(--panel-2);text-align:left;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
td.mono{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
tbody tr:hover td{background:var(--panel-2)}
.matrix td,.matrix th{text-align:center;white-space:nowrap}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.cell{display:inline-grid;gap:0;min-width:58px;padding:5px 6px;border-radius:6px;font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.1}
.cell small{font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--ink-3)}
.cell.ok{background:var(--ok-soft);color:var(--ok)} .cell.warn{background:var(--warn-soft);color:var(--warn)} .cell.crit{background:var(--crit-soft);color:var(--crit)} .cell.none{color:var(--ink-3)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend i.line{height:3px;border-radius:2px}

/* importação */
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;cursor:pointer;color:var(--ink-2)}
.drop:hover,.drop.drag{border-color:var(--accent);color:var(--ink)}
.drop b{display:block;font-family:var(--f-display);font-size:17px;color:var(--ink)}
.imp{display:flex;justify-content:space-between;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
.imp:last-child{border-bottom:0}
.imp .f{font-weight:600;word-break:break-all}
.imp .m{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--crit)}
.confirm input{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:110px}

.note{font-size:12.5px;color:var(--ink-3);margin-top:16px;max-width:110ch}
.flag{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);border:1px solid transparent;border-radius:var(--r);padding:12px 14px;font-size:13.5px;color:var(--ink)}
.flag b{font-family:var(--f-display);font-size:22px;color:var(--warn);line-height:1}

/* modal */
.modal{position:fixed;inset:0;background:rgba(5,9,11,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal[hidden]{display:none!important}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(1200px,100%);max-height:88vh;display:flex;flex-direction:column;min-width:0}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet .hd h3{font-family:var(--f-display);font-size:20px;margin:0}
.sheet .bd{padding:12px 18px 16px;overflow:hidden;display:flex;flex-direction:column;gap:10px;min-height:0}
.sheet .bd .tscroll{max-height:none;flex:1;min-height:0}
.search{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;width:260px;max-width:100%}
.x{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--ink-3)}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.toast.err{background:var(--crit);color:#fff}
.empty{color:var(--ink-3);padding:28px 8px;text-align:center}
.tv-progress{height:3px;background:var(--accent);width:0;position:fixed;left:0;top:0;z-index:30;transition:width linear}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-database-compat.min.js"></script>

<div id="__gateOverlay" style="position:fixed;inset:0;z-index:2147483647;background:#0a0d12;color:#eef1f5;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;text-align:center;padding:20px;">

<div class="wrap">

    <div class="brand">

</div>

</div></div>

<script>
(function(){
'use strict';
/* ===================== utilidades ===================== */
const META = 90; // meta de % no prazo
const DAY = 86400000;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtInt = n => (n||0).toLocaleString('pt-BR');
const pctTxt = p => p==null ? '—' : p.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
function norm(s){ return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim(); }
function txt(v,n){ n=n||60; if(v==null) return ''; return String(v).replace(/\s+/g,' ').trim().slice(0,n); }
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(y,m,d){ const t=new Date(Date.UTC(y,m-1,d)); if(t.getUTCFullYear()!==y||t.getUTCMonth()!==m-1||t.getUTCDate()!==d) return null; return ''+y+pad(m)+pad(d); }
function dstr(v){
  if(v==null||v==='') return null;
  if(typeof v==='number'){ if(v>20000&&v<80000){ const t=new Date(Date.UTC(1899,11,30)+Math.floor(v)*DAY); return ''+t.getUTCFullYear()+pad(t.getUTCMonth()+1)+pad(t.getUTCDate()); } return null; }
  if(v instanceof Date) return ''+v.getFullYear()+pad(v.getMonth()+1)+pad(v.getDate());
  const s=String(v).trim(); let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return ymd(+m[3],+m[2],+m[1]);
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+m[2]+m[3];
  return null;
}
const dn = s => s ? Math.round(Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8))/DAY) : null;
const todayDN = () => { const t=new Date(); return Math.round(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())/DAY); };
const dnDate = d => new Date(d*DAY);
const fmtDN = d => { if(d==null) return '—'; const t=dnDate(d); return pad(t.getUTCDate())+'/'+pad(t.getUTCMonth()+1)+'/'+t.getUTCFullYear(); };
const fmtDM = d => { const t=dnDate(d); return pad(t.getUTCDate())+'/'+pad(t.getUTCMonth()+1); };
const wday = d => dnDate(d).getUTCDay();
const monday = d => d - ((wday(d)+6)%7);
function isoWeek(d){ const t=dnDate(d); const day=(t.getUTCDay()+6)%7; const th=new Date(t.getTime()+(3-day)*DAY); const y=th.getUTCFullYear(); const j=new Date(Date.UTC(y,0,4)); return 1+Math.round(((th-j)/DAY - 3 + ((j.getUTCDay()+6)%7))/7); }
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

/* feriados nacionais (dias úteis dos Correios) */
const HOL = new Set();
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return Math.round(Date.UTC(y,mo-1,da)/DAY); }
for(let y=2024;y<=2028;y++){
  [[1,1],[4,21],[5,1],[9,7],[10,12],[11,2],[11,15],[11,20],[12,25]].forEach(([m,d])=>HOL.add(Math.round(Date.UTC(y,m-1,d)/DAY)));
  HOL.add(easter(y)-2); // Sexta-feira Santa
}
const isBD = d => { const w=wday(d); return w!==0 && w!==6 && !HOL.has(d); };
const bdCache = new Map();
function addBD(d,n){ const key=d*100+n; let r=bdCache.get(key); if(r!==undefined) return r; let x=d, k=n; while(k>0){ x++; if(isBD(x)) k--; } bdCache.set(key,x); return x; }

/* ===================== transportadoras ===================== */
const CARRIERS = {
  correios:{ name:'Correios', color:'--c-correios', idLabel:'Objeto', baseLabel:'Postagem', placeLabel:'Cidade',
    rule:'Previsão = data de postagem + "Prazo Est" em dias úteis (sem sábados, domingos e feriados nacionais). Comparada com a data de entrega do relatório.',
    must:['prazo est','dta postagem','status'],
    parse(h,rows){

      const out=new Map();
      rows.forEach(r=>{ const post=dstr(r[c['dta postagem']]); if(!post) return;
        const reg=txt(r[c['reg. correios']]); const k=reg||('P'+txt(r[c['pnet']]));
        let pz=parseInt(parseFloat(r[c['prazo est']]||0),10); if(isNaN(pz)) pz=0;
        out.set(k,{k,id:reg||k,nf:txt(r[c['nro nf']]),dest:txt(r[c['nome dest']],34),uf:txt(r[c['uf dest']],2),cid:txt(r[c['cid dest']],24),base:post,prazo:pz,prev:null,ent:dstr(r[c['dta entrega']]),st:txt(r[c['status']],70),x:txt(r[c['desc servico']],40)});
      });
      return [...out.values()];
    },
    excluded: r => /entregue ao remetente|estornad|cancelad|devolvid/i.test(r.st),
    delivered: r => !!r.ent && /entregue ao destinat|caixa de correios inteligente/i.test(r.st),
    prevOf: r => addBD(dn(r.base), r.prazo||0),
  },
  azul:{ name:'Azul', color:'--c-azul', idLabel:'AWB', baseLabel:'Faturamento', placeLabel:'Destino',
    rule:'Compara a coluna "Previsão Entrega" com "desembarque/entrega".',
    must:['previsao entrega','desembarque/entrega'],
    parse(h,rows){
      const c=cols(h,['awb','nf','destinatario','uf destino','destino','data faturamento','previsao entrega','desembarque/entrega','status atual','retira','motivo atraso']);
      const out=new Map();
      rows.forEach(r=>{ const awb=txt(r[c['awb']]); const prev=dstr(r[c['previsao entrega']]); if(!awb||!prev) return;
        const mot=txt(r[c['motivo atraso']],80);
        out.set(awb,{k:awb,id:awb,nf:txt(r[c['nf']]),dest:txt(r[c['destinatario']],34),uf:txt(r[c['uf destino']],2),cid:txt(r[c['destino']],24),base:dstr(r[c['data faturamento']]),prazo:0,prev,ent:dstr(r[c['desembarque/entrega']]),st:txt(r[c['status atual']],70),x:(txt(r[c['retira']]).toUpperCase()==='S'?'Retira':'Entrega')+(mot?'|'+mot:'')});
      });
      return [...out.values()];
    },
    excluded: r => false,
    delivered: r => !!r.ent,
    prevOf: r => dn(r.prev),
  },
  ativa:{ name:'Ativa', color:'--c-ativa', idLabel:'CTRC', baseLabel:'Emissão', placeLabel:'Praça',
    rule:'Compara "Data Prev Entrega" com "Data da Entrega".',
    must:['data prev entrega','data da entrega'],
    parse(h,rows){
      const c=cols(h,['ctrc','nfiscal','nome destinatario','uf destino','praca','emissao','data prev entrega','data da entrega','ultima ocorrenc','tipo','prazo','justificativa']);
      if(h.indexOf('tipo')>=0) c['tipo']=h.indexOf('tipo'); if(h.indexOf('prazo')>=0) c['prazo']=h.indexOf('prazo');
      const out=new Map();
      rows.forEach(r=>{ const k=txt(r[c['ctrc']]); const prev=dstr(r[c['data prev entrega']]); if(!k||!prev) return;
        out.set(k,{k,id:k,nf:txt(r[c['nfiscal']]),dest:txt(r[c['nome destinatario']],34),uf:txt(r[c['uf destino']],2),cid:txt(r[c['praca']],24),base:dstr(r[c['emissao']]),prazo:0,prev,ent:dstr(r[c['data da entrega']]),st:txt(r[c['ultima ocorrenc']],70),x:txt(r[c['tipo']])+'|'+txt(r[c['prazo']])+'|'+txt(r[c['justificativa']],60)});
      });
      return [...out.values()];
    },
    excluded: r => false,
    delivered: r => !!r.ent,
    prevOf: r => dn(r.prev),
  },
};
const ORDER=['correios','azul','ativa'];
function cols(h,names){ const c={}; names.forEach(n=>{ let i=h.indexOf(n); if(i<0) i=h.findIndex(x=>x.startsWith(n)); if(i<0) i=h.findIndex(x=>x.includes(n)); c[n]=i<0?-1:i; }); return c; }

/* ===================== estado / base ===================== */
const S = { tab:'geral', gran:'semana', periodo:'u8s', data:{correios:[],azul:[],ativa:[]}, der:{}, ref:{}, imports:[], tv:null };
try{ const p=JSON.parse(localStorage.getItem('sla_stin_prefs')||'{}'); if(p.gran) S.gran=p.gran; if(p.periodo) S.periodo=p.periodo; if(p.tab) S.tab=p.tab; }catch(e){}
function savePrefs(){ try{ localStorage.setItem('sla_stin_prefs',JSON.stringify({gran:S.gran,periodo:S.periodo,tab:S.tab})); }catch(e){} }

/* ===== dados no Firebase (compartilhado por todo o time) =====
   Cada transportadora fica em transportadoras/sla/{car}: os pedidos em blocos de texto JSON (chunks) + o histórico de importações. */
const FB_ROOT='transportadoras/sla/';
const CHUNK=2000;
const fbc = car => firebase.database().ref(FB_ROOT+car);
function chunkify(recs){ const o={}; for(let i=0,n=0;i<recs.length;i+=CHUNK,n++) o['c'+String(n).padStart(3,'0')]=JSON.stringify(recs.slice(i,i+CHUNK)); return o; }
async function loadCar(car){
  const v=(await fbc(car).once('value')).val()||{};
  let recs=[]; Object.keys(v.chunks||{}).sort().forEach(k=>{ try{ recs=recs.concat(JSON.parse(v.chunks[k])); }catch(e){} });
  let imps=[]; try{ imps=JSON.parse(v.imports||'[]'); }catch(e){}
  return {recs,imps};
}
async function saveCar(car){
  const imps=S.imports.filter(i=>i.car===car).sort((x,y)=>new Date(x.ts)-new Date(y.ts)).slice(-30);
  await fbc(car).set({chunks:chunkify(S.data[car]), imports:JSON.stringify(imps), updatedAt:firebase.database.ServerValue.TIMESTAMP});
}
function mergeInto(car,recs){ const m=new Map(S.data[car].map(r=>[r.k,r])); let novos=0,atual=0; recs.forEach(r=>{ if(m.has(r.k)) atual++; else novos++; m.set(r.k,r); }); S.data[car]=[...m.values()]; return {novos,atual}; }

async function init(){
  try{
    const res=await Promise.all(ORDER.map(loadCar));
    S.imports=[];
    ORDER.forEach((car,i)=>{ S.data[car]=res[i].recs; S.imports=S.imports.concat(res[i].imps); });
  }catch(e){
    $('#view').innerHTML='<div class="panel empty" style="padding:60px 20px">Não consegui carregar os dados agora ('+esc(e.message||e)+'). <a href="javascript:location.reload()" style="color:var(--accent)">Tentar de novo</a></div>';
    return;
  }
  ORDER.forEach(derive);
  buildPeriodo(); render();
}

/* classifica cada pedido */
const CLS_LABEL={ok:'No prazo',late_deliv:'Entregue c/ atraso',late_open:'Atrasado',open:'Em andamento',excl:'Devolvido/cancelado'};
const CLS_CHIP={ok:'ok',late_deliv:'warn',late_open:'crit',open:'open',excl:'none'};
function derive(car){
  const C=CARRIERS[car];
  // data de referência = data mais recente do relatório (não adianta julgar além do que o relatório sabe)
  let until=null; S.data[car].forEach(r=>{ [r.ent,r.base].forEach(v=>{ const d=dn(v); if(d!=null&&(until==null||d>until)) until=d; }); });
  const T=Math.min(todayDN(), until==null?todayDN():until); S.ref[car]=T;
  S.der[car]=S.data[car].map(r=>{
    const prev=C.prevOf(r); if(prev==null||isNaN(prev)) return null;
    const ent=dn(r.ent), base=dn(r.base);
    let cls, dias=0;
    if(C.excluded(r)) cls='excl';
    else if(C.delivered(r)){ if(ent<=prev) cls='ok'; else { cls='late_deliv'; dias=ent-prev; } }
    else if(T<=prev) cls='open';
    else { cls='late_open'; dias=T-prev; }
    return {r,prev,ent:C.delivered(r)?ent:null,base,cls,dias};
  }).filter(Boolean);
}

/* ===================== período ===================== */
function buildPeriodo(){
  const months=new Set(); ORDER.forEach(c=>S.der[c].forEach(d=>{ const t=dnDate(d.prev); months.add(t.getUTCFullYear()*100+t.getUTCMonth()+1); }));
  const T=todayDN(); const tt=dnDate(T); const cur=tt.getUTCFullYear()*100+tt.getUTCMonth()+1;
  const ms=[...months].filter(m=>m<=cur).sort((a,b)=>b-a);
  const opts=[['u7','Últimos 7 dias'],['u4s','Últimas 4 semanas'],['u8s','Últimas 8 semanas'],['u13s','Últimas 13 semanas']]
    .concat(ms.map(m=>['m'+m, MESES[m%100-1]+'/'+String(Math.floor(m/100)).slice(2)]))
    .concat([['all','Todo o período']]);
  const sel=$('#periodo'); sel.innerHTML=opts.map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join('');
  if(!opts.some(o=>o[0]===S.periodo)) S.periodo='u8s';
  sel.value=S.periodo;
}
function range(){
  const T=todayDN(), p=S.periodo;
  if(p==='u7') return [T-6,T];
  if(p==='u4s') return [monday(T)-21,T];
  if(p==='u8s') return [monday(T)-49,T];
  if(p==='u13s') return [monday(T)-84,T];
  if(p[0]==='m'){ const y=Math.floor(+p.slice(1)/100), m=+p.slice(1)%100; const a=Math.round(Date.UTC(y,m-1,1)/DAY), b=Math.round(Date.UTC(y,m,1)/DAY)-1; return [a,b]; }
  return [-1e9,1e9];
}
function periodLabel(){ const o=$('#periodo').selectedOptions[0]; return o?o.textContent:''; }
const inRange = (d,[a,b]) => d.prev>=a && d.prev<=b;
const bucketOf = prev => S.gran==='dia' ? prev : monday(prev);
const bucketLabel = b => S.gran==='dia' ? fmtDM(b) : 'S'+isoWeek(b)+' · '+fmtDM(b);
const bucketTitle = b => S.gran==='dia' ? fmtDN(b)+' ('+['dom','seg','ter','qua','qui','sex','sáb'][wday(b)]+')' : 'Semana '+isoWeek(b)+': '+fmtDN(b)+' a '+fmtDN(b+6);

function stats(list){
  const s={total:0,ok:0,late_deliv:0,late_open:0,open:0,excl:0,diasSum:0};
  list.forEach(d=>{ s[d.cls]++; if(d.cls!=='excl') s.total++; if(d.cls==='late_open') s.diasSum+=d.dias; });
  s.base=s.ok+s.late_deliv+s.late_open; s.fora=s.late_deliv+s.late_open;
  s.pct=s.base?s.ok/s.base*100:null; return s;
}
const level = p => p==null?'none':(p>=META?'ok':(p>=80?'warn':'crit'));
function periodList(car){ const rg=range(); return S.der[car].filter(d=>inRange(d,rg)); }
function buckets(list, upTo){
  const m=new Map();
  list.forEach(d=>{ if(upTo!=null && d.prev>upTo) return; const b=bucketOf(d.prev); if(!m.has(b)) m.set(b,[]); m.get(b).push(d); });
  return [...m.keys()].sort((a,b)=>a-b).map(b=>({b,s:stats(m.get(b))}));
}
function lastImport(car){ const l=S.imports.filter(i=>i.car===car).sort((a,b)=>new Date(b.ts)-new Date(a.ts)); return l[0]; }
function dataUntil(car){ return S.ref[car]; }

/* ===================== cores (tokens) ===================== */
function tok(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* ===================== render ===================== */
let charts=[];
function killCharts(){ charts.forEach(c=>c.destroy()); charts=[]; }
function render(){
  killCharts();
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===S.tab?'true':'false'));
  document.querySelectorAll('#gran button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===S.gran?'true':'false'));

}

      bs.map(b=>{ const s=per[car].get(b); if(!s||!s.base) return '<td><span class="cell none">—</span></td>'; return '<td title="'+esc(bucketTitle(b))+': '+s.ok+' de '+s.base+' no prazo"><span class="cell '+level(s.pct)+'">'+pctTxt(s.pct).replace(/,0$/,'')+'%<small>'+fmtInt(s.base)+' ped.</small></span></td>'; }).join('')+'</tr>').join('')+

  // UF
  const ufm=new Map(); list.forEach(d=>{ const u=d.r.uf||'—'; if(!ufm.has(u)) ufm.set(u,[]); ufm.get(u).push(d); });
  const ufs=[...ufm.entries()].map(([u,l])=>({u,s:stats(l)})).filter(x=>x.s.base>0).sort((a,b)=>(a.s.pct-b.s.pct)||(b.s.base-a.s.base));
  const ufTbl='<div class="tscroll" style="max-height:360px"><table><thead><tr><th>UF</th><th class="n">Pedidos</th><th class="n">Fora do prazo</th><th class="n">% no prazo</th></tr></thead><tbody>'+

  const openBox='<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap"><div><h2>Atrasados em aberto agora</h2><p class="sub">Toda a base, sem filtro de período · '+fmtInt(openAll.length)+' pedidos sem entrega com previsão vencida</p></div>'+(openAll.length?'<button class="btn" data-list="openall" id="btnOpenAll">Ver todos</button>':'')+'</div>'+
    (top?'<div class="tscroll" style="max-height:none"><table><thead><tr><th>NF</th><th>Destinatário</th><th>'+C.placeLabel+'/UF</th><th>Previsão</th><th class="n">Atraso</th></tr></thead><tbody>'+top+'</tbody></table></div>':'<div class="empty">Nenhum pedido atrasado em aberto.</div>')+'</div>';

  // Ativa: divergência com a classificação da própria Ativa
  let flag='';
  if(car==='ativa'){
    const div=list.filter(d=>d.cls==='late_deliv' && /no prazo|antes do prazo/i.test((d.r.x||'').split('|')[1]||''));
    if(div.length) flag='<div class="flag" style="margin-top:14px"><b>'+fmtInt(div.length)+'</b><div>pedidos entregues <strong>depois</strong> da previsão que a Ativa marcou como "No prazo" na própria planilha (com justificativas como cliente ausente). Aqui eles contam como entregues com atraso. <button class="btn" data-list="divativa" id="btnDiv" style="margin-left:6px">Ver pedidos</button></div></div>';
  }

  const imps=S.imports.filter(i=>i.car===car).sort((a,b)=>new Date(b.ts)-new Date(a.ts)).slice(0,8);
  const impBox='<div class="panel"><h2>Atualizar base '+C.name+'</h2><p class="sub">Suba a planilha nova exportada do sistema. Pedidos que já existem são atualizados; os novos são adicionados.</p>'+
    '<div class="drop" id="drop" tabindex="0" role="button" aria-label="Importar planilha"><b>Importar planilha '+C.name+'</b>Clique ou arraste o arquivo .xlsx aqui</div>'+
    '<div style="margin-top:10px">'+imps.map(i=>'<div class="imp"><div><div class="f">'+esc(i.file)+'</div><div class="m">'+new Date(i.ts).toLocaleString('pt-BR')+(i.tag?' · base inicial':'')+'</div></div><div class="m" style="text-align:right">'+fmtInt(i.total)+' lidos<br>+'+fmtInt(i.novos)+' novos · '+fmtInt(i.atual)+' atualizados</div></div>').join('')+'</div>'+
    '<div style="margin-top:10px"><button class="btn danger" id="btnClear" type="button">Limpar base '+C.name+'</button><div id="clearBox"></div></div></div>';

  $('#view').innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px"><h2 style="font-family:var(--f-display);font-size:26px;margin:0;display:flex;gap:10px;align-items:center"><i style="width:14px;height:14px;border-radius:3px;background:var('+C.color+')"></i>'+C.name+' <span style="font-weight:500;color:var(--ink-3);font-size:18px">· '+esc(periodLabel())+'</span></h2><span class="lbl" style="letter-spacing:.06em;text-transform:none;font-family:var(--f-mono)">Base: '+esc(li?li.file:'—')+' · situação em '+fmtDN(du)+'</span></div>'+
    kpis+
    '<section class="grid g-main" style="margin-top:14px">'+
      '<div class="panel"><h2>% no prazo por '+(S.gran==='dia'?'dia':'semana')+'</h2><p class="sub">'+esc(C.rule)+'</p><div class="chart-box"><canvas id="chCar" aria-label="Gráfico de % no prazo"></canvas></div>'+
        '<div class="legend"><span><i style="background:var(--ok)"></i>≥ '+META+'%</span><span><i style="background:var(--warn)"></i>80–'+META+'%</span><span><i style="background:var(--crit)"></i>&lt; 80%</span><span><i class="line" style="background:var(--ink-3);width:18px"></i>Meta</span></div></div>'+
      '<div class="panel"><h2>SLA por UF de destino</h2><p class="sub">Pior para melhor, no período</p>'+ufTbl+'</div>'+
    '</section>'+flag+
    '<section class="panel" style="margin-top:14px"><h2>Resumo por '+(S.gran==='dia'?'dia':'semana')+'</h2><p class="sub">Mais recente primeiro · previsões até '+fmtDN(S.ref[car])+', data mais recente do relatório</p>'+tbl+'</section>'+
    '<section class="grid g-main" style="margin-top:14px">'+openBox+impBox+'</section>';

  const T2=tok('--ok'),W=tok('--warn'),R=tok('--crit');
  const data=bks.map(x=>x.s.pct==null?null:+x.s.pct.toFixed(1));
  const colors=bks.map(x=>{ const l=level(x.s.pct); return l==='ok'?T2:l==='warn'?W:R; });
  const mn=Math.min(...data.filter(v=>v!=null),80);
  charts.push(new Chart($('#chCar'),{type:'bar',data:{labels:bks.map(x=>bucketLabel(x.b)),datasets:[

      tooltip:{filter:i=>i.dataset.label!=='Meta',callbacks:{title:items=>bucketTitle(bks[items[0].dataIndex].b),label:c=>{ const s=bks[c.dataIndex].s; return ['% no prazo: '+pctTxt(s.pct)+'%','No prazo: '+s.ok+' · Entregue c/ atraso: '+s.late_deliv+' · Atrasado aberto: '+s.late_open]; }}}})}));

    $('#clearOk').addEventListener('click',async()=>{ if($('#clearIn').value.trim().toUpperCase()!=='LIMPAR'){ toast('Digite LIMPAR para confirmar.',true); return; }
      try{ await fbc(car).remove(); }catch(e){ toast('Não consegui apagar: '+(e.message||e),true); return; }
      S.data[car]=[]; S.imports=S.imports.filter(i=>i.car!==car); derive(car); render(); toast('Base '+C.name+' apagada. Importe uma planilha para recomeçar.'); });
  });
}

/* ===================== lista (modal) ===================== */

  const C=CARRIERS[car]; let list, title;

  if(kind==='openall'){ list=S.der[car].filter(d=>d.cls==='late_open').sort((a,b)=>b.dias-a.dias); title='Atrasados em aberto · toda a base'; }

  else if(kind==='all'||kind==='base'){ list=per.filter(d=>kind==='all'?d.cls!=='excl':d.cls!=='excl'&&d.cls!=='open'); title=kind==='all'?'Pedidos no período':'Pedidos que entram no % no prazo'; }

/* ===================== importação ===================== */
function sheetRows(ws){
  let maxR=0,maxC=0; Object.keys(ws).forEach(k=>{ if(k[0]==='!') return; const a=XLSX.utils.decode_cell(k); if(a.r>maxR) maxR=a.r; if(a.c>maxC) maxC=a.c; });
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:maxR,c:maxC}});
  return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});
}
async function importFile(car,file){
  const C=CARRIERS[car];
  if(typeof XLSX==='undefined'){ toast('Não foi possível carregar o leitor de planilhas. Verifique a internet e recarregue a página.',true); return; }
  toast('Lendo '+file.name+'…');
  let recs;
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:false});
    let found=null;
    for(const name of wb.SheetNames){
      const rows=sheetRows(wb.Sheets[name]);
      for(let i=0;i<Math.min(15,rows.length);i++){
        const h=(rows[i]||[]).map(norm);
        if(C.must.every(m=>h.some(x=>x===m||x.startsWith(m)))){ found={h,rows:rows.slice(i+1).filter(r=>r&&r.some(v=>v!=null&&String(v).trim()!==''))}; break; }
      }
      if(found) break;
    }
    if(!found){ toast('Essa planilha não parece ser da '+C.name+': não encontrei as colunas '+C.must.map(m=>'"'+m+'"').join(', ')+'.',true); return; }
    recs=C.parse(found.h,found.rows);
  }catch(e){ toast('Erro ao ler o arquivo: '+(e.message||e),true); return; }
  if(!recs.length){ toast('Nenhum pedido válido encontrado nesse arquivo.',true); return; }
  toast('Salvando para o time todo…');
  try{
    const cur=await loadCar(car);
    S.data[car]=cur.recs; S.imports=S.imports.filter(i=>i.car!==car).concat(cur.imps);
  }catch(e){ toast('Não consegui conectar ao banco. Nada foi salvo.',true); return; }
  const r=mergeInto(car,recs);
  const u=(typeof firebase!=='undefined'&&firebase.auth().currentUser)||{};
  const imp={car,file:file.name,ts:new Date().toISOString(),total:recs.length,novos:r.novos,atual:r.atual,by:u.email||''};
  S.imports.push(imp);
  try{ await saveCar(car); }
  catch(e){
    toast('Erro ao salvar no banco: '+(e.message||e)+'. Nada foi alterado.',true);
    try{ const cur=await loadCar(car); S.data[car]=cur.recs; S.imports=S.imports.filter(i=>i.car!==car).concat(cur.imps); derive(car); buildPeriodo(); render(); }catch(_){}
    return;
  }
  derive(car); buildPeriodo(); render();
  toast(C.name+': '+fmtInt(recs.length)+' lidos · '+fmtInt(r.novos)+' novos · '+fmtInt(r.atual)+' atualizados');
}

function toast(m,err){ const t=$('#toast'); t.textContent=m; t.className='toast'+(err?' err':''); t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>{ t.hidden=true; },err?6000:3500); }
function tick(){ const n=new Date(); $('#clk').textContent=pad(n.getHours())+':'+pad(n.getMinutes()); $('#clkd').textContent=n.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'}); }
tick(); setInterval(tick,15000);

  S.tv=setInterval(()=>{ if(!$('#modal').hidden) return; S.tab=tabs[(tabs.indexOf(S.tab)+1)%tabs.length]; render(); window.scrollTo(0,0); cycle(); },25000);
});

const mq=window.matchMedia('(prefers-color-scheme: light)'); try{ mq.addEventListener('change',()=>render()); }catch(e){}
new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
