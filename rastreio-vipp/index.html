<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Rastreio VIPP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
  :root {
    --paper: #eef1f0;
    --surface: #ffffff;
    --ink: #14191b;
    --muted: #5c6b6a;
    --faint: #93a09e;
    --line: #d9e0dd;
    --accent: #b5651d;
    --accent-ink: #6a3a10;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    margin: 0;
    padding: 32px clamp(16px, 4vw, 48px);
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .hidden { display: none !important; }

  #loginScreen { max-width: 340px; margin: 12vh auto; text-align: left; }
  #loginScreen .brand { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  #loginScreen .brand-sub { font-size: 13px; color: var(--muted); margin: 0 0 28px; }
  #loginScreen label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  #loginScreen input {
    width: 100%; padding: 11px 12px; margin-bottom: 14px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
    font-size: 14px; font-family: inherit; color: var(--ink);
  }
  #loginScreen input:focus { outline: none; border-color: var(--accent); }

  .app-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .brand-block { display: flex; align-items: baseline; gap: 12px; }
  .brand { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .brand-sub { font-size: 13px; color: var(--muted); }
  .rule { height: 1px; background: var(--line); margin: 14px 0 22px; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--ink); color: #fff; padding: 10px 16px;
    border-radius: 6px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: none; font-family: 'Inter', sans-serif;
    transition: background 120ms ease;
  }
  .btn:hover { background: #2b3436; }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn.ghost:hover { border-color: var(--faint); color: var(--ink); background: transparent; }
  .btn.accent { background: var(--accent); }
  .btn.accent:hover { background: #99551a; }
  .btn:disabled { opacity: 0.55; cursor: default; }
  #fileInput { display: none; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 20px; }
  .info { font-size: 12.5px; color: var(--muted); }
  .error { font-size: 12.5px; color: #8c3226; }
  #search {
    margin-left: auto; padding: 9px 12px; border: 1px solid var(--line);
    border-radius: 6px; font-size: 13px; min-width: 230px;
    font-family: inherit; background: var(--surface); color: var(--ink);
  }
  #search:focus { outline: none; border-color: var(--accent); }

  #staleWarning {
    display: none; margin-bottom: 18px; padding: 12px 16px;
    background: #f6e6e3; border-left: 3px solid #8c3226; border-radius: 4px;
    font-size: 13px; color: #6b201a;
  }

  .priority-box {
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: 8px;
    padding: 16px 18px; margin-bottom: 24px;
  }
  .priority-title {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px;
    color: var(--accent-ink); margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .priority-title .count {
    font-family: 'JetBrains Mono', monospace; background: var(--accent);
    color: #fff; border-radius: 4px; padding: 1px 7px; font-size: 12px;
  }
  .priority-list { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow-y: auto; }
  .priority-item {
    display: grid; grid-template-columns: 140px 1fr 110px auto; gap: 16px;
    font-size: 13px; padding: 8px 10px; border-radius: 4px;
  }
  .priority-item:hover { background: #f7f0e8; }
  .priority-item .codigo { font-weight: 500; color: var(--ink); }
  .priority-item .dest { color: var(--muted); }
  .priority-item .nf { color: var(--faint); }
  .priority-item .loc { color: var(--faint); text-align: right; }

  .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .col-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .col-title { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 13.5px; }
  .col-count { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--faint); margin-left: auto; }
  .col-list { display: flex; flex-direction: column; gap: 8px; max-height: 540px; overflow-y: auto; padding-right: 2px; }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 11px 13px; font-size: 13px;
    transition: border-color 120ms ease;
  }
  .card:hover { border-color: var(--faint); }
  .card .codigo {
    font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 500;
    letter-spacing: 0.02em; color: var(--muted); margin-bottom: 5px;
  }
  .card .dest { color: var(--ink); font-weight: 500; margin-bottom: 2px; }
  .card .meta { color: var(--faint); font-size: 12px; margin-bottom: 8px; }
  .card .pill { display: inline-block; font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 4px; }
  .col-empty { font-size: 12px; color: var(--faint); padding: 8px 2px; }

  @media (max-width: 900px) {
    .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .priority-item { grid-template-columns: 1fr; gap: 2px; }
    .priority-item .loc { text-align: left; }
  }
</style>
</head>
<body>

<div id="loginScreen">
  <p class="brand">Rastreio VIPP</p>
  <p class="brand-sub">Radar de pedidos — Expedição</p>
  <label for="loginEmail">E-mail</label>
  <input type="email" id="loginEmail" placeholder="seu.email@stinpharma.com" />
  <label for="loginSenha">Senha</label>
  <input type="password" id="loginSenha" placeholder="••••••••" />
  <button class="btn" id="loginBtn" style="width:100%; justify-content:center;">Entrar</button>
  <p class="error" id="loginError" style="margin-top:12px;"></p>
</div>

<div id="appScreen" class="hidden">
  <div class="app-header">
    <div class="brand-block">
      <span class="brand">Rastreio VIPP</span>
      <span class="brand-sub">Radar de pedidos — Expedição</span>
    </div>
    <button class="btn ghost" id="logoutBtn">Sair</button>
  </div>
  <div class="rule"></div>

  <div class="toolbar">
    <label class="btn" for="fileInput">Importar Excel do VIPP</label>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" />
    <button class="btn accent" id="atualizarAgoraBtn">Atualizar agora</button>
    <span class="info mono" id="fileInfo"></span>
    <span class="error" id="errorMsg"></span>
    <span class="info" id="lastUpdate"></span>
    <input type="text" id="search" placeholder="Buscar por código, cliente, cidade..." />
  </div>

  <div id="staleWarning"></div>

  <div class="priority-box" id="priorityBox" style="display:none">
    <div class="priority-title">Aguardando retirada — ligar pro cliente <span class="count" id="priorityCount">0</span></div>
    <div class="priority-list" id="priorityList"></div>
  </div>

  <div class="board" id="board"></div>
</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyCpG7o-CF3twF0Jti0bRchrS97SWYQBuyo",
  authDomain: "stinpharma-qualidade.firebaseapp.com",
  databaseURL: "https://stinpharma-qualidade-default-rtdb.firebaseio.com",
  projectId: "stinpharma-qualidade",
  storageBucket: "stinpharma-qualidade.firebasestorage.app",
  messagingSenderId: "422803826984",
  appId: "1:422803826984:web:6e72e2470f3678eb8d881d",
  measurementId: "G-6C0TLHH2VP"
};

firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.database();

var GRUPO_PERMITIDO = "EXPEDIÇÃO";
var CAMINHO_PEDIDOS = "rastreioVipp/pedidos";

var STATUS_MAP = {
  "Objeto entregue ao destinatário": "entregue",
  "Objeto entregue ao remetente": "entregue",
  "Objeto entregue na Caixa de Correios Inteligente": "entregue",
  "Objeto em transferência": "transito",
  "Objeto saiu para entrega ao destinatário": "transito",
  "Objeto postado": "transito",
  "Objeto ainda não chegou à Un.": "transito",
  "Objeto aguardando retirada no endereço indicado": "retirada",
  "Objeto(s) Liberado(s) Para Download na Unidade Postadora": "aguardando",
  "Objeto(s) Gerado(s) Logistica Reversa": "aguardando",
  "Objeto(s) Não Etiquetado(s) Ou Range Esgotado": "aguardando",
  "Etiqueta Expirada": "problema",
  "Erro Geraçâo PPN": "problema",
  "Objeto não entregue - Endereço insuficiente": "problema",
  "Objeto não entregue - cliente mudou-se": "problema",
  "Objeto não entregue - Endereço inexistente": "problema"
};

var COLUMNS = [
  { key: "problema", title: "Problema", color: "#a5332c", bg: "#f6e6e3", text: "#6b201a" },
  { key: "aguardando", title: "Aguardando ação", color: "#b5651d", bg: "#f7ecd9", text: "#7a4210" },
  { key: "transito", title: "Em trânsito", color: "#2b6079", bg: "#e2eef1", text: "#163842" },
  { key: "entregue", title: "Entregue", color: "#3d6b40", bg: "#e6efe1", text: "#24401f" }
];

function bucketFor(status) { return STATUS_MAP[status] || "aguardando"; }
function escapeHtml(str) { return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function chaveSegura(codigo) {
  return String(codigo).replace(/[.#$\[\]\/]/g, "");
}

document.getElementById("loginBtn").addEventListener("click", function () {
  var email = document.getElementById("loginEmail").value.trim();
  var senha = document.getElementById("loginSenha").value;
  document.getElementById("loginError").textContent = "";
  auth.signInWithEmailAndPassword(email, senha).catch(function (err) {
    document.getElementById("loginError").textContent = "E-mail ou senha incorretos.";
  });
});

var allRows = [];
var refPedidos = null;

auth.onAuthStateChanged(function (user) {
  if (!user) {
    document.getElementById("loginScreen").classList.remove("hidden");
    document.getElementById("appScreen").classList.add("hidden");
    return;
  }
  db.ref("centralApps/usuarios/" + user.uid).once("value").then(function (snap) {
    var perfil = snap.val();
    var temAcesso = perfil && (perfil.admin === true || (Array.isArray(perfil.grupos) && perfil.grupos.indexOf(GRUPO_PERMITIDO) !== -1));
    if (!temAcesso) {
      document.getElementById("loginError").textContent = "Sua conta não tem acesso a este app.";
      auth.signOut();
      return;
    }
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("appScreen").classList.remove("hidden");
    escutarPedidos();
  });
});

document.getElementById("logoutBtn").addEventListener("click", function () {
  auth.signOut();
});

document.getElementById("atualizarAgoraBtn").addEventListener("click", async function () {
  var btn = document.getElementById("atualizarAgoraBtn");
  btn.disabled = true;
  btn.textContent = "Atualizando...";
  document.getElementById("errorMsg").textContent = "";
  try {
    var idToken = await auth.currentUser.getIdToken();
    var resposta = await fetch("https://central-de-apps.vercel.app/api/atualizar-rastreio", {
      headers: { Authorization: "Bearer " + idToken }
    });
    var dados = await resposta.json();
    if (!resposta.ok) {
      document.getElementById("errorMsg").textContent = "Erro ao atualizar: " + (dados.error || resposta.status);
    } else {
      document.getElementById("errorMsg").textContent = "";
      document.getElementById("fileInfo").textContent = dados.atualizados + " pedidos atualizados agora";
    }
  } catch (err) {
    document.getElementById("errorMsg").textContent = "Erro ao atualizar: " + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "Atualizar agora";
  }
});

function checarDesatualizado(maisRecente) {
  var aviso = document.getElementById("staleWarning");
  if (!maisRecente) { aviso.style.display = "none"; return; }
  var horasSemAtualizar = (Date.now() - maisRecente) / 1000 / 60 / 60;
  if (horasSemAtualizar > 26) {
    aviso.style.display = "block";
    aviso.textContent = "Nenhum pedido foi atualizado nas últimas " + Math.floor(horasSemAtualizar) + " horas. O robô automático pode ter parado (verifica se a chave da API dos Correios não expirou).";
  } else {
    aviso.style.display = "none";
  }
}
function escutarPedidos() {
  refPedidos = db.ref(CAMINHO_PEDIDOS);
  refPedidos.on("value", function (snapshot) {
    var dados = snapshot.val() || {};
    allRows = Object.keys(dados).map(function (chave) { return dados[chave]; });
    document.getElementById("fileInfo").textContent = allRows.length + " pedidos no total";
    var maisRecente = allRows.reduce(function (max, r) {
      return (r.atualizadoEm && r.atualizadoEm > max) ? r.atualizadoEm : max;
    }, 0);
    if (maisRecente) {
      document.getElementById("lastUpdate").textContent = "Última atualização: " + new Date(maisRecente).toLocaleString("pt-BR");
    }
    checarDesatualizado(maisRecente);
    render();
  });
}

document.getElementById("fileInput").addEventListener("change", function (e) {
  var file = e.target.files[0];
  if (!file) return;
  document.getElementById("errorMsg").textContent = "";
  document.getElementById("fileInfo").textContent = "Lendo arquivo...";

  var reader = new FileReader();
  reader.onload = function (evt) {
    try {
      var data = new Uint8Array(evt.target.result);
      var workbook = XLSX.read(data, { type: "array", cellDates: true });
      var sheet = workbook.Sheets[workbook.SheetNames[0]];
      var json = XLSX.utils.sheet_to_json(sheet, { defval: "", range: 1 });

      var linhas = json.filter(function (r) { return r.Registro; });
      salvarNoRealtimeDb(linhas, file.name);
    } catch (err) {
      document.getElementById("errorMsg").textContent = "Não consegui ler esse arquivo. Confirma se é o Excel exportado do VIPP.";
      document.getElementById("fileInfo").textContent = "";
    }
  };
  reader.readAsArrayBuffer(file);
});

function salvarNoRealtimeDb(linhas, nomeArquivo) {
  document.getElementById("fileInfo").textContent = "Salvando " + linhas.length + " pedidos...";
  var i = 0;
  function proximoLote() {
    var updates = {};
    var fim = Math.min(i + 500, linhas.length);
    for (; i < fim; i++) {
      var r = linhas[i];
      var chave = chaveSegura(r.Registro);
      updates[CAMINHO_PEDIDOS + "/" + chave] = {
        codigo: r.Registro,
        destinatario: r.Destinatario || "",
        cidade: r.CidadeDestinatario || "",
        uf: r.UFDestinatario || "",
        status: r.Status || "",
        servico: r.Servico || "",
        dataPostagem: r.DataPostagem ? String(r.DataPostagem) : "",
        nf: r.NumeroNotaFiscal || "",
        atualizadoEm: Date.now()
      };
    }
    db.ref().update(updates).then(function () {
      if (i < linhas.length) {
        proximoLote();
      } else {
        document.getElementById("fileInfo").textContent = nomeArquivo + " importado — " + linhas.length + " pedidos";
      }
    }).catch(function (err) {
      document.getElementById("errorMsg").textContent = "Erro ao salvar: " + err.message;
    });
  }
  proximoLote();
}

function render() {
  var term = document.getElementById("search").value.trim().toLowerCase();
  var grouped = { problema: [], aguardando: [], transito: [], entregue: [], retirada: [] };

  allRows.forEach(function (row) {
    if (term) {
      var haystack = (row.codigo + " " + row.destinatario + " " + row.cidade + " " + row.status + " " + row.nf).toLowerCase();
      if (haystack.indexOf(term) === -1) return;
    }
    grouped[bucketFor(row.status)].push(row);
  });

  var priorityBox = document.getElementById("priorityBox");
  var priorityList = document.getElementById("priorityList");
  var retirada = grouped.retirada;
  document.getElementById("priorityCount").textContent = retirada.length;
  if (retirada.length > 0) {
    priorityBox.style.display = "block";
    priorityList.innerHTML = retirada.map(function (row) {
      return '<div class="priority-item"><span class="codigo mono">' + escapeHtml(row.codigo) + '</span><span class="dest">' + escapeHtml(row.destinatario) + '</span><span class="nf mono">' + (row.nf ? "NF " + escapeHtml(row.nf) : "—") + '</span><span class="loc">' + escapeHtml(row.cidade) + '/' + escapeHtml(row.uf) + '</span></div>';
    }).join("");
  } else {
    priorityBox.style.display = "none";
  }

  var aguardandoTotal = grouped.aguardando;

  var board = document.getElementById("board");
  board.innerHTML = "";

  COLUMNS.forEach(function (col) {
    var items = col.key === "aguardando" ? aguardandoTotal : grouped[col.key];
    var colDiv = document.createElement("div");

    var header = document.createElement("div");
    header.className = "col-header";
    header.innerHTML = '<span class="dot" style="background:' + col.color + '"></span><span class="col-title">' + col.title + '</span><span class="col-count">' + items.length + '</span>';
    colDiv.appendChild(header);

    var list = document.createElement("div");
    list.className = "col-list";

    if (items.length === 0) {
      var emptyEl = document.createElement("div");
      emptyEl.className = "col-empty";
      emptyEl.textContent = "Nenhum pedido aqui";
      list.appendChild(emptyEl);
    } else {
      items.forEach(function (row) {
        var card = document.createElement("div");
        card.className = "card";
        card.innerHTML =
          '<div class="codigo">' + escapeHtml(row.codigo) + '</div>' +
          '<div class="dest">' + escapeHtml(row.destinatario) + '</div>' +
          '<div class="meta">' + escapeHtml(row.cidade) + (row.cidade && row.uf ? " / " : "") + escapeHtml(row.uf) + '</div>' +
          '<span class="pill" style="background:' + col.bg + ';color:' + col.text + '">' + escapeHtml(row.status || "Sem status") + '</span>';
        list.appendChild(card);
      });
    }
    colDiv.appendChild(list);
    board.appendChild(colDiv);
  });
}

document.getElementById("search").addEventListener("input", render);
</script>
</body>
</html>
