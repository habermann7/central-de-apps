<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Correção · Ofensor Laboratório + Cliente Conectar → Stinpharma</title>
</head>
<body style="font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;">
<h2>Correção de registros — Qualidade (SECO)</h2>
<p>Uso único: procura as NCs com <b>Ofensor = LABORATORIO</b> e <b>Cliente (usuário) = CONECTAR</b> e troca o Cliente pra <b>STINPHARMA</b> (o Ofensor continua Laboratório, não mexe nele). Depois de rodar com sucesso, pode apagar esse arquivo do repositório.</p>
<button id="scanBtn" style="font-size:14px;padding:10px 18px;cursor:pointer;">1. Procurar registros</button>
<button id="runBtn" style="font-size:14px;padding:10px 18px;cursor:pointer;display:none;margin-left:8px;">2. Aplicar correção</button>
<pre id="log" style="background:#111;color:#0f0;padding:14px;border-radius:8px;margin-top:16px;white-space:pre-wrap;min-height:60px;"></pre>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-database-compat.min.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCpG7o-CF3twF0Jti0bRchrS97SWYQBuyo",
  authDomain: "stinpharma-qualidade.firebaseapp.com",
  databaseURL: "https://stinpharma-qualidade-default-rtdb.firebaseio.com",
  projectId: "stinpharma-qualidade",
  storageBucket: "stinpharma-qualidade.firebasestorage.app",
  messagingSenderId: "422803826984",
  appId: "1:422803826984:web:6e72e2470f3678eb8d881d",
  measurementId: "G-6C0TLHH2VP"
};
firebase.initializeApp(firebaseConfig);
const DB_ROOT = 'qualidade';

function log(msg){ document.getElementById('log').textContent += msg + "\n"; }
function norm(v){ return String(v||'').trim().toUpperCase(); }

let encontrados = [];

document.getElementById('scanBtn').addEventListener('click', ()=>{
  document.getElementById('scanBtn').disabled = true;
  log('Entrando com a conta da Central de Apps (precisa estar logado nesse navegador)...');
  firebase.auth().onAuthStateChanged(user=>{
    if(!user){ log('ERRO: você precisa abrir este arquivo já logado pela Central de Apps.'); return; }
    log('Lendo registros...');
    firebase.database().ref(DB_ROOT + '/registros').once('value').then(snap=>{
      const regs = snap.val() || {};
      encontrados = Object.keys(regs).filter(id=>{
        const r = regs[id];
        return norm(r.ofensor) === 'LABORATORIO' && norm(r.usuario) === 'CONECTAR';
      });
      if(!encontrados.length){
        log('Nenhum registro encontrado com Ofensor=LABORATORIO e Cliente=CONECTAR. Nada a fazer.');
        return;
      }
      log('Encontrei ' + encontrados.length + ' registro(s):');
      encontrados.forEach(id=>{
        const r = regs[id];
        log('  NC-' + String(r.id).padStart(4,'0') + ' · ' + r.data + ' · ' + r.produto);
      });
      log('\nConfira a lista acima e clica em "Aplicar correção" pra trocar o Cliente desses registros pra STINPHARMA.');
      document.getElementById('runBtn').style.display = 'inline-block';
    }).catch(err=>{ log('ERRO ao ler: ' + err.message); });
  });
});

document.getElementById('runBtn').addEventListener('click', ()=>{
  if(!encontrados.length) return;
  if(!confirm('Vai trocar o Cliente de ' + encontrados.length + ' registro(s) de CONECTAR pra STINPHARMA. Confirma?')) return;
  document.getElementById('runBtn').disabled = true;
  const updates = {};
  encontrados.forEach(id=>{ updates[DB_ROOT + '/registros/' + id + '/usuario'] = 'STINPHARMA'; });
  firebase.database().ref().update(updates).then(()=>{
    log('\n✓ Pronto! ' + encontrados.length + ' registro(s) corrigido(s) pra Cliente = STINPHARMA.');
  }).catch(err=>{ log('ERRO ao salvar: ' + err.message); });
});
</script>
</body>
</html>
