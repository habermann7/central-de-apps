<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Apps</title>
<style>
  :root{
    --bg: #0a0d12;
    --bg-card: #12161d;
    --border: #1f2530;
    --text: #eef1f5;
    --text-dim: #8a93a3;
    --text-faint: #5a6270;
    --green: #3ecf8e;
    --accent-default: #4d9fff;
  }
  *{ box-sizing: border-box; }
  html{ background:var(--bg); }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    padding: 48px 24px 32px;
    position:relative;
    overflow-x:hidden;
  }
  /* fundo tipo planta técnica, bem sutil */
  body::before{
    content:'';
    position:fixed; inset:-10%;
    background-image:
      linear-gradient(rgba(77,159,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77,159,255,0.05) 1px, transparent 1px);
    background-size: 34px 34px;
    animation: driftGrid 50s linear infinite;
    pointer-events:none;
    z-index:0;
  }
  @keyframes driftGrid{ from{ transform:translate(0,0); } to{ transform:translate(34px,34px); } }

  .wrap{ max-width: 980px; margin: 0 auto; position:relative; z-index:1; }
  .pill{
    display:inline-flex; align-items:center; gap:8px;
    background: rgba(62,207,142,0.08);
    border: 1px solid rgba(62,207,142,0.25);
    color: var(--green);
    font-size: 12.5px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    padding: 6px 14px; border-radius: 999px; margin-bottom: 22px;
  }
  .pill .dot{ width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); animation: pulseDot 2.2s ease-in-out infinite; }
  @keyframes pulseDot{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

  h1{ font-size: 40px; font-weight: 800; margin: 0 0 14px; letter-spacing: -0.5px; }
  h1 .accent{ color:var(--accent-default); }
  .sub{ color: var(--text-dim); font-size: 15.5px; line-height: 1.6; max-width: 640px; margin-bottom: 40px; }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }
  .card, .add-card, .empty-state{
    opacity:0; transform:translateY(12px);
    animation: fadeIn .55s ease forwards;
  }
  @keyframes fadeIn{ to{ opacity:1; transform:translateY(0); } }

  .card{
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent-card, var(--accent-default));
    border-radius: 10px;
    padding: 22px;
    display:flex; flex-direction:column;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    text-decoration:none; color:inherit;
  }
  .card:hover{
    transform: translateY(-3px);
    border-color: #2a3140;
    box-shadow: 0 10px 28px -10px color-mix(in srgb, var(--accent-card, var(--accent-default)) 45%, transparent);
  }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
  .icon{
    width:38px; height:38px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
    background: color-mix(in srgb, var(--accent-card, var(--accent-default)) 18%, transparent);
  }
  .status{ font-size:11.5px; color: var(--green); display:flex; align-items:center; gap:5px; font-family: ui-monospace, monospace; }
  .status .dot{ width:5px; height:5px; border-radius:50%; background:var(--green); }
  .tag{ font-size:10.5px; letter-spacing:.06em; color: var(--accent-card, var(--accent-default)); font-weight:700; text-transform:uppercase; margin-bottom:6px; }
  .title{ font-size:18px; font-weight:700; margin-bottom:10px; }
  .desc{ font-size:13.5px; color:var(--text-dim); line-height:1.55; flex:1; margin-bottom:18px; }
  .open{ font-size:13.5px; font-weight:600; color: var(--accent-card, var(--accent-default)); }

  .add-card{
    border: 1.5px dashed var(--border);
    border-radius:10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; padding:40px 20px; color:var(--text-faint); font-size:13.5px;
    cursor:pointer; background:transparent; text-decoration:none;
    transition: border-color .18s ease, color .18s ease;
  }
  .add-card:hover{ border-color:var(--accent-default); color:var(--text-dim); }
  .plus{ width:34px; height:34px; border-radius:50%; border:1.5px dashed var(--text-faint); display:flex; align-items:center; justify-content:center; font-size:18px; transition:border-color .18s ease; }
  .add-card:hover .plus{ border-color:var(--accent-default); }

  /* estado vazio: convite com cantos tipo planta/blueprint */
  .empty-state{
    grid-column: 1 / -1;
    position:relative;
    border:1.5px dashed var(--border);
    border-radius:14px;
    padding:72px 40px;
    text-align:center;
    background: rgba(77,159,255,0.02);
  }
  .corner{ position:absolute; width:20px; height:20px; }
  .corner.tl{ top:-1px; left:-1px; border-top:2px solid var(--accent-default); border-left:2px solid var(--accent-default); }
  .corner.tr{ top:-1px; right:-1px; border-top:2px solid var(--accent-default); border-right:2px solid var(--accent-default); }
  .corner.bl{ bottom:-1px; left:-1px; border-bottom:2px solid var(--accent-default); border-left:2px solid var(--accent-default); }
  .corner.br{ bottom:-1px; right:-1px; border-bottom:2px solid var(--accent-default); border-right:2px solid var(--accent-default); }
  .empty-icon{
    width:52px; height:52px; margin:0 auto 22px; border-radius:50%;
    border:1.5px dashed var(--accent-default); display:flex; align-items:center; justify-content:center;
    font-size:24px; color:var(--accent-default);
  }
  .empty-state h2{ font-size:20px; margin:0 0 10px; font-weight:700; }
  .empty-state p{ color:var(--text-dim); font-size:14px; max-width:380px; margin:0 auto 26px; line-height:1.6; }
  .empty-cta{
    display:inline-block; background:var(--accent-default); color:#fff; text-decoration:none;
    font-size:13.5px; font-weight:700; padding:11px 22px; border-radius:8px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .empty-cta:hover{ transform:translateY(-2px); box-shadow:0 8px 20px -6px rgba(77,159,255,.5); }

  .error{ color:#ff8f80; grid-column:1/-1; font-size:14px; padding:20px 0; }
  footer{ display:flex; justify-content:space-between; color:var(--text-faint); font-size:12.5px; margin-top:44px; border-top:1px solid var(--border); padding-top:20px; }

  @media (prefers-reduced-motion: reduce){
    body::before{ animation:none; }
    .pill .dot{ animation:none; }
    .card, .add-card, .empty-state{ animation:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="pill"><span class="dot"></span> <span id="statusText">carregando...</span></div>
    <h1>Central de <span class="accent">Apps</span></h1>
    <p class="sub">Ferramentas internas que fomos construindo juntos. Clique num card para abrir. Sempre que alguém adiciona uma nova, ela aparece aqui pra todo mundo.</p>
    <div class="grid" id="grid"></div>
    <footer>
      <span>Central de Apps — atualiza sozinha conforme o time publica ferramentas novas.</span>
      <span id="countText">0 ferramentas</span>
    </footer>
  </div>

<script>
async function loadApps(){
  const grid = document.getElementById('grid');
  const statusText = document.getElementById('statusText');
  const countText = document.getElementById('countText');
  try{
    const res = await fetch('./manifest.json?t=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('manifest.json não encontrado');
    const apps = await res.json();

    if(!Array.isArray(apps) || apps.length === 0){
      grid.innerHTML = `
        <div class="empty-state">
          <span class="corner tl"></span><span class="corner tr"></span>
          <span class="corner bl"></span><span class="corner br"></span>
          <div class="empty-icon">+</div>
          <h2>Nenhum app publicado ainda</h2>
          <p>Essa vai ser a biblioteca de ferramentas do time. Assim que o primeiro app for publicado, o card dele aparece bem aqui.</p>
          <a class="empty-cta" href="./adicionar.html">Adicionar o primeiro app →</a>
        </div>`;
      statusText.textContent = 'pronta pra receber apps';
      countText.textContent = '0 ferramentas';
      return;
    }

    grid.innerHTML = apps.map((app, i) => `
      <a class="card" href="./${app.file}" style="--accent-card:${app.color || '#4d9fff'}; animation-delay:${i * 70}ms">
        <div class="card-top">
          <div class="icon">${app.icon || '🧩'}</div>
          <div class="status"><span class="dot"></span> online</div>
        </div>
        <div class="tag">${app.category || 'FERRAMENTA'}</div>
        <div class="title">${app.title}</div>
        <div class="desc">${app.description || ''}</div>
        <div class="open">Abrir app →</div>
      </a>
    `).join('') + `
      <a class="add-card" href="./adicionar.html" style="animation-delay:${apps.length * 70}ms">
        <div class="plus">+</div>
        Adicionar app
      </a>
    `;

    statusText.textContent = apps.length + ' apps ativos · sempre atualizado';
    countText.textContent = apps.length + ' ferramenta' + (apps.length > 1 ? 's' : '');
  }catch(err){
    grid.innerHTML = '<div class="error">Não consegui ler o manifest.json. Confira se este arquivo está sendo aberto por um servidor (http://...), não direto pelo Windows (file://...).</div>';
    statusText.textContent = 'erro ao carregar';
  }
}
loadApps();
</script>
</body>
</html>
