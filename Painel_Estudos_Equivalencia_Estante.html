<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudos de Equivalência · Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#f8f9fb; --surface-3:#eef1f5;
  --ink:#0f1720; --ink-2:#4b5563; --muted:#848b96; --line:#e3e6eb; --line-2:#d3d8df;
  --brand:#0f2a44; --brand-2:#1d4e89; --accent:#2a78d6; --accent-ink:#1c5cab;
  --good:#0ca30c; --good-ink:#0a6e0a; --good-bg:#e7f5e7;
  --info:#2a78d6; --info-ink:#1c5cab; --info-bg:#e6f0fb;
  --warn:#fab219; --warn-ink:#7a5000; --warn-bg:#fdf3dc;
  --crit:#d03b3b; --crit-ink:#a72b2b; --crit-bg:#fbe9e9;
  --shadow:0 1px 2px rgba(15,23,32,.04),0 4px 16px rgba(15,23,32,.05);
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d0f12; --surface:#16191e; --surface-2:#1b1f25; --surface-3:#222731;
    --ink:#f3f5f8; --ink-2:#c3c8d0; --muted:#8a919c; --line:#2a2f37; --line-2:#363c46;
    --brand:#0b1e31; --brand-2:#3987e5; --accent:#3987e5; --accent-ink:#86b6ef;
    --good-ink:#6fd36f; --good-bg:rgba(12,163,12,.16);
    --info-ink:#86b6ef; --info-bg:rgba(57,135,229,.16);
    --warn-ink:#fbc85a; --warn-bg:rgba(250,178,25,.15);
    --crit-ink:#f08a8a; --crit-bg:rgba(208,59,59,.18);
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0f12; --surface:#16191e; --surface-2:#1b1f25; --surface-3:#222731;
  --ink:#f3f5f8; --ink-2:#c3c8d0; --muted:#8a919c; --line:#2a2f37; --line-2:#363c46;
  --brand:#0b1e31; --brand-2:#3987e5; --accent:#3987e5; --accent-ink:#86b6ef;
  --good-ink:#6fd36f; --good-bg:rgba(12,163,12,.16);
  --info-ink:#86b6ef; --info-bg:rgba(57,135,229,.16);
  --warn-ink:#fbc85a; --warn-bg:rgba(250,178,25,.15);
  --crit-ink:#f08a8a; --crit-bg:rgba(208,59,59,.18);
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:Manrope,Inter,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
[hidden]{display:none!important}

/* top bar */
.topbar{background:var(--brand);color:#fff;padding:14px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:14px;flex:1 1 360px;min-width:0}
.logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#2a78d6,#1baf7a);display:grid;place-items:center;font:800 15px Manrope,Inter,system-ui,sans-serif;letter-spacing:.02em;flex:none}
.t1{font:800 18px/1.2 Manrope,Inter,system-ui,sans-serif}
.t2{font-size:12px;opacity:.75;max-width:720px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:9px;padding:8px 13px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.16)}
.btn.primary{background:#2a78d6;border-color:#2a78d6}
.btn.primary:hover{background:#256abf}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:#fab219;border-color:#fab219;color:#1a1300}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ver{background:rgba(255,255,255,.12)}
.pill.dirty{background:#fab219;color:#1a1300}
.pill.ro{background:rgba(255,255,255,.12)}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;min-width:290px;z-index:40}
.menu-list button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 11px;border-radius:8px;color:var(--ink)}
.menu-list button small{display:block;color:var(--muted);font-size:11.5px}
.menu-list button:hover{background:var(--surface-3)}

/* tabs */
.tabs{display:flex;gap:4px;padding:0 28px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:70px;z-index:20}
.tabs button{background:none;border:0;padding:14px 14px 12px;color:var(--ink-2);font-weight:600;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.tabs .count{background:var(--surface-3);border-radius:99px;padding:1px 8px;font-size:11.5px;margin-left:4px}

main{max-width:1320px;margin:0 auto;padding:24px 28px 64px}
.banner{max-width:1320px;margin:16px auto 0;padding:0 28px}
.banner .b{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-radius:12px;padding:11px 16px;font-weight:500}
.banner .b.info{background:var(--info-bg);color:var(--info-ink)}
.banner .b.warn{background:var(--warn-bg);color:var(--warn-ink)}
.banner .b .sp{flex:1}
.lnk{background:none;border:0;color:inherit;text-decoration:underline;font-weight:700;padding:0}

.sec-title{display:flex;align-items:baseline;gap:12px;margin:30px 0 12px}
.sec-title h2{font-size:17px}
.sec-title .sub{color:var(--muted);font-size:12.5px}
.sec-title .sp{flex:1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h3{font-size:14.5px;margin-bottom:2px}
.card .cap{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font:800 30px/1.15 Manrope,Inter,system-ui,sans-serif;margin-top:6px;letter-spacing:-.02em}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:700;margin-left:3px}
.kpi .s{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px}

/* status */
.st{display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.st i{font-style:normal;font-weight:800;width:15px;height:15px;border-radius:50%;display:inline-grid;place-items:center;font-size:9.5px;color:#fff;flex:none}
.st.proposta{background:var(--good-bg);color:var(--good-ink)} .st.proposta i{background:var(--good)}
.st.analise{background:var(--info-bg);color:var(--info-ink)} .st.analise i{background:var(--info)}
.st.pendente{background:var(--warn-bg);color:var(--warn-ink)} .st.pendente i{background:var(--warn);color:#3a2700}
.st.declinou{background:var(--crit-bg);color:var(--crit-ink)} .st.declinou i{background:var(--crit)}
.health{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;border-radius:99px;padding:4px 11px}
.health:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.health.good{background:var(--good-bg);color:var(--good-ink)}
.health.info{background:var(--info-bg);color:var(--info-ink)}
.health.warn{background:var(--warn-bg);color:var(--warn-ink)}
.health.crit{background:var(--crit-bg);color:var(--crit-ink)}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--ink-2);font-weight:500;white-space:nowrap}

.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend b{width:10px;height:10px;border-radius:3px;display:inline-block}

/* stacked bar */
.stack{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden;background:var(--surface-3)}
.stack div{display:grid;place-items:center;color:#fff;font-size:11.5px;font-weight:700;min-width:0}
.stack .s-pendente{color:#3a2700}
.stack.sm{height:10px;border-radius:4px}
.stack.sm div{font-size:0}
.srow{display:grid;grid-template-columns:150px 1fr 54px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.srow:last-child{border-bottom:0}
.srow .n{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .t{font-size:12px;color:var(--muted);text-align:right}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.donut-legend{display:grid;gap:10px;flex:1;min-width:200px}
.dl{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;font-size:13px}
.dl .pct{color:var(--muted);font-size:12px;width:40px;text-align:right}
.dl .num{font-weight:700}

/* study cards */
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:border-color .15s,transform .15s}
.scard:hover{border-color:var(--accent);transform:translateY(-1px)}
.scard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.scard h3{font-size:17px}
.scard .ref{font-size:12.5px;color:var(--ink-2)}
.scard .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px}
.scard .nums .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.scard .nums .v{font:800 17px Manrope,Inter,system-ui,sans-serif}
.scard .go{font-size:12.5px;font-weight:600;color:var(--accent-ink)}

/* matrix */
.scroll{overflow-x:auto}
.matrix{display:grid;gap:6px;min-width:720px}
.matrix .h{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:2px 4px}
.matrix .rn{font-weight:700;font-size:13px;display:flex;flex-direction:column;justify-content:center;padding:4px;cursor:pointer}
.matrix .rn small{font-weight:500;color:var(--muted);font-size:11.5px}
.mcell{border-radius:9px;padding:9px 10px;display:flex;flex-direction:column;gap:3px;min-height:58px;border:1px solid transparent}
.mcell .a{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px}
.mcell .a i{font-style:normal;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;color:#fff;flex:none}
.mcell .d{font-size:11.5px;opacity:.85}
.mcell.proposta{background:var(--good-bg);color:var(--good-ink)} .mcell.proposta i{background:var(--good)}
.mcell.analise{background:var(--info-bg);color:var(--info-ink)} .mcell.analise i{background:var(--info)}
.mcell.pendente{background:var(--warn-bg);color:var(--warn-ink)} .mcell.pendente i{background:var(--warn);color:#3a2700}
.mcell.declinou{background:var(--crit-bg);color:var(--crit-ink)} .mcell.declinou i{background:var(--crit)}
.mcell.vazio{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line-2)}

/* alerts */
.alerts{display:grid;gap:8px}
.al{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:11px 13px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13px}
.al .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff}
.al.crit .ic{background:var(--crit)} .al.warn .ic{background:var(--warn);color:#3a2700} .al.info .ic{background:var(--muted)}
.al b{font-weight:700}
.al .meta{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}

/* svg charts */
svg text{font-family:Inter,sans-serif}
.tl{width:100%;height:auto;display:block;min-width:720px}
.tl .lab{font-size:13px;font-weight:700;fill:var(--ink)}
.tl .labs{font-size:11px;fill:var(--muted)}
.tl .tick{font-size:11px;fill:var(--muted)}
.tl .grid{stroke:var(--line);stroke-width:1}
.tl .track{stroke:var(--surface-3);stroke-width:10;stroke-linecap:round}
.tl .fill{stroke:var(--accent);stroke-opacity:.28;stroke-width:10;stroke-linecap:round}
.tl .today{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:4 4}
.tl .todayt{font-size:11px;font-weight:700;fill:var(--ink-2)}
.tl .dot{stroke:var(--surface);stroke-width:2.5}
.tl .start{fill:var(--surface);stroke:var(--ink-2);stroke-width:2}
.tl .stale{stroke:var(--line-2);stroke-width:2;stroke-dasharray:3 4}
.tl .resp{stroke-width:3;stroke-linecap:round}
.tl .end{font-size:11.5px;fill:var(--ink-2);font-weight:600}
.donut text{fill:var(--ink)}

/* studies tab */
.selector{display:flex;gap:8px;flex-wrap:wrap}
.selector button{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:11px;padding:9px 14px;font-weight:700;display:inline-flex;align-items:center;gap:9px}
.selector button.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.selector button .dot{width:8px;height:8px;border-radius:50%}
.selector button.add{border-style:dashed;color:var(--accent-ink)}
.shead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin:22px 0 16px}
.shead h1{font-size:28px;letter-spacing:-.02em}
.shead .sp{flex:1}
.shead .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn2{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 13px;font-weight:600;font-size:13px;display:inline-flex;gap:7px;align-items:center}
.btn2:hover{background:var(--surface-3)}
.btn2.danger{color:var(--crit-ink);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.btn2.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.info-grid>div{background:var(--surface);padding:14px 16px}
.info-grid .wide{grid-column:1/-1}
.info-grid .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:4px}
.info-grid .v{font-weight:600}
.info-grid .v.txt{font-weight:400;color:var(--ink-2);white-space:pre-line}
.funnel{display:grid;gap:10px}
.fr{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center;font-size:13px}
.fr .bw{background:var(--surface-3);border-radius:6px;height:30px;position:relative}
.fr .b{height:100%;border-radius:6px;display:flex;align-items:center;padding:0 10px;color:#fff;font-weight:700;font-size:12.5px;min-width:34px}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.num{text-align:right;font-weight:600}
table.t th.num{text-align:right}
.mut{color:var(--muted)}
.fld{width:100%;border:1px solid var(--line-2);background:var(--surface-2);border-radius:8px;padding:7px 9px;font-size:13px}
.fld:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
textarea.fld{min-height:70px;resize:vertical}
.editing .info-grid>div{background:var(--surface-2)}
.edit-flag{display:inline-flex;align-items:center;gap:6px;background:var(--warn-bg);color:var(--warn-ink);font-weight:700;font-size:12px;border-radius:99px;padding:4px 11px}
.xbtn{background:none;border:0;color:var(--crit-ink);font-weight:700;font-size:16px;padding:2px 8px;border-radius:6px}
.xbtn:hover{background:var(--crit-bg)}

/* history */
.vlist{display:grid;gap:12px}
.vitem{display:grid;grid-template-columns:56px minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.vnum{width:48px;height:48px;border-radius:12px;background:var(--surface-3);display:grid;place-items:center;font:800 16px Manrope,Inter,system-ui,sans-serif;color:var(--ink)}
.vitem.latest .vnum{background:var(--accent);color:#fff}
.vitem .vh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vitem .vh h3{font-size:15px}
.vitem .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.vitem .note{margin-top:8px;color:var(--ink-2)}
.vitem ul{margin:10px 0 0;padding-left:18px;color:var(--ink-2);font-size:13px}
.vitem li{margin:3px 0}
.vitem .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media (max-width:520px){.vitem{grid-template-columns:1fr;gap:10px}.vitem .vnum{width:auto;justify-self:start;padding:4px 12px}}
.evo{display:flex;gap:18px;align-items:flex-end;height:200px;padding:10px 4px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.evo .col{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:46px;height:100%;justify-content:flex-end}
.evo .bars{display:flex;flex-direction:column-reverse;gap:2px;width:34px}
.evo .bars div{border-radius:3px}
.evo .bars div:last-child{border-radius:5px 5px 3px 3px}
.evo .lb{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.evo .tt{font-size:12px;font-weight:700}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,14,22,.55);display:grid;place-items:center;z-index:100;padding:16px}
.modal-card{background:var(--surface);color:var(--ink);border-radius:16px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal-card h2{font-size:20px;margin-bottom:6px}
.modal-card .cap{color:var(--muted);font-size:13px;margin-bottom:16px}
.modal-card label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.04em}
.modal-card .changes{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;max-height:220px;overflow:auto;font-size:13px}
.modal-card .changes li{margin:3px 0}
.modal-card .row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.check{display:flex!important;gap:8px;align-items:center;text-transform:none!important;letter-spacing:0!important;font-weight:500!important;font-size:13px!important;color:var(--ink)!important}

.tip{position:fixed;pointer-events:none;background:#0f1720;color:#fff;border-radius:9px;padding:8px 11px;font-size:12.5px;max-width:320px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .08s;line-height:1.45}
.tip.on{opacity:1}
#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:8px;z-index:150}

/* ===================== métricas ===================== */
function metrics(s,ref){
  var c={proposta:0,analise:0,pendente:0,declinou:0};
  s.labs.forEach(function(l){c[l.status]=(c[l.status]||0)+1;});
  var total=s.labs.length, ativos=c.analise+c.pendente+c.proposta;
  var ds=s.labs.map(function(l){return l.data;}).filter(Boolean).sort();
  var last=ds.length?ds[ds.length-1]:null;
  var dias=s.solicitacao?days(s.solicitacao,ref):null;
  var vals=s.labs.filter(function(l){return l.valor!=null;}).map(function(l){return l.valor;});
  var best=vals.length?Math.min.apply(null,vals):null;
  var h;
  if(c.proposta>0) h={k:'good',label:'Com proposta'};
  else if(total && c.analise+c.pendente===0) h={k:'crit',label:'Sem laboratório ativo'};
  else if((total && c.declinou/total>=0.6) || (dias!=null && dias>30)) h={k:'warn',label:'Atenção'};
  else h={k:'info',label:'Em andamento'};
  return {c:c,total:total,ativos:ativos,last:last,dias:dias,semMov:last?days(last,ref):null,vals:vals,best:best,health:h};
}
function overall(d,ref){
  var c={proposta:0,analise:0,pendente:0,declinou:0},total=0;
  var ms=d.studies.map(function(s){return {s:s,m:metrics(s,ref)};});
  ms.forEach(function(x){KEYS.forEach(function(k){c[k]+=x.m.c[k];});total+=x.m.total;});
  var vals=[];d.studies.forEach(function(s){s.labs.forEach(function(l){if(l.valor!=null)vals.push(l.valor);});});
  var open=ms.filter(function(x){return x.m.dias!=null;});
  var avg=open.length?Math.round(open.reduce(function(a,x){return a+x.m.dias;},0)/open.length):null;
  var oldest=open.slice().sort(function(a,b){return b.m.dias-a.m.dias;})[0];
  return {c:c,total:total,labs:labOrder(d),vals:vals,avg:avg,oldest:oldest,ms:ms};
}
function alertsOf(d,ref){
  var out=[];
  d.studies.forEach(function(s){
    var m=metrics(s,ref);
    if(m.health.k==='crit') out.push({lvl:'crit',study:s.nome,text:'Nenhum laboratório ativo: todos os '+m.total+' cotados declinaram. Necessário ampliar a cotação.'});

  });

/* ===================== diff ===================== */
function diff(a,b){
  var ch=[], am={}, bm={};
  a.studies.forEach(function(s){am[norm(s.nome)]=s;});
  b.studies.forEach(function(s){bm[norm(s.nome)]=s;});
  b.studies.forEach(function(s){ if(!am[norm(s.nome)]) ch.push('Estudo incluído: '+s.nome+' ('+plural(s.labs.length,'laboratório','laboratórios')+')'); });
  a.studies.forEach(function(s){ if(!bm[norm(s.nome)]) ch.push('Estudo removido: '+s.nome); });
  b.studies.forEach(function(s){
    var o=am[norm(s.nome)]; if(!o) return;
    FIELDS.forEach(function(f){var k=f[0]; var x=o[k]||'', y=s[k]||''; if(String(x).trim()!==String(y).trim()){
      if(k==='solicitacao') ch.push(s.nome+' · data de solicitação alterada de '+br(x||null)+' para '+br(y||null));
      else ch.push(s.nome+' · campo "'+f[1]+'" atualizado');}});
    var ol={}, nl={};
    o.labs.forEach(function(l){ol[norm(l.lab)]=l;}); s.labs.forEach(function(l){nl[norm(l.lab)]=l;});
    s.labs.forEach(function(l){
      var p=ol[norm(l.lab)];
      if(!p){ch.push(s.nome+' · '+l.lab+' incluído ('+ST[l.status].label+')');return;}
      if(p.status!==l.status) ch.push(s.nome+' · '+l.lab+': situação alterada de "'+ST[p.status].label+'" para "'+ST[l.status].label+'"');
      if((p.data||'')!==(l.data||'')) ch.push(s.nome+' · '+l.lab+': última atualização alterada de '+br(p.data)+' para '+br(l.data));
      if((p.obs||'').trim()!==(l.obs||'').trim()) ch.push(s.nome+' · '+l.lab+': observação '+(l.obs?'atualizada para "'+l.obs.trim()+'"':'removida'));
      if((p.valor==null?null:+p.valor)!==(l.valor==null?null:+l.valor)) ch.push(s.nome+' · '+l.lab+': valor da proposta '+(l.valor!=null?'registrado em '+brl(l.valor):'removido'));
    });
    o.labs.forEach(function(l){ if(!nl[norm(l.lab)]) ch.push(s.nome+' · '+l.lab+' removido'); });
  });
  return ch;
}

function cellDate(v){
  if(v==null||v==='') return null;
  if(typeof v==='number' && window.XLSX){var p=XLSX.SSF.parse_date_code(v); if(p) return p.y+'-'+pad(p.m)+'-'+pad(p.d);}
  if(v instanceof Date) return v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate());
  var m=String(v).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  m=String(v).match(/(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  return null;
}

    var r=rows[i], a=S(r[0]); if(!a) break; if(norm(a).indexOf('estudos no portfolio')===0||norm(a).indexOf('laboratorios cotados')===0) break;
    studies.push({id:uid(),nome:a.toUpperCase(),apresentacoes:S(r[1]),classe:S(r[2]),indicacao:S(r[3]),referencia:S(r[4]),companhia:S(r[5]),solicitacao:null,labs:[]});
  }
  var byName={}; studies.forEach(function(s){byName[norm(s.nome)]=s;});
  for(i=0;i<rows.length;i++){
    var s=byName[norm(rows[i][0])];
    if(!s || norm(rows[i][1]).indexOf('solicita')<0) continue;
    s.solicitacao=cellDate(rows[i][1]);
    var j=i+1; while(j<rows.length && norm(rows[j][0]).indexOf('laborat')!==0) j++;
    if(j>=rows.length) continue;
    var h=rows[j].map(norm), cD=1,cS=2,cO=3,cV=-1;
    h.forEach(function(x,k){ if(/ultima|atualiza/.test(x))cD=k; else if(/situa|status/.test(x))cS=k; else if(/observa/.test(x))cO=k; else if(/valor|orcamento/.test(x))cV=k; });
    for(j=j+1;j<rows.length;j++){
      var rr=rows[j], la=S(rr[0]); if(!la || byName[norm(la)]) break;
      var obs=S(rr[cO]); var val=cV>=0&&rr[cV]!=null&&rr[cV]!==''?(typeof rr[cV]==='number'?rr[cV]:parseMoney('R$ '+rr[cV])):parseMoney(obs);
      s.labs.push({lab:la.replace(/^\d+\s*[.)-]\s*/,''),data:cellDate(rr[cD]),status:normStatus(rr[cS]),obs:obs,valor:val});
    }
  }
  if(!studies.length) throw new Error('Nenhum estudo encontrado abaixo do cabeçalho.');
  return {meta:meta,studies:studies};
}
function importFile(file){
  if(!window.XLSX){toast('A biblioteca de leitura de planilhas não carregou. Verifique a conexão com a internet.','err');return;}
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(fr.result),{type:'array'}), parsed=null, err=null, nLabs=-1;
      /* escolhe a aba com mais laboratórios cotados (a aba "Geral" só tem o resumo, sem laboratórios) */
      wb.SheetNames.forEach(function(n){ try{ var pr=parseRows(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null})); var k=pr.studies.reduce(function(a,s){return a+s.labs.length;},0); if(k>nLabs){nLabs=k; parsed=pr;} }catch(e){ err=err||e; } });
      if(!parsed) throw err||new Error('Planilha sem dados reconhecíveis.');
      if(nLabs===0) throw new Error('Nenhuma aba com laboratórios cotados. Confira se a planilha tem os blocos "Laboratórios / Situação".');
      if(!state) throw new Error('Os dados do painel ainda não carregaram. Recarregue a página e tente de novo.');
      var old={}; state.studies.forEach(function(s){old[norm(s.nome)]=s.id;});
      parsed.studies.forEach(function(s){ if(old[norm(s.nome)]) s.id=old[norm(s.nome)]; });
      state=parsed; pendingOrigin='Planilha importada ('+file.name+')';
      markDirty(); view.version=null; render(); openSave();
    }catch(e){ toast('Não foi possível ler a planilha: '+e.message,'err'); }
  };
  fr.readAsArrayBuffer(file);
}

function stackBar(c,total,sm){
  if(!total) return '<div class="stack'+(sm?' sm':'')+'"></div>';

function donut(c,total){
  var R=62,W=16,C=2*Math.PI*R,off=0,gap=total>1?3:0,out='';
  KEYS.forEach(function(k){ if(!c[k]) return; var len=c[k]/total*C;
    out+='<circle cx="80" cy="80" r="'+R+'" fill="none" stroke="'+ST[k].hex+'" stroke-width="'+W+'" stroke-dasharray="'+Math.max(len-gap,0.5)+' '+(C-Math.max(len-gap,0.5))+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 80 80)" data-tip="'+esc(ST[k].label+': '+c[k]+' ('+Math.round(c[k]/total*100)+'%)')+'" style="cursor:default"/>'; off+=len; });
  return '<svg class="donut" viewBox="0 0 160 160" width="170" height="170" role="img" aria-label="Distribuição das cotações por situação">'+
    '<circle cx="80" cy="80" r="'+R+'" fill="none" stroke="var(--surface-3)" stroke-width="'+W+'"/>'+out+
    '<text x="80" y="78" text-anchor="middle" style="font:800 30px Manrope,Inter,sans-serif">'+total+'</text><text x="80" y="98" text-anchor="middle" style="font:600 11px Inter;fill:var(--muted)">cotações</text></svg>';

function timeline(rows,ref,opt){
  opt=opt||{};
  var W=1000,L=opt.labelW||180,R=70,rowH=opt.rowH||44,top=34,H=top+rows.length*rowH+10;
  var all=[ref]; rows.forEach(function(r){ if(r.start) all.push(r.start); r.points.forEach(function(p){if(p.date) all.push(p.date);}); });
  all.sort(); var t0=utc(all[0])-2*864e5, t1=utc(ref)+2*864e5; if(t1-t0<20*864e5) t0=t1-20*864e5;
  var x=function(iso){return L+(utc(iso)-t0)/(t1-t0)*(W-L-R);};
  var g='', span=(t1-t0)/864e5, step=span>120?30:span>50?14:7;
  for(var t=t0+864e5;t<t1;t+=step*864e5){var iso=isoFromUTC(t); var xx=x(iso);
    g+='<line class="grid" x1="'+xx+'" x2="'+xx+'" y1="'+(top-8)+'" y2="'+(H-6)+'"/><text class="tick" x="'+xx+'" y="'+(top-14)+'" text-anchor="middle">'+brShort(iso)+'</text>';}
  var xr=x(ref);
  g+='<line class="today" x1="'+xr+'" x2="'+xr+'" y1="'+(top-8)+'" y2="'+(H-6)+'"/><text class="todayt" x="'+(xr+6)+'" y="'+(top-14)+'">'+(opt.refLabel||'Hoje')+' '+brShort(ref)+'</text>';
  rows.forEach(function(r,i){
    var cy=top+i*rowH+rowH/2;
    g+='<text class="lab" x="0" y="'+(r.sub?cy-2:cy+4)+'">'+esc(r.label)+'</text>';
    if(r.sub) g+='<text class="labs" x="0" y="'+(cy+13)+'">'+esc(r.sub)+'</text>';
    if(opt.mode==='study'){
      var p=r.points[0];
      if(r.start && p && p.date){ var a=x(r.start<p.date?r.start:p.date), b=x(p.date);
        g+='<line class="resp" x1="'+x(r.start)+'" x2="'+b+'" y1="'+cy+'" y2="'+cy+'" stroke="'+ST[p.status].hex+'" stroke-opacity=".45"/>';
        if(p.status!=='declinou' && p.status!=='proposta') g+='<line class="stale" x1="'+b+'" x2="'+xr+'" y1="'+cy+'" y2="'+cy+'"/>';
      } else if(r.start){ g+='<line class="stale" x1="'+x(r.start)+'" x2="'+xr+'" y1="'+cy+'" y2="'+cy+'"/>'; }
      if(r.start) g+='<circle class="start" cx="'+x(r.start)+'" cy="'+cy+'" r="5" data-tip="'+esc('Solicitação: '+br(r.start))+'"/>';
      if(p && p.date) g+='<circle class="dot" cx="'+x(p.date)+'" cy="'+cy+'" r="8" fill="'+ST[p.status].hex+'" data-tip="'+esc(p.tip)+'"/>';
      if(r.end) g+='<text class="end" x="'+(W-R+8)+'" y="'+(cy+4)+'">'+esc(r.end)+'</text>';
    } else {
      if(r.start){ g+='<line class="track" x1="'+x(r.start)+'" x2="'+xr+'" y1="'+cy+'" y2="'+cy+'"/><line class="fill" x1="'+x(r.start)+'" x2="'+xr+'" y1="'+cy+'" y2="'+cy+'"/>';
        g+='<circle class="start" cx="'+x(r.start)+'" cy="'+cy+'" r="6" data-tip="'+esc('Solicitação: '+br(r.start))+'"/>'; }
      var by={}; r.points.forEach(function(p){ if(!p.date) return; (by[p.date]=by[p.date]||[]).push(p); });
      Object.keys(by).forEach(function(dt){ var ps=by[dt]; ps.forEach(function(p,k){ var dy=(k-(ps.length-1)/2)*9;
        g+='<circle class="dot" cx="'+x(dt)+'" cy="'+(cy+dy)+'" r="6.5" fill="'+ST[p.status].hex+'" data-tip="'+esc(p.tip)+'"/>'; }); });
      if(r.end) g+='<text class="end" x="'+(W-R+8)+'" y="'+(cy+4)+'">'+esc(r.end)+'</text>';
    }
  });
  return '<div class="scroll"><svg class="tl" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Linha do tempo">'+g+'</svg></div>';
}

  function kbox(x,y,w,h,l,v,s,col){

/* ===================== tooltip / toast ===================== */
var tip=$('#tip');
document.addEventListener('mouseover',function(e){var t=e.target.closest&&e.target.closest('[data-tip]'); if(!t){tip.classList.remove('on');return;} tip.innerHTML=esc(t.getAttribute('data-tip')).replace(/\n/g,'<br>'); tip.classList.add('on');});
document.addEventListener('mousemove',function(e){ if(!tip.classList.contains('on')) return; var x=e.clientX+14,y=e.clientY+14,r=tip.getBoundingClientRect(); if(x+r.width>innerWidth-8)x=e.clientX-r.width-14; if(y+r.height>innerHeight-8)y=e.clientY-r.height-14; tip.style.left=x+'px'; tip.style.top=y+'px';});
function toast(msg,kind){var t=document.createElement('div'); t.className='toast '+(kind||''); t.textContent=msg; $('#toasts').appendChild(t); setTimeout(function(){t.remove();},5200);}

/* ===================== banco (Estante / Firebase) ===================== */
function aplicaBanco(v){
  var h=v.history||{};
  store.history=Object.keys(h).sort(function(a,b){return +a.slice(1)-+b.slice(1);}).map(function(k){return h[k];});
  store.current=clone(v.current);
  if(!dirty) state=clone(store.current);
}
function checkDraft(){
  try{ var dr=JSON.parse(lsGet(KEY+':draft')||'null'); if(dr && dr.base===store.history.length && diff(store.current,dr.state).length) draftOffer=true; else if(dr) lsDel(KEY+':draft'); }catch(e){}
}
function carregaBanco(){
  var ref=firebase.database().ref('eqEstudos');
  ref.once('value').then(function(snap){
    var v=snap.val();
    if(!v||!v.current){
      v={current:clone(SEED_DATA.current), history:{}};
      SEED_DATA.history.forEach(function(h){v.history['v'+h.v]=h;});
      return ref.set(v).then(function(){return v;});
    }
    return v;
  }).then(function(v){
    aplicaBanco(v); checkDraft(); render();
    ref.on('value',function(s){ var nv=s.val(); if(!nv||!nv.current||dirty||editMode) return; aplicaBanco(nv); render(); });
  }).catch(function(err){
    var m=String((err&&err.message)||err||'');
    var motivo=/permission|denied/i.test(m)?'Seu usuário não tem permissão de leitura nos dados deste app. Peça para o admin conferir o grupo e se as regras do Firebase foram publicadas.':'Não consegui carregar os dados agora. Recarregue a página.';
    document.getElementById('app').innerHTML='<div class="empty" style="padding:40px 20px;text-align:center"><b>Os dados não carregaram.</b><br>'+esc(motivo)+'<br><small style="color:var(--muted)">Detalhe técnico: '+esc(m)+'</small></div>';
    toast('Dados não carregados. Veja a mensagem na tela.',true);
  });
}
function salvarNoBanco(e){
  var ref=firebase.database().ref('eqEstudos');
  return ref.child('history').once('value').then(function(snap){
    if(snap.numChildren()!==store.history.length) throw new Error('Outra pessoa salvou uma versão agora. Recarregue a página, confira e salve de novo.');
    var upd={}; upd['current']=clone(state); upd['history/v'+e.v]=e;
    return ref.update(upd);
  }).then(function(){
    store.history.push(e); store.current=clone(state); dirty=false; pendingOrigin=null; editMode=false; lsDel(KEY+':draft');
  });
}
window.__startApp=carregaBanco;
