<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Non Retail BSB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#f8f9fb; --surface-3:#eef1f5;
  --ink:#0f1720; --ink-2:#4b5563; --muted:#848b96; --line:#e3e6eb; --line-2:#d3d8df;
  --brand:#0f2a44; --brand-2:#1d4e89; --accent:#2a78d6; --accent-ink:#1c5cab;
  --good:#0ca30c; --good-ink:#0a6e0a; --good-bg:#e7f5e7;
  --info:#2a78d6; --info-ink:#1c5cab; --info-bg:#e6f0fb;
  --warn:#fab219; --warn-ink:#7a5000; --warn-bg:#fdf3dc;
  --crit:#d03b3b; --crit-ink:#a72b2b; --crit-bg:#fbe9e9;
  --shadow:0 1px 2px rgba(15,23,32,.04),0 4px 16px rgba(15,23,32,.05);
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d0f12; --surface:#16191e; --surface-2:#1b1f25; --surface-3:#222731;
    --ink:#f3f5f8; --ink-2:#c3c8d0; --muted:#8a919c; --line:#2a2f37; --line-2:#363c46;
    --brand:#0b1e31; --brand-2:#3987e5; --accent:#3987e5; --accent-ink:#86b6ef;
    --good-ink:#6fd36f; --good-bg:rgba(12,163,12,.16);
    --info-ink:#86b6ef; --info-bg:rgba(57,135,229,.16);
    --warn-ink:#fbc85a; --warn-bg:rgba(250,178,25,.15);
    --crit-ink:#f08a8a; --crit-bg:rgba(208,59,59,.18);
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0f12; --surface:#16191e; --surface-2:#1b1f25; --surface-3:#222731;
  --ink:#f3f5f8; --ink-2:#c3c8d0; --muted:#8a919c; --line:#2a2f37; --line-2:#363c46;
  --brand:#0b1e31; --brand-2:#3987e5; --accent:#3987e5; --accent-ink:#86b6ef;
  --good-ink:#6fd36f; --good-bg:rgba(12,163,12,.16);
  --info-ink:#86b6ef; --info-bg:rgba(57,135,229,.16);
  --warn-ink:#fbc85a; --warn-bg:rgba(250,178,25,.15);
  --crit-ink:#f08a8a; --crit-bg:rgba(208,59,59,.18);
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:Manrope,Inter,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
[hidden]{display:none!important}

/* top bar */
.topbar{background:var(--brand);color:#fff;padding:14px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:14px;flex:1 1 360px;min-width:0}
.logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#2a78d6,#1baf7a);display:grid;place-items:center;font:800 15px Manrope,Inter,system-ui,sans-serif;letter-spacing:.02em;flex:none}
.t1{font:800 18px/1.2 Manrope,Inter,system-ui,sans-serif}
.t2{font-size:12px;opacity:.75;max-width:720px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:9px;padding:8px 13px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.16)}
.btn.primary{background:#2a78d6;border-color:#2a78d6}
.btn.primary:hover{background:#256abf}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:#fab219;border-color:#fab219;color:#1a1300}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ver{background:rgba(255,255,255,.12)}
.pill.dirty{background:#fab219;color:#1a1300}
.pill.ro{background:rgba(255,255,255,.12)}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;min-width:290px;z-index:40}
.menu-list button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 11px;border-radius:8px;color:var(--ink)}
.menu-list button small{display:block;color:var(--muted);font-size:11.5px}
.menu-list button:hover{background:var(--surface-3)}

/* tabs */
.tabs{display:flex;gap:4px;padding:0 28px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:70px;z-index:20}
.tabs button{background:none;border:0;padding:14px 14px 12px;color:var(--ink-2);font-weight:600;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.tabs .count{background:var(--surface-3);border-radius:99px;padding:1px 8px;font-size:11.5px;margin-left:4px}

main{max-width:1320px;margin:0 auto;padding:24px 28px 64px}
.banner{max-width:1320px;margin:16px auto 0;padding:0 28px}
.banner .b{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-radius:12px;padding:11px 16px;font-weight:500}
.banner .b.info{background:var(--info-bg);color:var(--info-ink)}
.banner .b.warn{background:var(--warn-bg);color:var(--warn-ink)}
.banner .b .sp{flex:1}
.lnk{background:none;border:0;color:inherit;text-decoration:underline;font-weight:700;padding:0}

.sec-title{display:flex;align-items:baseline;gap:12px;margin:30px 0 12px}
.sec-title h2{font-size:17px}
.sec-title .sub{color:var(--muted);font-size:12.5px}
.sec-title .sp{flex:1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h3{font-size:14.5px;margin-bottom:2px}
.card .cap{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font:800 30px/1.15 Manrope,Inter,system-ui,sans-serif;margin-top:6px;letter-spacing:-.02em}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:700;margin-left:3px}
.kpi .s{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px}

/* status */
.st{display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.st i{font-style:normal;font-weight:800;width:15px;height:15px;border-radius:50%;display:inline-grid;place-items:center;font-size:9.5px;color:#fff;flex:none}
.st.proposta{background:var(--good-bg);color:var(--good-ink)} .st.proposta i{background:var(--good)}
.st.analise{background:var(--info-bg);color:var(--info-ink)} .st.analise i{background:var(--info)}
.st.pendente{background:var(--warn-bg);color:var(--warn-ink)} .st.pendente i{background:var(--warn);color:#3a2700}
.st.declinou{background:var(--crit-bg);color:var(--crit-ink)} .st.declinou i{background:var(--crit)}
.health{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;border-radius:99px;padding:4px 11px}
.health:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.health.good{background:var(--good-bg);color:var(--good-ink)}
.health.info{background:var(--info-bg);color:var(--info-ink)}
.health.warn{background:var(--warn-bg);color:var(--warn-ink)}
.health.crit{background:var(--crit-bg);color:var(--crit-ink)}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--ink-2);font-weight:500;white-space:nowrap}

.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend b{width:10px;height:10px;border-radius:3px;display:inline-block}

/* stacked bar */
.stack{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden;background:var(--surface-3)}
.stack div{display:grid;place-items:center;color:#fff;font-size:11.5px;font-weight:700;min-width:0}
.stack .s-pendente{color:#3a2700}
.stack.sm{height:10px;border-radius:4px}
.stack.sm div{font-size:0}
.srow{display:grid;grid-template-columns:150px 1fr 54px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.srow:last-child{border-bottom:0}
.srow .n{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .t{font-size:12px;color:var(--muted);text-align:right}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.donut-legend{display:grid;gap:10px;flex:1;min-width:200px}
.dl{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;font-size:13px}
.dl .pct{color:var(--muted);font-size:12px;width:40px;text-align:right}
.dl .num{font-weight:700}

/* study cards */
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:border-color .15s,transform .15s}
.scard:hover{border-color:var(--accent);transform:translateY(-1px)}
.scard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.scard h3{font-size:17px}
.scard .ref{font-size:12.5px;color:var(--ink-2)}
.scard .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px}
.scard .nums .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.scard .nums .v{font:800 17px Manrope,Inter,system-ui,sans-serif}
.scard .go{font-size:12.5px;font-weight:600;color:var(--accent-ink)}

/* matrix */
.scroll{overflow-x:auto}
.matrix{display:grid;gap:6px;min-width:720px}
.matrix .h{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:2px 4px}
.matrix .rn{font-weight:700;font-size:13px;display:flex;flex-direction:column;justify-content:center;padding:4px;cursor:pointer}
.matrix .rn small{font-weight:500;color:var(--muted);font-size:11.5px}
.mcell{border-radius:9px;padding:9px 10px;display:flex;flex-direction:column;gap:3px;min-height:58px;border:1px solid transparent}
.mcell .a{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px}
.mcell .a i{font-style:normal;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;color:#fff;flex:none}
.mcell .d{font-size:11.5px;opacity:.85}
.mcell.proposta{background:var(--good-bg);color:var(--good-ink)} .mcell.proposta i{background:var(--good)}
.mcell.analise{background:var(--info-bg);color:var(--info-ink)} .mcell.analise i{background:var(--info)}
.mcell.pendente{background:var(--warn-bg);color:var(--warn-ink)} .mcell.pendente i{background:var(--warn);color:#3a2700}
.mcell.declinou{background:var(--crit-bg);color:var(--crit-ink)} .mcell.declinou i{background:var(--crit)}
.mcell.vazio{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line-2)}

/* alerts */
.alerts{display:grid;gap:8px}
.al{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:11px 13px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13px}
.al .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff}
.al.crit .ic{background:var(--crit)} .al.warn .ic{background:var(--warn);color:#3a2700} .al.info .ic{background:var(--muted)}
.al b{font-weight:700}
.al .meta{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}

/* svg charts */
svg text{font-family:Inter,sans-serif}
.tl{width:100%;height:auto;display:block;min-width:720px}
.tl .lab{font-size:13px;font-weight:700;fill:var(--ink)}
.tl .labs{font-size:11px;fill:var(--muted)}
.tl .tick{font-size:11px;fill:var(--muted)}
.tl .grid{stroke:var(--line);stroke-width:1}
.tl .track{stroke:var(--surface-3);stroke-width:10;stroke-linecap:round}
.tl .fill{stroke:var(--accent);stroke-opacity:.28;stroke-width:10;stroke-linecap:round}
.tl .today{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:4 4}
.tl .todayt{font-size:11px;font-weight:700;fill:var(--ink-2)}
.tl .dot{stroke:var(--surface);stroke-width:2.5}
.tl .start{fill:var(--surface);stroke:var(--ink-2);stroke-width:2}
.tl .stale{stroke:var(--line-2);stroke-width:2;stroke-dasharray:3 4}
.tl .resp{stroke-width:3;stroke-linecap:round}
.tl .end{font-size:11.5px;fill:var(--ink-2);font-weight:600}
.donut text{fill:var(--ink)}

/* studies tab */
.selector{display:flex;gap:8px;flex-wrap:wrap}
.selector button{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:11px;padding:9px 14px;font-weight:700;display:inline-flex;align-items:center;gap:9px}
.selector button.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.selector button .dot{width:8px;height:8px;border-radius:50%}
.selector button.add{border-style:dashed;color:var(--accent-ink)}
.shead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin:22px 0 16px}
.shead h1{font-size:28px;letter-spacing:-.02em}
.shead .sp{flex:1}
.shead .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn2{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 13px;font-weight:600;font-size:13px;display:inline-flex;gap:7px;align-items:center}
.btn2:hover{background:var(--surface-3)}
.btn2.danger{color:var(--crit-ink);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.btn2.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.info-grid>div{background:var(--surface);padding:14px 16px}
.info-grid .wide{grid-column:1/-1}
.info-grid .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:4px}
.info-grid .v{font-weight:600}
.info-grid .v.txt{font-weight:400;color:var(--ink-2);white-space:pre-line}
.funnel{display:grid;gap:10px}
.fr{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center;font-size:13px}
.fr .bw{background:var(--surface-3);border-radius:6px;height:30px;position:relative}
.fr .b{height:100%;border-radius:6px;display:flex;align-items:center;padding:0 10px;color:#fff;font-weight:700;font-size:12.5px;min-width:34px}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.num{text-align:right;font-weight:600}
table.t th.num{text-align:right}
.mut{color:var(--muted)}
.fld{width:100%;border:1px solid var(--line-2);background:var(--surface-2);border-radius:8px;padding:7px 9px;font-size:13px}
.fld:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
textarea.fld{min-height:70px;resize:vertical}
.editing .info-grid>div{background:var(--surface-2)}
.edit-flag{display:inline-flex;align-items:center;gap:6px;background:var(--warn-bg);color:var(--warn-ink);font-weight:700;font-size:12px;border-radius:99px;padding:4px 11px}
.xbtn{background:none;border:0;color:var(--crit-ink);font-weight:700;font-size:16px;padding:2px 8px;border-radius:6px}
.xbtn:hover{background:var(--crit-bg)}

/* history */
.vlist{display:grid;gap:12px}
.vitem{display:grid;grid-template-columns:56px minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.vnum{width:48px;height:48px;border-radius:12px;background:var(--surface-3);display:grid;place-items:center;font:800 16px Manrope,Inter,system-ui,sans-serif;color:var(--ink)}
.vitem.latest .vnum{background:var(--accent);color:#fff}
.vitem .vh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vitem .vh h3{font-size:15px}
.vitem .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.vitem .note{margin-top:8px;color:var(--ink-2)}
.vitem ul{margin:10px 0 0;padding-left:18px;color:var(--ink-2);font-size:13px}
.vitem li{margin:3px 0}
.vitem .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media (max-width:520px){.vitem{grid-template-columns:1fr;gap:10px}.vitem .vnum{width:auto;justify-self:start;padding:4px 12px}}
.evo{display:flex;gap:18px;align-items:flex-end;height:200px;padding:10px 4px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.evo .col{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:46px;height:100%;justify-content:flex-end}
.evo .bars{display:flex;flex-direction:column-reverse;gap:2px;width:34px}
.evo .bars div{border-radius:3px}
.evo .bars div:last-child{border-radius:5px 5px 3px 3px}
.evo .lb{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.evo .tt{font-size:12px;font-weight:700}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,14,22,.55);display:grid;place-items:center;z-index:100;padding:16px}
.modal-card{background:var(--surface);color:var(--ink);border-radius:16px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal-card h2{font-size:20px;margin-bottom:6px}
.modal-card .cap{color:var(--muted);font-size:13px;margin-bottom:16px}
.modal-card label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.04em}
.modal-card .changes{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;max-height:220px;overflow:auto;font-size:13px}
.modal-card .changes li{margin:3px 0}
.modal-card .row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.check{display:flex!important;gap:8px;align-items:center;text-transform:none!important;letter-spacing:0!important;font-weight:500!important;font-size:13px!important;color:var(--ink)!important}

.tip{position:fixed;pointer-events:none;background:#0f1720;color:#fff;border-radius:9px;padding:8px 11px;font-size:12.5px;max-width:320px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .08s;line-height:1.45}
.tip.on{opacity:1}
#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:8px;z-index:150}
.toast{background:#0f1720;color:#fff;border-radius:11px;padding:12px 16px;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:13px}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();}
function normStatus(s){var n=norm(s); if(!n) return 'pendente';

function parseMoney(s){var m=String(s||'').match(/R\$\s*([\d.]+(?:,\d{1,2})?)/); return m?Number(m[1].replace(/\./g,'').replace(',','.')):null;}
function brl(v){return v==null||isNaN(v)?'':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function pad(n){return (n<10?'0':'')+n;}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function nowLocal(){var d=new Date();return todayISO()+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function br(iso){if(!iso) return 's/ data'; var p=iso.slice(0,10).split('-'); return p[2]+'/'+p[1]+'/'+p[0];}
function brShort(iso){var p=iso.split('-'); return p[2]+'/'+p[1];}
function brTs(ts){return br(ts)+' às '+ts.slice(11,16);}
function utc(iso){var p=iso.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2]);}
function days(a,b){return Math.round((utc(b)-utc(a))/864e5);}
function vencimentoHtml(iso){
  if(!iso) return '<span class="mut">s/ validade</span>';

  return '<span class="mut">'+d+' d</span>';
}

function labOrder(d){var o=[];d.studies.forEach(function(s){s.labs.forEach(function(l){if(o.indexOf(l.lab)<0)o.push(l.lab);});});return o;}

/* ===================== métricas ===================== */
function metrics(s,ref){
  var c={proposta:0,analise:0,pendente:0,declinou:0};
  s.labs.forEach(function(l){c[l.status]=(c[l.status]||0)+1;});
  var total=s.labs.length, ativos=c.analise+c.pendente+c.proposta;
  var ds=s.labs.map(function(l){return l.data;}).filter(Boolean).sort();
  var last=ds.length?ds[ds.length-1]:null;
  var dias=s.solicitacao?days(s.solicitacao,ref):null;
  var vals=s.labs.filter(function(l){return l.valor!=null;}).map(function(l){return l.valor;});
  var best=vals.length?Math.min.apply(null,vals):null;
  var h;
  if(c.proposta>0) h={k:'good',label:'Com proposta'};
  else if(total && c.analise+c.pendente===0) h={k:'crit',label:'Sem laboratório ativo'};
  else if((total && c.declinou/total>=0.6) || (dias!=null && dias>30)) h={k:'warn',label:'Atenção'};
  else h={k:'info',label:'Em andamento'};
  return {c:c,total:total,ativos:ativos,last:last,dias:dias,semMov:last?days(last,ref):null,vals:vals,best:best,health:h};
}
function overall(d,ref){
  var c={proposta:0,analise:0,pendente:0,declinou:0},total=0;
  var ms=d.studies.map(function(s){return {s:s,m:metrics(s,ref)};});
  ms.forEach(function(x){KEYS.forEach(function(k){c[k]+=x.m.c[k];});total+=x.m.total;});
  var vals=[];d.studies.forEach(function(s){s.labs.forEach(function(l){if(l.valor!=null)vals.push(l.valor);});});
  var open=ms.filter(function(x){return x.m.dias!=null;});
  var avg=open.length?Math.round(open.reduce(function(a,x){return a+x.m.dias;},0)/open.length):null;
  var oldest=open.slice().sort(function(a,b){return b.m.dias-a.m.dias;})[0];
  return {c:c,total:total,labs:labOrder(d),vals:vals,avg:avg,oldest:oldest,ms:ms};
}
function alertsOf(d,ref){
  var out=[];
  d.studies.forEach(function(s){
    var m=metrics(s,ref);
    if(m.health.k==='crit') out.push({lvl:'crit',study:s.nome,text:'Nenhum laboratório ativo: todos os '+m.total+' cotados declinaram. Necessário ampliar a cotação.'});
    if(m.c.proposta===0 && m.dias!=null && m.dias>30) out.push({lvl:'warn',study:s.nome,text:m.dias+' dias desde a solicitação sem nenhuma proposta recebida.'});
    if(m.total && m.c.declinou/m.total>=0.5 && m.health.k!=='crit') out.push({lvl:'warn',study:s.nome,text:m.c.declinou+' de '+m.total+' laboratórios declinaram ('+Math.round(m.c.declinou/m.total*100)+'%). Base de cotação reduzida a '+plural(m.ativos,'laboratório ativo','laboratórios ativos')+'.'});
    s.labs.forEach(function(l){
      if(l.status==='pendente') out.push({lvl:'warn',study:s.nome,text:l.lab+': retorno pendente'+(l.data?' desde '+br(l.data):' e sem data de atualização')+'.'});
      else if(!l.data && l.status!=='declinou') out.push({lvl:'info',study:s.nome,text:l.lab+': sem data de última atualização registrada.'});
      if(l.data && s.solicitacao && l.data<s.solicitacao) out.push({lvl:'info',study:s.nome,text:l.lab+': última atualização ('+br(l.data)+') anterior à solicitação ('+br(s.solicitacao)+'). Conferir a data na planilha.'});
      if(l.data && (l.status==='analise'||l.status==='pendente')){var dd=days(l.data,ref); if(dd>=14) out.push({lvl:'warn',study:s.nome,text:l.lab+': em análise sem nova atualização há '+dd+' dias.'});}
    });
  });
  var o={crit:0,warn:1,info:2};
  return out.sort(function(a,b){return o[a.lvl]-o[b.lvl];});
}

/* ===================== diff ===================== */
function diff(a,b){
  var ch=[], am={}, bm={};
  a.studies.forEach(function(s){am[norm(s.nome)]=s;});
  b.studies.forEach(function(s){bm[norm(s.nome)]=s;});
  b.studies.forEach(function(s){ if(!am[norm(s.nome)]) ch.push('Estudo incluído: '+s.nome+' ('+plural(s.labs.length,'laboratório','laboratórios')+')'); });
  a.studies.forEach(function(s){ if(!bm[norm(s.nome)]) ch.push('Estudo removido: '+s.nome); });
  b.studies.forEach(function(s){
    var o=am[norm(s.nome)]; if(!o) return;
    FIELDS.forEach(function(f){var k=f[0]; var x=o[k]||'', y=s[k]||''; if(String(x).trim()!==String(y).trim()){
      if(k==='solicitacao') ch.push(s.nome+' · data de solicitação alterada de '+br(x||null)+' para '+br(y||null));
      else ch.push(s.nome+' · campo "'+f[1]+'" atualizado');}});
    var ol={}, nl={};
    o.labs.forEach(function(l){ol[norm(l.lab)]=l;}); s.labs.forEach(function(l){nl[norm(l.lab)]=l;});
    s.labs.forEach(function(l){
      var p=ol[norm(l.lab)];
      if(!p){ch.push(s.nome+' · '+l.lab+' incluído ('+ST[l.status].label+')');return;}
      if(p.status!==l.status) ch.push(s.nome+' · '+l.lab+': situação alterada de "'+ST[p.status].label+'" para "'+ST[l.status].label+'"');
      if((p.data||'')!==(l.data||'')) ch.push(s.nome+' · '+l.lab+': última atualização alterada de '+br(p.data)+' para '+br(l.data));
      if((p.obs||'').trim()!==(l.obs||'').trim()) ch.push(s.nome+' · '+l.lab+': observação '+(l.obs?'atualizada para "'+l.obs.trim()+'"':'removida'));
      if((p.validade||'')!==(l.validade||'')) ch.push(s.nome+' · '+l.lab+': validade da proposta '+(l.validade?'registrada para '+br(l.validade):'removida'));
      if((p.valor==null?null:+p.valor)!==(l.valor==null?null:+l.valor)) ch.push(s.nome+' · '+l.lab+': valor da proposta '+(l.valor!=null?'registrado em '+brl(l.valor):'removido'));
    });
    o.labs.forEach(function(l){ if(!nl[norm(l.lab)]) ch.push(s.nome+' · '+l.lab+' removido'); });
  });
  var ma=a.medicamentos||[], mb=b.medicamentos||[], mam={}, mbm={};
  ma.forEach(function(m){mam[m.id]=m;}); mb.forEach(function(m){mbm[m.id]=m;});
  mb.forEach(function(m){
    var nm=m.nome||'(sem nome)', o=mam[m.id];

/* ===================== leitura da planilha ===================== */
function cellDate(v){
  if(v==null||v==='') return null;
  if(typeof v==='number' && window.XLSX){var p=XLSX.SSF.parse_date_code(v); if(p) return p.y+'-'+pad(p.m)+'-'+pad(p.d);}
  if(v instanceof Date) return v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate());
  var m=String(v).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  m=String(v).match(/(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  return null;
}
function parseRows(rows){
  var S=function(v){return v==null?'':String(v).trim();};
  var hdr=-1;
  for(var i=0;i<rows.length;i++){ if(norm(rows[i][0]).indexOf('estudo')===0 && norm(rows[i][1]).indexOf('apresenta')===0){hdr=i;break;} }
  if(hdr<0) throw new Error('Não encontrei o cabeçalho "Estudos | Apresentações | Classe ..." na planilha.');
  var head=S(rows[0]&&rows[0][0]).split('\n'), meta={titulo:head[0]?head[0].trim():'Non Retail BSB', objetivo:head.slice(1).join(' ').trim()};
  var studies=[];
  for(i=hdr+1;i<rows.length;i++){
    var r=rows[i], a=S(r[0]); if(!a) break; if(norm(a).indexOf('estudos no portfolio')===0||norm(a).indexOf('laboratorios cotados')===0) break;
    studies.push({id:uid(),nome:a.toUpperCase(),apresentacoes:S(r[1]),classe:S(r[2]),indicacao:S(r[3]),referencia:S(r[4]),companhia:S(r[5]),solicitacao:null,labs:[]});
  }
  var byName={}; studies.forEach(function(s){byName[norm(s.nome)]=s;});
  for(i=0;i<rows.length;i++){
    var s=byName[norm(rows[i][0])];
    if(!s || norm(rows[i][1]).indexOf('solicita')<0) continue;
    s.solicitacao=cellDate(rows[i][1]);
    var j=i+1; while(j<rows.length && norm(rows[j][0]).indexOf('laborat')!==0) j++;
    if(j>=rows.length) continue;
    var h=rows[j].map(norm), cD=1,cS=2,cO=3,cV=-1,cX=-1;
    h.forEach(function(x,k){ if(/ultima|atualiza/.test(x))cD=k; else if(/situa|status/.test(x))cS=k; else if(/observa/.test(x))cO=k; else if(/validade/.test(x))cX=k; else if(/valor|orcamento/.test(x))cV=k; });
    for(j=j+1;j<rows.length;j++){
      var rr=rows[j], la=S(rr[0]); if(!la || byName[norm(la)]) break;
      var obs=S(rr[cO]); var val=cV>=0&&rr[cV]!=null&&rr[cV]!==''?(typeof rr[cV]==='number'?rr[cV]:parseMoney('R$ '+rr[cV])):parseMoney(obs);
      s.labs.push({lab:la.replace(/^\d+\s*[.)-]\s*/,''),data:cellDate(rr[cD]),status:normStatus(rr[cS]),obs:obs,valor:val,validade:cX>=0?cellDate(rr[cX]):null});
    }
  }
  if(!studies.length) throw new Error('Nenhum estudo encontrado abaixo do cabeçalho.');
  return {meta:meta,studies:studies};
}
function importFile(file){
  if(!window.XLSX){toast('A biblioteca de leitura de planilhas não carregou. Verifique a conexão com a internet.','err');return;}
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(fr.result),{type:'array'}), parsed=null, err=null, nLabs=-1;
      /* escolhe a aba com mais laboratórios cotados (a aba "Geral" só tem o resumo, sem laboratórios) */
      wb.SheetNames.forEach(function(n){ try{ var pr=parseRows(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null})); var k=pr.studies.reduce(function(a,s){return a+s.labs.length;},0); if(k>nLabs){nLabs=k; parsed=pr;} }catch(e){ err=err||e; } });
      if(!parsed) throw err||new Error('Planilha sem dados reconhecíveis.');
      if(nLabs===0) throw new Error('Nenhuma aba com laboratórios cotados. Confira se a planilha tem os blocos "Laboratórios / Situação".');
      if(!state) throw new Error('Os dados do painel ainda não carregaram. Recarregue a página e tente de novo.');
      var old={}; state.studies.forEach(function(s){old[norm(s.nome)]=s.id;});
      parsed.studies.forEach(function(s){ if(old[norm(s.nome)]) s.id=old[norm(s.nome)]; });
      parsed.medicamentos=(state.medicamentos||[]); parsed.prospeccao=(state.prospeccao||[]); state=parsed; pendingOrigin='Planilha importada ('+file.name+')';
      markDirty(); view.version=null; render(); openSave();
    }catch(e){ toast('Não foi possível ler a planilha: '+e.message,'err'); }
  };
  fr.readAsArrayBuffer(file);
}

/* prazo do orçamento: quanto falta para vencer */
function prazoOrc(iso){
  if(!iso) return '<span class="mut">sem data</span>';
  var d=days(todayISO(),iso);
  if(d<0) return '<span class="st declinou" data-tip="O orçamento passou da validade. Peça um novo ao fornecedor."><i>!</i>Vencido há '+plural(-d,'dia','dias')+'</span>';
  if(d===0) return '<span class="st declinou"><i>!</i>Vence hoje</span>';
  if(d<=7) return '<span class="st declinou"><i>!</i>Vence em '+plural(d,'dia','dias')+'</span>';
  if(d<=15) return '<span class="st pendente"><i>!</i>Vence em '+d+' dias</span>';
  return '<span class="st proposta"><i>✓</i>Válido · '+d+' dias</span>';
}
function resumoOrc(rows){
  var venc=0, logo=0; rows.forEach(function(r){ if(!r.validadeOrc) return; var d=days(todayISO(),r.validadeOrc); if(d<0) venc++; else if(d<=15) logo++; });
  return (venc?'<span class="st declinou"><i>!</i>'+plural(venc,'orçamento vencido','orçamentos vencidos')+'</span>':'')+(logo?'<span class="st pendente"><i>!</i>'+plural(logo,'orçamento vencendo','orçamentos vencendo')+'</span>':'');
}
var SIT_PROSP={aguardando:'Sem retorno',retornou:'Retornou',nao_atende:'Não atende à demanda'};
function prodCotados(d,nome){
  var n=norm(nome||''); if(!n) return 0;
  return (d.medicamentos||[]).filter(function(m){ return (m.linhas||[]).some(function(r){ return norm(r.fornecedor||'')===n && r.preco!=null; }); }).length;
}
/* Lista da prospecção = fornecedores das Cotações (automático) + os incluídos à mão.
   Preço em alguma cotação => "Retornou" sozinho. "Não atende" marcado à mão sempre vale. */
function prospLista(d){

var draftOffer=false;
function markDirty(){dirty=true; lsSet(KEY+':draft',JSON.stringify({base:store.history.length,state:state,origin:pendingOrigin}));}
function curStudy(){ if(!state) return undefined; return state.studies.filter(function(s){return s.id===view.study;})[0];}
function curMed(){ if(!state) return undefined; return (state.medicamentos||[]).filter(function(m){return m.id===view.med;})[0];}
function aplicaCampo(el){
  var b=el.dataset&&el.dataset.b; if(!b||!canEdit()) return false;
  var p=b.split(':'), v=el.value;
  if(p[0]==='m'){ var mm=(state.medicamentos||[])[+p[1]]; if(!mm) return false; mm.nome=v; return true; }
  if(p[0]==='qa'){ var nq=decodeURIComponent(p[1]); state.prospeccao=state.prospeccao||[];
    var rq=state.prospeccao.filter(function(r){return norm(r.fornecedor||'')===norm(nq);})[0];
    if(!rq){ rq={id:uid(),fornecedor:nq,contato:'',data:'',situacao:'',obs:''}; state.prospeccao.push(rq); }
    rq[p[2]]=v; return true; }
  if(p[0]==='q'){ var pq=(state.prospeccao||[])[+p[1]]; if(!pq) return false; pq[p[2]]=v; return true; }
  if(p[0]==='r'){ var mr=(state.medicamentos||[])[+p[1]]; var rr=mr&&(mr.linhas||[])[+p[2]]; if(!rr) return false;
    if(p[3]==='preco') rr.preco=v===''?null:Math.round(parseFloat(v)*100)/100; else rr[p[3]]=v; return true; }
  var s=curStudy(); if(!s) return false;
  if(p[0]==='s'){ s[p[1]] = p[1]==='nome'?v.trim().toUpperCase():(p[1]==='solicitacao'?(v||null):v); }
  else { var l=s.labs[+p[1]]; var f=p[2];
    if(f==='valor') l.valor=v===''?null:Math.round(parseFloat(v)*100)/100;
    else if(f==='data') l.data=v||null;
    else if(f==='validade') l.validade=v||null;
    else if(f==='obs'){ l.obs=v; if(l.valor==null){var mv=parseMoney(v); if(mv!=null) l.valor=mv;} }
    else l[f]=v; }
  return true;
}
/* digitando: guarda na hora (sem redesenhar, para não perder o cursor) */

        if(l.status==='analise'||l.status==='pendente'){doc.setDrawColor(200,204,210); doc.setLineWidth(0.4); doc.setLineDashPattern([0.8,1],0); doc.line(X(l.data),cy,X(ref),cy); doc.setLineDashPattern([],0);} }
      else if(s.solicitacao){doc.setDrawColor(200,204,210); doc.setLineWidth(0.4); doc.setLineDashPattern([0.8,1],0); doc.line(X(s.solicitacao),cy,X(ref),cy); doc.setLineDashPattern([],0);}

      if(l.data){doc.setFillColor.apply(doc,rgb(ST[l.status].hex)); doc.setDrawColor(255,255,255); doc.setLineWidth(0.5); doc.circle(X(l.data),cy,1.6,'FD');}
      doc.setFont('helvetica','normal'); doc.setFontSize(6.8); doc.setTextColor(75,85,99); doc.text(l.data?days(l.data,ref)+' d':'s/ data',Wd-M,cy+1,{align:'right'});
      doc.setLineWidth(0.2);
    });
    doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(132,139,150);
    doc.text('Círculo vazado: data da solicitação. Traço colorido: tempo até a última atualização. Pontilhado: tempo sem nova atualização.',M,y+h+3);
  });

  if(!opt.studyId){
    doc.addPage(); header('Histórico de versões','Registro das atualizações até a versão '+entry.v);
    doc.autoTable({startY:31,margin:{left:M,right:M},theme:'striped',
      head:[['Versão','Data','Responsável','Origem','Nota','Alterações']],
      body:hist.slice().reverse().map(function(e){return ['v'+e.v,brTs(e.ts),pdfSafe(e.autor||''),pdfSafe(e.origem||''),pdfSafe(e.nota||''),String((e.changes||[]).length)];}),
      styles:{fontSize:8,cellPadding:2.2},headStyles:{fillColor:navy,textColor:[255,255,255],fontSize:7.4},columnStyles:{0:{cellWidth:16,fontStyle:'bold'},1:{cellWidth:32},2:{cellWidth:36},3:{cellWidth:60},5:{cellWidth:22,halign:'right'}}});
    var yy=doc.lastAutoTable.finalY+8; secT('Alterações registradas nesta versão (v'+entry.v+')',yy);
    doc.autoTable({startY:yy+3,margin:{left:M,right:M},theme:'plain',body:(entry.changes&&entry.changes.length?entry.changes:['Carga inicial dos dados.']).map(function(c,i){return [String(i+1),pdfSafe(c)];}),
      styles:{fontSize:8,cellPadding:1.8,textColor:[40,48,58]},columnStyles:{0:{cellWidth:10,textColor:[132,139,150]}},alternateRowStyles:{fillColor:[248,249,251]}});
  }

  var n=doc.getNumberOfPages();
  for(var p=1;p<=n;p++){ doc.setPage(p); doc.setDrawColor(227,230,235); doc.setLineWidth(0.2); doc.line(M,200,Wd-M,200);
    doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(132,139,150);
    doc.text(pdfSafe(titulo)+' · Documento somente leitura · Versão '+entry.v+' de '+brTs(entry.ts),M,204);
    doc.text('Página '+p+' de '+n,Wd-M,204,{align:'right'}); }
  var name=fileBase()+'_v'+entry.v+'_'+entry.ts.slice(0,10)+(opt.studyId?'_'+studies[0].nome.replace(/[^A-Za-z0-9]+/g,'_'):'')+'.pdf';
  doc.save(name);
  toast('PDF somente leitura gerado: '+name,'ok');
  setTimeout(resolve,300);
  });
}

/* Exportação geral isolada: não modifica o PDF individual nem os dados salvos. */
function makeGeneralPDF(entry){
  return Promise.resolve().then(function(){
    if(!window.jspdf||!window.jspdf.jsPDF){
      throw new Error('A biblioteca de PDF não carregou. Verifique a conexão e recarregue.');
    }
    if(!entry||!entry.snapshot){
      throw new Error('Esta versão não possui um snapshot para exportar.');
    }

    function list(v){return Array.isArray(v)?v.filter(function(x){return x&&typeof x==='object';}):[];}
    function present(v){
      return v!==null&&v!==undefined&&
        (typeof v!=='string'||v.trim()!=='');
    }
    function number(v){
      if(!present(v)||(typeof v!=='number'&&typeof v!=='string')) return false;
      return Number.isFinite(Number(typeof v==='string'?v.trim():v));
    }
    function money(v){return number(v)?brl(Number(v)):'Não informado';}
    function savedChange(v){
      if(v!==null&&typeof v==='object') return JSON.stringify(v,null,2);
      return v==null?'':String(v);
    }

    /* Helvetica preserva português e caracteres WinAnsi. Outros símbolos recebem
       uma descrição ou seu código Unicode, sem descarte silencioso de conteúdo. */
    function text(v){
      var replacements={
        '\u00a0':' ','\u202f':' ','\u2007':' ',
        '\u2010':'-','\u2011':'-','\u2012':'-','\u2013':'-','\u2014':'-',
        '\u2018':"'",'\u2019':"'",'\u201a':"'",'\u201c':'"','\u201d':'"','\u201e':'"',
        '\u2026':'...','\u2022':' * ','\u2192':' -> ','\u2190':' <- ',
        '\u2194':' <-> ','\u00d7':' x ','\u2212':'-','\u2264':'<=','\u2265':'>=',
        '\u2260':'!=','\u2713':'[sim]','\u2714':'[sim]',
        '\u2715':'[x]','\u2716':'[x]','\u2717':'[x]',
        '\u2122':'(TM)','\u00ae':'(R)','\u00a9':'(C)'
      };
      return Array.from(String(v==null?'':v).normalize('NFC')
        .replace(/\r\n?/g,'\n').replace(/\t/g,'    ')).map(function(c){
        if(Object.prototype.hasOwnProperty.call(replacements,c)) return replacements[c];
        var cp=c.codePointAt(0);
        if(c==='\n'||(cp>=32&&cp<=126)||(cp>=160&&cp<=255)||c==='€') return c;
        return '[U+'+cp.toString(16).toUpperCase().padStart(4,'0')+']';
      }).join('');
    }
    function value(v){return present(v)?String(v):'Não informado';}
    function iso(v){
      var m=String(v==null?'':v).match(/^(\d{4})-(\d{2})-(\d{2})(?:$|T)/);
      if(!m) return null;
      var d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));
      return d.getUTCFullYear()===+m[1]&&d.getUTCMonth()===+m[2]-1&&
        d.getUTCDate()===+m[3]?m[1]+'-'+m[2]+'-'+m[3]:null;
    }
    function date(v){
      var d=iso(v);
      return d?br(d):present(v)?String(v)+' (data não reconhecida)':'Sem data';
    }
    function stamp(v){
      var d=iso(v), t=String(v==null?'':v).match(/T(\d{2}:\d{2})/);
      return d?br(d)+(t?' às '+t[1]:''):value(v);
    }
    function elapsed(v,reference){
      var d=iso(v);
      return d?days(d,reference)+' dias':'Sem data';
    }
    function budgetDeadline(v,reference){
      var d=iso(v);
      if(!d) return present(v)?'Data não reconhecida':'Sem data';
      var n=days(reference,d);
      if(n<0) return 'Vencido há '+plural(-n,'dia','dias');
      if(n===0) return 'Vence hoje';
      if(n<=15) return 'Vence em '+plural(n,'dia','dias');
      return 'Válido · '+plural(n,'dia','dias');
    }
    function proposalDeadline(v,reference){
      var d=iso(v);
      if(!d) return present(v)?'Data não reconhecida':'Sem validade';
      var n=days(reference,d);
      if(n<0) return 'Vencida há '+plural(-n,'dia','dias');
      return n<=30?'Vence em '+plural(n,'dia','dias'):plural(n,'dia','dias');
    }
    function budgetSummary(rows,reference){
      var expired=0,soon=0;
      rows.forEach(function(r){
        var d=iso(r.validadeOrc);
        if(!d) return;
        var n=days(reference,d);
        if(n<0) expired++;
        else if(n<=15) soon++;
      });
      return [
        ['Fornecedores cadastrados',rows.length],
        ['Orçamentos vencidos',expired],
        ['Orçamentos vencendo em até 15 dias',soon]
      ];
    }

    var ref=iso(entry.ts);
    if(!ref) throw new Error('A versão salva não possui uma data de referência válida.');

    /* Cópia exclusiva do snapshot; valores originais permanecem disponíveis
       para impressão, inclusive quando uma data não é reconhecida. */
    var snap=clone(entry.snapshot), rawStudies=list(snap.studies);
    snap.meta=snap.meta&&typeof snap.meta==='object'?snap.meta:{};
    snap.studies=rawStudies.map(function(s){
      s.labs=list(s.labs);
      return s;
    });
    snap.medicamentos=list(snap.medicamentos);
    snap.medicamentos.forEach(function(m){m.linhas=list(m.linhas);});
    snap.prospeccao=list(snap.prospeccao);

    /* Somente a cópia de cálculo recebe datas válidas e valores numéricos.
       As regras existentes de indicadores e prospecção são reaproveitadas. */
    var calc=clone(snap);
    calc.studies.forEach(function(s){
      s.solicitacao=iso(s.solicitacao);
      s.labs.forEach(function(l){
        l.data=iso(l.data);
        l.validade=iso(l.validade);
        l.status=ST[l.status]?l.status:normStatus(l.status);
        l.valor=number(l.valor)?Number(l.valor):null;
      });
    });
    /* Preserva os preços do snapshot para prospLista e prodCotados.
       O critério existente de retorno automático é r.preco!=null.
       A validação numérica fica restrita à apresentação feita por money. */

    var owner=(Math.random().toString(36)+Date.now().toString(36)).slice(2)+
      Math.random().toString(36).slice(2);
    var doc=new window.jspdf.jsPDF({
      orientation:'landscape',unit:'mm',format:'a4',compress:true,
      encryption:{userPassword:'',ownerPassword:owner,userPermissions:['print']}
    });
    if(typeof doc.autoTable!=='function'){
      throw new Error('A biblioteca de tabelas do PDF não carregou. Recarregue a página.');
    }

    var W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
    var M=12,TOP=32,CW=W-2*M,y=TOP;
    var navy=[15,42,68],section='Resumo executivo';
    var title=niceTitle(snap.meta.titulo);

    /* Mantém o conteúdo original do rodapé, inclusive brTs.
       Sua altura é reservada antes de qualquer tabela ser paginada. */
    var footer=text(title+' · Documento somente leitura · Versão '+entry.v+' de '+brTs(entry.ts));
    var footerFontSize=7,footerLineHeight=3.2;
    doc.setFont('helvetica','normal');
    doc.setFontSize(footerFontSize);
    var footerLines=doc.splitTextToSize(footer,CW);
    var BOTTOM=Math.max(25,16+footerLines.length*footerLineHeight);
    if(H-BOTTOM-TOP<25){
      throw new Error('A identificação do documento é extensa demais para manter o rodapé integral e legível em cada página A4.');
    }

    doc.setProperties({
      title:text(title+' - Versão '+entry.v),
      subject:'Relatório somente leitura',
      author:text(entry.autor||''),
      creator:'Painel de Estudos de Equivalência',
      keywords:'estudos de equivalência'
    });

    function nextPage(){
      doc.addPage();
      y=TOP;
    }

    function ensure(height){
      if(y+height>H-BOTTOM) nextPage();
    }
    function start(label){
      section=label;
      ensure(24);
    }
    function status(l){return ST[l.status]?ST[l.status].label:value(l.status);}
    function cell(content,extra){
      var result={content:text(content)};
      Object.keys(extra||{}).forEach(function(k){result[k]=extra[k];});
      return result;
    }
    function tone(content,key){
      return cell(content,{pdfTone:ST[key]?key:null});
    }
    function composition(c,total){
      return cell(KEYS.map(function(k){
        return ST[k].short+': '+c[k]+' ('+pct(c[k],total)+')';
      }).join(' · '),{pdfBar:{counts:c,total:total}});
    }
    function emptyPair(v){return present(v)?String(v):'–';}

    /* Os dados visuais acompanham a própria célula, inclusive em continuações.
       Nenhum índice de linha é usado para associar cores aos registros. */
    function table(label,head,body,widths){
      var columns={};
      (widths||[]).forEach(function(w,i){columns[i]={cellWidth:w};});
      var rows=body.length?body:[[
        cell('Nenhum registro.',{colSpan:head.length})
      ]];
      rows=rows.map(function(row){
        return row.map(function(v){
          if(v&&typeof v==='object'&&Object.prototype.hasOwnProperty.call(v,'content')){
            var c={};
            Object.keys(v).forEach(function(k){c[k]=v[k];});
            c.content=text(v.content);
            return c;
          }
          return cell(v);
        });
      });

      /* O cabeçalho completo reaparece nas continuações.
         Reduz somente sua fonte quando necessário; não corta os nomes. */
      doc.setFont('helvetica','bold');
      var heading=text(label),headingSize=8.2,headingLines;
      function measureHeading(){
        doc.setFontSize(headingSize);
        headingLines=doc.splitTextToSize(heading,CW-5);
        return headingLines.length*headingSize*0.352778*1.15+5;
      }
      var headingHeight=measureHeading();
      var available=H-BOTTOM-TOP;
      while(headingHeight>available-30&&headingSize>6){
        headingSize=Math.max(6,headingSize-0.2);
        headingHeight=measureHeading();
      }
      if(headingHeight>available-30){
        throw new Error('Uma identificação é extensa demais para o cabeçalho repetido. Reduza o nome do estudo, medicamento ou fornecedor antes de exportar.');
      }
      ensure(headingHeight+(head.length?10:0)+12);

      doc.autoTable({
        startY:y,
        margin:{left:M,right:M,top:TOP,bottom:BOTTOM},
        tableWidth:CW,
        theme:'striped',
        pageBreak:'auto',
        rowPageBreak:'auto',
        showHead:'everyPage',
        head:[
          [cell(heading,{colSpan:head.length,
            styles:{fontSize:headingSize,overflow:'linebreak'}})]
        ].concat(head.length?[head.map(text)]:[]),
        body:rows,
        styles:{
          font:'helvetica',fontSize:7.5,cellPadding:1.8,
          overflow:'linebreak',valign:'top',
          textColor:[15,23,32],lineColor:[227,230,235],lineWidth:0.12
        },
        headStyles:{
          fillColor:navy,textColor:[255,255,255],
          fontStyle:'bold',fontSize:7.1
        },
        alternateRowStyles:{fillColor:[248,249,251]},
        columnStyles:columns,
        didParseCell:function(dd){
          if(dd.section!=='body') return;
          var raw=dd.cell.raw||{};
          if(raw.pdfTone&&ST[raw.pdfTone]){
            dd.cell.styles.fillColor=tint(ST[raw.pdfTone].hex,0.15);
            dd.cell.styles.textColor=INK[raw.pdfTone];
            dd.cell.styles.fontStyle='bold';
          }
          if(raw.pdfBar){
            dd.cell.styles.cellPadding={top:1.8,right:1.8,bottom:7,left:1.8};
          }
        },
        didDrawCell:function(dd){
          if(dd.section!=='body') return;
          var raw=dd.cell.raw||{},bar=raw.pdfBar;
          if(!bar||!bar.total||dd.cell.height<8) return;
          var bx=dd.cell.x+1.8,by=dd.cell.y+dd.cell.height-4.7;
          var bw=dd.cell.width-3.6;
          doc.setFillColor(232,236,242);
          doc.rect(bx,by,bw,2.6,'F');
          var offset=0;
          KEYS.forEach(function(k){
            if(!bar.counts[k]) return;
            var width=bar.counts[k]/bar.total*bw;
            doc.setFillColor.apply(doc,rgb(ST[k].hex));
            doc.rect(bx+offset,by,width,2.6,'F');
            offset+=width;
          });
        }
      });
      y=doc.lastAutoTable.finalY+4;
    }
    function note(label,content){
      table(label,['Informação'],[[content]],[CW]);
    }
    function cards(label,items,perRow){
      perRow=perRow||4;
      var rows=[];
      for(var i=0;i<items.length;i+=perRow){
        var row=items.slice(i,i+perRow).map(function(item){
          return cell(item[0].toUpperCase()+'\n'+item[1]+
            (present(item[2])?'\n'+item[2]:''),{
              pdfTone:item[3]||null,
              styles:{fontStyle:'bold',fontSize:8,cellPadding:2.4}
            });
        });
        while(row.length<perRow) row.push('');
        rows.push(row);
      }
      table(label,new Array(perRow).fill(''),rows,
        new Array(perRow).fill(CW/perRow));
    }

    var x=insightStats(calc,ref),o=overall(calc,ref);
    var signals=liveSignals(calc,ref),alerts=alertsOf(calc,ref);
    var priority=!calc.studies.length?'Nenhum estudo cadastrado':
      x.withoutOffer?plural(x.withoutOffer,'estudo sem proposta','estudos sem proposta'):
      'Todos os estudos têm proposta';
    var best=null;
    calc.studies.forEach(function(s){
      s.labs.forEach(function(l){
        if(l.valor!=null&&(!best||l.valor<best.valor)){
          best={valor:l.valor,lab:l.lab,study:s.nome};
        }
      });
    });

    note('Resumo executivo · '+title,
      value(snap.meta.objetivo)+'\n'+priority+'. '+
      (!calc.studies.length?'Adicione estudos para acompanhar o portfólio.':
        x.withoutOffer?'Priorize os estudos sem proposta e os retornos sem atualização.':
        'Acompanhe a validade e a comparação das propostas recebidas.')+
      '\nResponsável: '+value(entry.autor)+
      '\nMenor proposta registrada: '+(best?
        money(best.valor)+' · '+value(best.lab)+' · '+value(best.study):
        'Nenhuma até o momento')+
      '\nTodos os prazos usam '+br(ref)+
      '. Valores de propostas de estudos diferentes não são somados.');

    cards('Indicadores do portfólio',[
      ['Estudos',calc.studies.length,
        x.withOffer+' com proposta · '+x.withoutOffer+' sem proposta'],
      ['Cotações',o.total,o.labs.length+' laboratórios únicos'],
      ['Em acompanhamento',x.active,
        o.c.analise+' em análise · '+o.c.pendente+' pendentes','analise'],
      ['Propostas',o.c.proposta,o.vals.length+' valores registrados','proposta'],
      ['Não atendidas',o.c.declinou,pct(o.c.declinou,o.total),'declinou'],
      ['Idade média',o.avg!=null?o.avg+' dias':'Sem data',
        o.oldest?'Mais antigo: '+value(o.oldest.s.nome)+' · '+o.oldest.m.dias+' dias':'Sem data']
    ],3);
    cards('Qualidade dos dados',[
      ['Sem atualização há 14+ dias',x.over14,'Em análise ou pendentes','pendente'],
      ['Ativos sem data',x.missing,'Sem data de atualização','analise'],
      ['Datas a conferir',x.invalid,'Atualização anterior à solicitação','declinou']
    ],3);
    note('Critério de atualização',
      'A data de atualização não é, necessariamente, a data de resposta do laboratório.');

    table('Distribuição das cotações',
      ['Situação','Quantidade','Percentual'],
      KEYS.map(function(k){
        return [tone(ST[k].label,k),o.c[k],pct(o.c[k],o.total)];
      }),[CW-76,38,38]);
    table('Composição e funil por estudo',
      ['Estudo','Situação / dias desde a solicitação','Cotados / ativos / propostas','Distribuição'],
      o.ms.map(function(z){
        var health={good:'proposta',info:'analise',warn:'pendente',crit:'declinou'};
        return [value(z.s.nome),tone(z.m.health.label+'\n'+
          (z.m.dias!=null?z.m.dias+' dias':'Sem data'),health[z.m.health.k]),
          z.m.total+' / '+z.m.ativos+' / '+z.m.c.proposta,
          composition(z.m.c,z.m.total)];
      }),[54,54,44,CW-152]);

    /* Prioridades e alertas ficam juntos. Apenas repetições textuais exatas
       no mesmo estudo são unificadas; textos e orientações distintos ficam. */
    start('Prioridades e pontos de atenção');
    var attention=[],attentionByKey=Object.create(null);
    function addAttention(study,detail,level,key){
      var identity=String(study)+'\u0000'+String(detail);
      if(attentionByKey[identity]){
        var existing=attentionByKey[identity];
        if(existing.level.indexOf(level)<0) existing.level+=' / '+level;
        return;
      }
      var row={study:study,detail:detail,level:level,key:key};
      attentionByKey[identity]=row;
      attention.push(row);
    }
    signals.forEach(function(a,i){
      addAttention(value(a.study),value(a.lab)+'\n'+a.title+'\n'+a.detail,
        (i+1)+'. '+(a.severity==='urgent'?'Prioritário':'Revisar'),
        a.severity==='urgent'?'declinou':'pendente');
    });
    alerts.forEach(function(a){
      addAttention(value(a.study),a.text,
        a.lvl==='crit'?'Crítico':a.lvl==='warn'?'Atenção':'Conferir',
        a.lvl==='crit'?'declinou':a.lvl==='warn'?'pendente':'analise');
    });
    table(section,['Prioridade / nível','Estudo','Sinal, alerta e orientação'],
      attention.map(function(a){
        return [tone(a.level,a.key),a.study,a.detail];
      }),[34,55,CW-89]);

    /* A matriz resume as participações. Valores, datas e intervalos ficam
       no detalhamento, evitando reproduzir os mesmos registros três vezes. */
    start('Matriz estudo × laboratório');
    if(!o.labs.length){
      note(section,'Nenhum laboratório cadastrado.');
    }else{
      for(var labOffset=0;labOffset<o.labs.length;labOffset+=5){
        var matrixLabs=o.labs.slice(labOffset,labOffset+5);
        table('Matriz estudo × laboratório · '+matrixLabs.map(value).join(' · '),
          ['Estudo'].concat(matrixLabs.map(value)),
          calc.studies.map(function(s){
            return [value(s.nome)].concat(matrixLabs.map(function(name){
              var matches=s.labs.filter(function(l){return l.lab===name;});
              if(!matches.length) return 'Não cotado';
              var key=matches.every(function(l){
                return l.status===matches[0].status;
              })?matches[0].status:null;
              return tone(matches.map(status).join('\n'),key);
            }));
          }),[58].concat(matrixLabs.map(function(){return (CW-58)/matrixLabs.length;})));
      }
    }

    calc.studies.forEach(function(s,i){
      var original=snap.studies[i],m=metrics(s,ref);
      var identity='Estudo · '+value(s.nome);
      start(identity);
      table(identity+' · Ficha técnica',
        ['Apresentações / classe','Referência / companhia','Solicitação / movimentação'],
        [[value(original.apresentacoes)+'\n'+value(original.classe),
          value(original.referencia)+'\n'+value(original.companhia),
          'Solicitação: '+date(original.solicitacao)+
          '\nEm aberto: '+(m.dias!=null?m.dias+' dias':'Sem data')+
          '\nÚltima movimentação: '+date(m.last)+
          '\nSem movimentação: '+(m.semMov!=null?m.semMov+' dias':'Sem data')],
         [cell('Para que serve\n'+value(original.indicacao),{colSpan:3})]],
        [CW/3,CW/3,CW/3]);
      cards(identity+' · Indicadores',[
        ['Situação geral',m.health.label,''],
        ['Cotados / ativos',m.total+' / '+m.ativos,''],
        ['Análise / pendentes',m.c.analise+' / '+m.c.pendente,'','analise'],
        ['Propostas',m.c.proposta,'Menor: '+money(m.best),'proposta'],
        ['Declinaram',m.c.declinou,pct(m.c.declinou,m.total),'declinou']
      ],5);

      table(identity+' · Laboratórios e linha do tempo',
        ['Laboratório / situação','Atualização / intervalos','Proposta / validade','Observação'],
        s.labs.map(function(l,j){
          var raw=original.labs[j];
          return [
            tone(value(raw.lab)+'\n'+status(l),l.status),
            date(raw.data)+
              '\nSem atualização: '+elapsed(l.data,ref)+
              '\nSolicitação até atualização: '+
              (s.solicitacao&&l.data?days(s.solicitacao,l.data)+' dias':'Sem data')+
              (l.data&&s.solicitacao&&l.data<s.solicitacao?
                '\nConferir: atualização anterior à solicitação.':''),
            money(raw.valor)+'\nValidade: '+date(raw.validade)+
              '\n'+proposalDeadline(raw.validade,ref),
            value(raw.obs)
          ];
        }),[43,65,57,CW-165]);

      var proposals=s.labs.filter(function(l){return l.valor!=null;})
        .sort(function(a,b){return a.valor-b.valor;});
      var maxProposal=proposals.length?
        Math.max.apply(null,proposals.map(function(l){return Math.abs(l.valor);})):0;
      table(identity+' · Comparativo de propostas',
        ['Posição','Laboratório','Valor','Comparação'],
        proposals.map(function(l,j){
          return [j+1,value(l.lab),tone(money(l.valor),'proposta'),
            cell((l.valor===m.best?'Menor valor registrado\n':'')+
              (maxProposal?Math.round(Math.abs(l.valor)/maxProposal*100)+'% do maior valor':'Todos os valores são zero'),
              {pdfBar:{counts:{proposta:Math.abs(l.valor),analise:0,pendente:0,declinou:0},
                total:maxProposal||1}})];
        }),[18,62,48,CW-128]);
    });

    start('Panorama por laboratório');
    var labRows=o.labs.map(function(name){
      var c={proposta:0,analise:0,pendente:0,declinou:0};
      var n=0,last=null,intervals=[];
      calc.studies.forEach(function(s){
        s.labs.forEach(function(l){
          if(l.lab!==name) return;
          n++;c[l.status]++;
          if(l.data&&(!last||l.data>last)) last=l.data;
          if(l.data&&s.solicitacao&&l.data>=s.solicitacao){
            intervals.push(days(s.solicitacao,l.data));
          }
        });
      });
      return [value(name),n,composition(c,n),
        c.proposta+' / '+(c.analise+c.pendente)+' / '+c.declinou,
        pct(c.declinou,n),
        intervals.length?Math.round(intervals.reduce(function(a,b){
          return a+b;
        },0)/intervals.length)+' dias':'Sem dado',
        date(last)];
    });
    table(section,
      ['Laboratório','Registros','Composição','Propostas / abertos / declínios','Taxa de declínio','Média até atualização','Última atualização'],
      labRows,[36,20,70,42,30,36,CW-234]);
    note('Panorama por laboratório · Critérios',
      'A média considera dias entre a solicitação e a última atualização registrada, somente quando a atualização não é anterior à solicitação. Não representa tempo de resposta. As participações por estudo, incluindo “Não cotado”, estão na matriz estudo × laboratório.');

    start('Medicamentos · Cotações');
    if(!snap.medicamentos.length){
      note(section,'Nenhum medicamento de referência cadastrado.');
    }
    snap.medicamentos.forEach(function(md){
      var medication='Medicamento · '+value(md.nome);
      start(medication);
      cards(medication+' · Resumo',budgetSummary(md.linhas,ref).map(function(r){
        return [r[0],r[1],''];
      }),3);
      if(!md.linhas.length){
        note(medication,'Nenhum fornecedor cadastrado para este medicamento.');
      }
      md.linhas.forEach(function(r){
        var identity=medication+' · Fornecedor · '+value(r.fornecedor);
        table(identity,
          ['Preço / orçamento','Lote 1 / validade 1','Lote 2 / validade 2','Lote 3 / validade 3'],
          [[money(r.preco)+'\nValidade do orçamento: '+date(r.validadeOrc)+
              '\nPrazo: '+budgetDeadline(r.validadeOrc,ref),
            emptyPair(r.lote)+'\n'+emptyPair(r.validade),
            emptyPair(r.lote2)+'\n'+emptyPair(r.validade2),
            emptyPair(r.lote3)+'\n'+emptyPair(r.validade3)],
           [cell('Observação\n'+value(r.obs),{colSpan:4})]],
          [CW*0.4,CW*0.2,CW*0.2,CW*0.2]);
      });
    });

    start('Medicamentos · Prospecção de fornecedores');
    var prospects=prospLista(calc);
    var counts={total:0,retornou:0,nao_atende:0,aguardando:0};
    prospects.forEach(function(e){
      if(!e.nome) return;
      counts.total++;
      if(Object.prototype.hasOwnProperty.call(counts,e.sit)) counts[e.sit]++;
    });
    cards(section+' · Indicadores',[
      ['Fornecedores contatados',counts.total,''],
      ['Com retorno',counts.retornou,'Pelo menos um produto','proposta'],
      ['Não atendem',counts.nao_atende,'','declinou'],
      ['Sem retorno',counts.aguardando,'','pendente']
    ],4);
    note('Prospecção · Regra de leitura',
      'Fornecedores das Cotações entram automaticamente. Preço diferente de null ou campo ausente conta como retorno pela regra existente; zero é válido. A marcação manual "Não atende" prevalece.');
    table(section,
      ['Fornecedor / origem','Contato / data','Situação','Medicamentos com preço','Observação'],
      prospects.map(function(e){
        var manual=e.man||{};
        return [value(e.nome)+'\n'+(e.cot?'Nas cotações':'Inclusão manual'),
          value(manual.contato)+'\n'+date(manual.data),
          tone(SIT_PROSP[e.sit]||value(e.sit),
            e.sit==='nao_atende'?'declinou':e.sit==='retornou'?'proposta':'pendente'),
          e.pc,value(manual.obs)];
      }),[53,53,42,29,CW-177]);

    start('Histórico de versões');
    var history=Array.isArray(store.history)?store.history:[],index=history.indexOf(entry);
    if(index<0){
      index=history.findIndex(function(e){return e&&e.v===entry.v&&e.ts===entry.ts;});
    }
    var hist=(index>=0?history.slice(0,index+1):history.filter(function(e){
      return e&&Number.isFinite(Number(e.v))&&Number(e.v)<=Number(entry.v);
    })).filter(function(e){return e&&typeof e==='object';});
    if(!hist.some(function(e){return e.v===entry.v&&e.ts===entry.ts;})) hist.push(entry);

    /* A evolução usa somente os snapshots salvos, sem recalcular alterações. */
    table('Histórico · Evolução das cotações',
      ['Versão / data','Total','Distribuição registrada'],
      hist.map(function(e){
        var counts={proposta:0,analise:0,pendente:0,declinou:0},total=0;
        list(e.snapshot&&e.snapshot.studies).forEach(function(s){
          list(s.labs).forEach(function(l){
            var key=ST[l.status]?l.status:normStatus(l.status);
            counts[key]++;total++;
          });
        });
        return ['v'+value(e.v)+'\n'+stamp(e.ts),total,composition(counts,total)];
      }),[50,22,CW-72]);

    hist.forEach(function(e){
      var changes=Array.isArray(e.changes)?e.changes:
        present(e.changes)?[e.changes]:[];
      start('Histórico · Versão '+value(e.v));
      var rows=[
        [cell(stamp(e.ts)+' · Responsável: '+value(e.autor)+
          '\nOrigem: '+value(e.origem)+
          '\nNota: '+value(e.nota)+
          '\nAlterações salvas: '+changes.length,{colSpan:2})]
      ];
      if(changes.length){
        changes.forEach(function(c,j){rows.push([j+1,savedChange(c)]);});
      }else{
        rows.push(['','Nenhuma alteração registrada em e.changes.']);
      }
      table(section,['Item','Registro salvo'],rows,[16,CW-16]);
    });

    /* Desenha os elementos fixos somente depois de todas as tabelas.
       O rodapé integral ocupa a margem previamente reservada. */
    var total=doc.getNumberOfPages();
    for(var p=1;p<=total;p++){
      doc.setPage(p);
      doc.setFillColor.apply(doc,navy);
      doc.rect(0,0,W,24,'F');
      doc.setFillColor(42,120,214);
      doc.rect(0,24,W,1.2,'F');
      doc.setFont('helvetica','bold');
      doc.setFontSize(12);
      doc.setTextColor(255,255,255);
      doc.text('Non Retail BSB · Relatório geral',M,10);
      doc.setFont('helvetica','normal');
      doc.setFontSize(8);
      doc.text(text('Versão '+entry.v+' · '+stamp(entry.ts)+' · Referência: '+br(ref)),M,17);
      doc.setDrawColor(227,230,235);
      doc.setLineWidth(0.2);
      doc.line(M,H-BOTTOM+3,W-M,H-BOTTOM+3);
      doc.setFont('helvetica','normal');
      doc.setFontSize(footerFontSize);
      doc.setTextColor(132,139,150);
      footerLines.forEach(function(line,i){
        doc.text(line,M,H-BOTTOM+7+i*footerLineHeight);
      });
      doc.text('Página '+p+' de '+total,W/2,H-5,{align:'center'});
    }

    var name=fileBase()+'_v'+entry.v+'_'+ref+'.pdf';
    doc.save(name);
    toast('PDF somente leitura gerado: '+name,'ok');
  }).catch(function(err){
    toast('Não foi possível gerar o PDF geral: '+(err&&err.message?err.message:String(err)),'err');
  });
}

/* ===================== tooltip / toast ===================== */
var tip=$('#tip');
document.addEventListener('mouseover',function(e){var t=e.target.closest&&e.target.closest('[data-tip]'); if(!t){tip.classList.remove('on');return;} tip.innerHTML=esc(t.getAttribute('data-tip')).replace(/\n/g,'<br>'); tip.classList.add('on');});
document.addEventListener('mousemove',function(e){ if(!tip.classList.contains('on')) return; var x=e.clientX+14,y=e.clientY+14,r=tip.getBoundingClientRect(); if(x+r.width>innerWidth-8)x=e.clientX-r.width-14; if(y+r.height>innerHeight-8)y=e.clientY-r.height-14; tip.style.left=x+'px'; tip.style.top=y+'px';});
function toast(msg,kind){var t=document.createElement('div'); t.className='toast '+(kind||''); t.textContent=msg; $('#toasts').appendChild(t); setTimeout(function(){t.remove();},5200);}

/* ===================== banco (Estante / Firebase) ===================== */
function aplicaBanco(v){
  var h=v.history||{};
  store.history=Object.keys(h).sort(function(a,b){return +a.slice(1)-+b.slice(1);}).map(function(k){return h[k];});
  store.current=clone(v.current);
  if(!dirty) state=clone(store.current);
}
function checkDraft(){
  try{ var dr=JSON.parse(lsGet(KEY+':draft')||'null'); if(dr && dr.base===store.history.length && diff(store.current,dr.state).length) draftOffer=true; else if(dr) lsDel(KEY+':draft'); }catch(e){}
}
var remotoPendente=null;
function canon(o){ return JSON.stringify(o, function(k,v){ if(v===null||v===undefined) return undefined; if(v&&typeof v==='object'&&!Array.isArray(v)){ var r={}; Object.keys(v).sort().forEach(function(x){ if(v[x]!==null&&v[x]!==undefined) r[x]=v[x]; }); return r; } return v; }); }
function mostraAvisoRemoto(){
  var el=document.getElementById('__remoto');
  if(!el){
    el=document.createElement('div'); el.id='__remoto';
    el.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#1d2a3a;color:#fff;border:1px solid #4d9fff;border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:14px';
    el.innerHTML='<span style="flex:1;min-width:220px">Outra pessoa salvou uma nova versão deste estudo. Você tem alterações não salvas, então não atualizei a tela.</span><button id="__remotoOk" style="background:#4d9fff;color:#06203f;border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer">Ver nova versão</button><button id="__remotoX" style="background:transparent;color:#fff;border:1px solid #4d5a6b;border-radius:8px;padding:8px 12px;cursor:pointer">Continuar aqui</button>';
    document.body.appendChild(el);
    document.getElementById('__remotoX').onclick=function(){ el.remove(); };
    document.getElementById('__remotoOk').onclick=function(){
      if(dirty && !confirm('Suas alterações não salvas serão descartadas para mostrar a versão nova. Continuar?')) return;
      var nv=remotoPendente; remotoPendente=null; dirty=false; editMode=false; pendingOrigin=null; lsDel(KEY+':draft');
      if(nv) aplicaBanco(nv);
      el.remove(); render();
    };
  }
}
function carregaBanco(){
  var ref=firebase.database().ref('eqEstudos');
  ref.once('value').then(function(snap){
    var v=snap.val();
    if(!v||!v.current){
      v={current:clone(SEED_DATA.current), history:{}};
      SEED_DATA.history.forEach(function(h){v.history['v'+h.v]=h;});
      return ref.set(v).then(function(){return v;});
    }
    return v;
  }).then(function(v){
    aplicaBanco(v); checkDraft(); render();
    ref.on('value',function(s){
      var nv=s.val(); if(!nv||!nv.current||salvandoAgora) return;
      var novaVersao = nv.history && Object.keys(nv.history).length !== store.history.length;
      var mudouAtual = canon(nv.current)!==canon(store.current);
      if(!novaVersao && !mudouAtual) return;
      if(dirty||editMode){ remotoPendente=nv; mostraAvisoRemoto(); return; }
      aplicaBanco(nv); render();
    });
  }).catch(function(err){
    var m=String((err&&err.message)||err||'');
    var motivo=/permission|denied/i.test(m)?'Seu usuário não tem permissão de leitura nos dados deste app. Peça para o admin conferir o grupo e se as regras do Firebase foram publicadas.':'Não consegui carregar os dados agora. Recarregue a página.';
    document.getElementById('app').innerHTML='<div class="empty" style="padding:40px 20px;text-align:center"><b>Os dados não carregaram.</b><br>'+esc(motivo)+'<br><small style="color:var(--muted)">Detalhe técnico: '+esc(m)+'</small></div>';
    toast('Dados não carregados. Veja a mensagem na tela.',true);
  });
}
var salvandoAgora=false;
function salvarNoBanco(e){
  var ref=firebase.database().ref('eqEstudos');
  return ref.child('history').once('value').then(function(snap){
    if(snap.numChildren()!==store.history.length) throw new Error('Outra pessoa salvou uma versão agora. Recarregue a página, confira e salve de novo.');
    var upd={}; upd['current']=clone(state); upd['history/v'+e.v]=e;
    salvandoAgora=true;
    return ref.update(upd);
  }).then(function(){
    salvandoAgora=false;
    store.history.push(e); store.current=clone(state); dirty=false; pendingOrigin=null; editMode=false; lsDel(KEY+':draft');
  }).catch(function(err){ salvandoAgora=false; throw err; });
}
window.__startApp=carregaBanco;

/* ===================== init ===================== */
var th=lsGet('eqdash:theme'); if(th) document.documentElement.setAttribute('data-theme',th);
window.addEventListener('beforeunload',function(e){ if(dirty){e.preventDefault(); e.returnValue='';} });
/* Virada do dia: se a página ficou aberta, os "Dias" precisam ser recalculados sozinhos */
function checaViradaDoDia(){
  if(!state || editMode || dirty) return;          /* não redesenha no meio de uma edição */
  if(diaRenderizado && todayISO()!==diaRenderizado) render();
}
setInterval(checaViradaDoDia, 60000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) checaViradaDoDia(); });
window.addEventListener('focus', checaViradaDoDia);
})();
</script>

<script>

  function norm(x){ return String(x).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().trim(); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function liberar(){
    var st = document.getElementById('__gateStyle');
    var ov = document.getElementById('__gateOverlay');
    if(st) st.remove();
    if(ov) ov.remove();
    window.__gateOk = true;

  }
  var jaResolveu = false;
  setTimeout(function(){
    if(!jaResolveu) negar('Não foi possível confirmar seu acesso (conexão lenta ou instável). <a href="javascript:location.reload()" style="color:#4d9fff;">Tentar de novo</a>');
  }, 10000);
  firebase.auth().onAuthStateChanged(function(user){
    jaResolveu = true;
    if(!user){ negar('Você precisa entrar pela Estante.'); return; }
    firebase.database().ref('centralApps/usuarios/' + user.uid).once('value').then(function(snap){

      if(permitido){ liberar(); return; }

    }).catch(function(){ negar('Não foi possível checar sua permissão agora. Tente recarregar.'); });
  });
})();
