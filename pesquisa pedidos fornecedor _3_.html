const DEFAULT_SOURCE_LABEL = "Dados de exemplo · pedidos exportados originalmente";

const fornecedorPorCodigo = new Map();
FORNECEDORES.forEach((f) => {
  if (!fornecedorPorCodigo.has(f.codigo)) fornecedorPorCodigo.set(f.codigo, []);
  fornecedorPorCodigo.get(f.codigo).push(f);
});

function onlyDigits(s) { return (s || "").replace(/\D/g, ""); }

function formatCnpjCpf(digits) {
  if (!digits) return "—";
  if (digits.length === 11) return digits.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
  if (digits.length === 14) return digits.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, "$1.$2.$3/$4-$5");
  return digits;
}

function fmtDate(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  return d + "/" + m + "/" + y;
}

function fmtQtd(n) {
  if (n == null) return "—";
  return Number(n).toLocaleString("pt-BR");
}

const state = {
  query: "",
  pedidosAbertos: DEFAULT_PEDIDOS_ABERTOS,
  sourceLabel: DEFAULT_SOURCE_LABEL,
  uploadError: null,
};

function matchVendor(f, qUpper, qDigits) {
  if (qDigits.length >= 3) {
    if ((f.cnpjCpf || "").includes(qDigits)) return true;
  }
  if (f.razaoSocial.toUpperCase().includes(qUpper)) return true;
  if (f.nomeFantasia.toUpperCase().includes(qUpper)) return true;
  if (f.codigo === state.query.trim()) return true;
  return false;
}

function render(cursorPos) {
  const q = state.query.trim();
  const qUpper = q.toUpperCase();
  const qDigits = onlyDigits(q);

  const totalAberto = state.pedidosAbertos.length;
  const fornecedoresComPedido = new Set(state.pedidosAbertos.map((p) => p.fornecedorCodigo)).size;

  let body;

  if (q.length < 2) {
    body = `
      <div class="empty-state">
        <div class="big">🔍</div>
        <div class="msg">Digite o nome do fornecedor, nome fantasia, CPF ou CNPJ para localizar os itens de pedidos de compra ainda em aberto.</div>
      </div>`;
  } else {
    // fornecedores que batem na busca
    const matchedCodigos = new Set();
    FORNECEDORES.forEach((f) => {
      if (matchVendor(f, qUpper, qDigits)) matchedCodigos.add(f.codigo);
    });
    // tambem tenta bater direto pelo codigo do fornecedor no pedido (cobre fornecedores sem cadastro)
    if (/^\d+$/.test(q)) {
      state.pedidosAbertos.forEach((p) => {
        if (p.fornecedorCodigo === q) matchedCodigos.add(p.fornecedorCodigo);
      });
    }

    const groups = [];
    matchedCodigos.forEach((codigo) => {
      const itens = state.pedidosAbertos.filter((p) => p.fornecedorCodigo === codigo);
      if (!itens.length) return;
      const cadastro = fornecedorPorCodigo.get(codigo);
      groups.push({ codigo, cadastro, itens });
    });

    if (!groups.length) {
      body = `
        <div class="no-results">
          <div class="big">📭</div>
          <div>Nenhum pedido em aberto encontrado para "<strong>${esc(q)}</strong>".</div>
        </div>`;
    } else {
      body = groups.map((g) => renderVendorCard(g)).join("");
    }
  }

  document.getElementById("app").innerHTML = `
    <header class="header">
      <div class="eyebrow">Controle Fiscal · Recebimento de Notas</div>
      <h1 class="title">Pesquisa de Pedidos em Aberto</h1>
      <div class="subtitle">Localize rapidamente os itens de pedidos de compra ainda não encerrados, por fornecedor.</div>
    </header>

    <div class="databar">
      <button class="upload-btn" id="btn-upload">📎 Atualizar planilha de pedidos</button>
      <input type="file" id="file-input" accept=".xlsx,.xls" style="display:none" />
      <button class="reset-btn" id="btn-reset">Restaurar dados de exemplo</button>
      <span class="source-tag">${esc(state.sourceLabel)}</span>
    </div>
    ${state.uploadError ? `<div class="upload-error">${esc(state.uploadError)}</div>` : ""}

    <div class="search-wrap">
      <input class="search-input" id="search-input" type="text"
        placeholder="Nome do fornecedor, nome fantasia, CPF ou CNPJ..."
        value="${esc(state.query)}" autofocus />
    </div>
    <div class="stats-line">
      <span><strong>${totalAberto}</strong> itens em aberto na base</span>
      <span><strong>${fornecedoresComPedido}</strong> fornecedores com pedido ativo</span>
      <span><strong>${FORNECEDORES.length}</strong> fornecedores cadastrados</span>
    </div>

    ${body}

    <div class="footer">
      Base de fornecedores carregada localmente neste arquivo. Base de pedidos: planilha original ou a última que você anexou.<br>
      "Ped. Encerr. = E" foi tratado como pedido encerrado e não aparece na busca. Itens com fornecedor sem cadastro aparecem apenas se você pesquisar pelo código do fornecedor.
    </div>
  `;

  document.getElementById("search-input").addEventListener("input", (e) => {
    const cursorPos = e.target.selectionStart;
    state.query = e.target.value;
    render(cursorPos);
  });
  const focusEl = document.getElementById("search-input");
  focusEl.focus();
  if (typeof cursorPos === "number") {
    focusEl.setSelectionRange(cursorPos, cursorPos);
  } else {
    focusEl.setSelectionRange(focusEl.value.length, focusEl.value.length);
  }

  document.getElementById("btn-upload").addEventListener("click", () => {
    document.getElementById("file-input").click();
  });
  document.getElementById("file-input").addEventListener("change", handleFileUpload);
  document.getElementById("btn-reset").addEventListener("click", () => {
    state.pedidosAbertos = DEFAULT_PEDIDOS_ABERTOS;
    state.sourceLabel = DEFAULT_SOURCE_LABEL;
    state.uploadError = null;
    render();
  });
}

function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type: "array", cellDates: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, { raw: true, defval: null });

      const pedidos = [];
      json.forEach((row) => {
        const numeroPC = row["Numero PC"];
        if (!numeroPC && numeroPC !== 0) return;
        const encerrado = (row["Ped. Encerr."] || "").toString().trim().toUpperCase();
        if (encerrado === "E") return;
        const dtRaw = row["DT Emissao"];
        let dtStr = null;
        if (dtRaw instanceof Date) {
          dtStr = dtRaw.toISOString().slice(0, 10);
        } else if (dtRaw) {
          dtStr = String(dtRaw);
        }
        pedidos.push({
          item: row["Item"] != null ? String(row["Item"]).trim() : null,
          produto: (row["Produto"] || "").toString().trim(),
          descricao: (row["Descricao"] || "").toString().trim(),
          unidade: (row["Unidade"] || "").toString().trim(),
          quantidade: row["Quantidade"],
          fornecedorCodigo: row["Fornecedor"] != null ? String(row["Fornecedor"]).trim() : null,
          dtEmissao: dtStr,
          numeroPC: String(numeroPC).trim(),
          qtdEntregue: row["Qtd.Entregue"] != null ? row["Qtd.Entregue"] : 0,
        });
      });

      if (!pedidos.length) {
        state.uploadError = "Não encontrei itens em aberto nessa planilha. Confira se as colunas têm os mesmos nomes do arquivo original (Item, Produto, Descricao, Unidade, Quantidade, Fornecedor, DT Emissao, Numero PC, Qtd.Entregue, Ped. Encerr.).";
        render();
        return;
      }

      state.pedidosAbertos = pedidos;
      state.sourceLabel = file.name + " · " + pedidos.length + " itens em aberto carregados";
      state.uploadError = null;
      state.query = "";
      render();
    } catch (err) {
      state.uploadError = "Não consegui ler essa planilha (" + err.message + "). Verifique se é um arquivo .xlsx ou .xls válido.";
      render();
    }
  };
  reader.readAsArrayBuffer(file);
}


function renderVendorCard(g) {
  const cadastro = g.cadastro ? g.cadastro[0] : null;
  const outrasFiliais = g.cadastro && g.cadastro.length > 1 ? g.cadastro.slice(1) : [];

  const headHtml = cadastro ? `
    <div class="vendor-head">
      <div>
        <div class="vendor-name">${esc(cadastro.razaoSocial)}</div>
        ${cadastro.nomeFantasia && cadastro.nomeFantasia !== cadastro.razaoSocial ? `<div class="vendor-fantasia">Nome fantasia: ${esc(cadastro.nomeFantasia)}</div>` : ""}
        ${outrasFiliais.length ? `<div class="vendor-fantasia">+ ${outrasFiliais.length} filial(is) sob o mesmo código: ${outrasFiliais.map(o => esc(o.nomeFantasia||o.razaoSocial)).join(", ")}</div>` : ""}
      </div>
      <div class="vendor-meta">
        <div>Código: <span class="codigo">${esc(g.codigo)}</span></div>
        <div>${formatCnpjCpf(cadastro.cnpjCpf)}</div>
      </div>
    </div>` : `
    <div class="vendor-head">
      <div>
        <div class="vendor-name">Fornecedor código ${esc(g.codigo)}</div>
        <div class="vendor-warn">⚠ Sem cadastro na lista de fornecedores</div>
      </div>
      <div class="vendor-meta"><div>Código: <span class="codigo">${esc(g.codigo)}</span></div></div>
    </div>`;

  // agrupar itens por numero PC
  const porPc = new Map();
  g.itens.forEach((it) => {
    if (!porPc.has(it.numeroPC)) porPc.set(it.numeroPC, []);
    porPc.get(it.numeroPC).push(it);
  });

  const pcGroupsHtml = [...porPc.entries()].map(([pc, itens]) => {
    const dt = itens[0].dtEmissao;
    const rows = itens.map((it) => {
      const pendente = (Number(it.quantidade) || 0) - (Number(it.qtdEntregue) || 0);
      return `
        <tr>
          <td>${esc(it.item)}</td>
          <td class="col-produto">${esc(it.produto)}</td>
          <td>${esc(it.descricao)}</td>
          <td>${esc(it.unidade)}</td>
          <td class="col-num">${fmtQtd(it.quantidade)}</td>
          <td class="col-num">${fmtQtd(it.qtdEntregue)}</td>
          <td class="col-num ${pendente > 0 ? "pendente-pos" : "pendente-zero"}">${fmtQtd(pendente)}</td>
        </tr>`;
    }).join("");
    return `
      <div class="pc-group">
        <div class="pc-header">
          <div class="pc-title">
            <span class="pc-badge"><span class="pc-label">PC</span><span class="pc-num">${esc(pc)}</span></span>
            <span class="pc-date">emitido em ${fmtDate(dt)}</span>
          </div>
          <span class="stamp">Em Aberto</span>
        </div>
        <table class="items-table">
          <thead><tr>
            <th>Item</th><th>Produto</th><th>Descrição</th><th>Un.</th>
            <th class="col-num">Qtd.</th><th class="col-num">Entregue</th><th class="col-num">Pendente</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }).join("");

  return `<div class="vendor-card">${headHtml}${pcGroupsHtml}</div>`;
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

render();
</script>
