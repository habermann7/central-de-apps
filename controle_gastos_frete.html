<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Gastos com Frete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EFEAE0;
    --paper: #ffffff;
    --ink: #2A2420;
    --ink-soft: #6b5d4f;
    --ink-mute: #8A7D6B;
    --border: #E4DBC9;
    --border-strong: #DED4C2;
    --accent: #8B5E3C;
    --green: #3F6659;
    --green-bg: #E4EFE9;
    --orange: #B0562D;
    --orange-bg: #F7E9DD;
    --track: #F0EADD;
    --header: #2A2420;
    --header-mute: #B8AC98;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C1815;
      --paper: #262019;
      --ink: #EFEAE0;
      --ink-soft: #C9BEA9;
      --ink-mute: #9A8D78;
      --border: #3A322A;
      --border-strong: #443A30;
      --accent: #C98A5E;
      --green: #6FA08D;
      --green-bg: #24332C;
      --orange: #D98457;
      --orange-bg: #362920;
      --track: #332C24;
      --header: #14110E;
      --header-mute: #8A7D6B;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1C1815;
    --paper: #262019;
    --ink: #EFEAE0;
    --ink-soft: #C9BEA9;
    --ink-mute: #9A8D78;
    --border: #3A322A;
    --border-strong: #443A30;
    --accent: #C98A5E;
    --green: #6FA08D;
    --green-bg: #24332C;
    --orange: #D98457;
    --orange-bg: #362920;
    --track: #332C24;
    --header: #14110E;
    --header-mute: #8A7D6B;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  .sg { font-family: 'Space Grotesk', 'Inter', sans-serif; }
  input, select, textarea, button { font-family: 'Inter', sans-serif; }
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  button { cursor: pointer; }
  a { color: var(--accent); }

  .header {
    background: var(--header); color: var(--bg);
    padding: 20px 28px; display:flex; align-items:center; justify-content:space-between;
    flex-wrap: wrap; gap: 12px;
  }
  .header-left { display:flex; align-items:center; gap:12px; }
  .logo-box {
    width:40px; height:40px; border-radius:8px; background: var(--accent);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .header-title { font-size:19px; font-weight:700; letter-spacing:-0.01em; }
  .header-sub { font-size:12.5px; color: var(--header-mute); }
  .btn-primary {
    display:flex; align-items:center; gap:8px; background: var(--accent); color:#fff;
    border:none; padding:10px 18px; border-radius:7px; font-size:14px; font-weight:600;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-secondary {
    display:flex; align-items:center; gap:7px; background: var(--paper); color: var(--ink);
    border:1px solid var(--border-strong); padding:8px 14px; border-radius:7px; font-size:13px; font-weight:600;
  }
  .btn-secondary:hover { background: var(--track); }

  .tabs { display:flex; gap:4px; padding:14px 28px 0; border-bottom:1px solid var(--border-strong); background: var(--bg); overflow-x:auto; }
  .tab-btn {
    display:flex; align-items:center; gap:7px; padding:10px 16px; border:none; background:none;
    border-bottom:2px solid transparent; color: var(--ink-mute); font-weight:500; font-size:14px; white-space:nowrap;
  }
  .tab-btn.active { border-bottom-color: var(--accent); color: var(--ink); font-weight:600; }

  .filters { display:flex; gap:10px; padding:16px 28px; flex-wrap:wrap; align-items:center; }
  .filter-select {
    padding:8px 12px; border-radius:7px; border:1px solid var(--border-strong); font-size:13px;
    background: var(--paper); color: var(--ink);
  }
  .ms-trigger { display:flex; align-items:center; gap:6px; white-space:nowrap; max-width:220px; overflow:hidden; text-overflow:ellipsis; }
  .ms-trigger:hover { background: var(--track); }
  .ms-backdrop { position:fixed; inset:0; z-index:40; }
  .ms-panel {
    position:absolute; top:calc(100% + 6px); left:0; z-index:41; min-width:260px; max-height:280px;
    overflow-y:auto; background: var(--paper); border:1px solid var(--border-strong); border-radius:8px;
    padding:10px; display:flex; flex-direction:column; gap:2px; box-shadow:0 10px 28px rgba(20,17,14,0.18);
  }
  .ms-panel-right { left:auto; right:0; }
  .ms-item { display:flex; align-items:center; gap:9px; font-size:13px; padding:6px 4px; border-radius:5px; cursor:pointer; }
  .ms-item:hover { background: var(--track); }
  .ms-item-all { font-weight:600; border-bottom:1px solid var(--border); margin-bottom:4px; padding-bottom:8px; border-radius:0; }
  .saving-note { font-size:12px; color: var(--ink-mute); }
  .anexo-actions { display:inline-flex; gap:6px; white-space:nowrap; }
  .link-btn { border:1px solid var(--border-strong); background: var(--paper); color: var(--accent); border-radius:6px; padding:3px 9px; font-size:12px; font-weight:600; }
  .link-btn:hover { background: var(--track); }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:120; background: var(--ink); color: var(--bg); padding:10px 16px; border-radius:8px; font-size:13px; max-width:90vw; box-shadow:0 8px 24px rgba(20,17,14,0.3); }
  .period-group { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .filter-label { font-size:12px; color: var(--ink-mute); }
  .range-text { font-size:12px; color: var(--ink-soft); }
  input[type="date"].filter-select { padding:7px 10px; }
  .box-sub { font-size:12px; color: var(--ink-mute); margin:-10px 0 14px; }
  .seg { display:inline-flex; border:1px solid var(--border-strong); border-radius:7px; overflow:hidden; }
  .seg-btn { border:none; background: var(--paper); color: var(--ink-soft); padding:5px 12px; font-size:12px; font-weight:500; }
  .seg-btn + .seg-btn { border-left:1px solid var(--border-strong); }
  .seg-btn.active { background: var(--track); color: var(--ink); font-weight:600; }
  .mm-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:14px; }
  .mm-card { border:1px solid var(--border); border-radius:10px; padding:12px 14px 8px; }
  .mm-head { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .mm-name { font-size:12.5px; font-weight:600; color: var(--ink); display:flex; align-items:center; gap:6px; min-width:0; }
  .mm-name span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mm-total { font-size:12px; color: var(--ink-soft); white-space:nowrap; }
  .bar-mark { fill: var(--accent); }
  .col:hover .bar-mark, .col:focus .bar-mark { fill-opacity:0.78; }
  .col:focus { outline:none; }
  .col:focus .hit { stroke: var(--accent); stroke-width:1; }
  .ax-base { stroke: var(--border-strong); stroke-width:1; }
  .ax-grid { stroke: var(--border); stroke-width:1; }
  .ax-text { fill: var(--ink-mute); font-size:10px; font-family:'Inter', sans-serif; }
  .ax-val { fill: var(--ink-soft); font-size:10.5px; font-weight:600; font-family:'Inter', sans-serif; }
  .tip { position:fixed; z-index:100; pointer-events:none; display:none; background: var(--ink); color: var(--bg); padding:7px 11px; border-radius:7px; font-size:12px; box-shadow:0 6px 18px rgba(20,17,14,0.25); }
  .tip-v { display:block; font-weight:700; font-size:13px; }
  .tip-a { display:block; opacity:0.78; margin-top:1px; }
  table.pivot { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.pivot th, table.pivot td { padding:8px 12px; border-top:1px solid var(--track); white-space:nowrap; text-align:right; }
  table.pivot thead th { position:sticky; top:0; background: var(--track); color: var(--ink-soft); font-weight:600; z-index:2; }
  table.pivot th:first-child, table.pivot td:first-child { text-align:left; position:sticky; left:0; background: var(--paper); z-index:1; font-weight:500; }
  table.pivot thead th:first-child { background: var(--track); z-index:3; }
  table.pivot tfoot td { font-weight:700; background: var(--track); }
  table.pivot td.zero { color: var(--ink-mute); }

  .panel-wrap { padding:0 28px 32px; display:flex; flex-direction:column; gap:20px; }
  .cards-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:14px; }
  .card {
    background: var(--paper); border:1px solid var(--border); border-radius:10px; padding:16px 18px;
  }
  .card-label { font-size:12px; color: var(--ink-mute); margin-bottom:6px; }
  .card-value { font-size:22px; font-weight:700; color: var(--ink); }

  .box {
    background: var(--paper); border-radius:10px; padding:20px; border:1px solid var(--border);
  }
  .box-title { font-size:14.5px; font-weight:600; margin-bottom:16px; display:flex; align-items:center; gap:7px; }

  .bar-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .bar-label { width:170px; font-size:12.5px; display:flex; align-items:center; gap:6px; color: var(--ink-soft); flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track { flex:1; height:20px; background: var(--track); border-radius:4px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:4px; }
  .bar-value { width:110px; text-align:right; font-size:13px; font-weight:600; flex-shrink:0; }

  .empty-note { font-size:13px; color: var(--ink-mute); padding: 6px 0; }

  .mini-table-scroll { max-height:340px; overflow-y:auto; overflow-x:auto; border:1px solid var(--border); border-radius:8px; }
  table.mini-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.mini-table thead th { position:sticky; top:0; background: var(--track); padding:8px 12px; text-align:left; font-weight:600; color: var(--ink-soft); white-space:nowrap; z-index:1; }
  table.mini-table td { padding:8px 12px; border-top:1px solid var(--track); white-space:nowrap; }

  .table-wrap { background: var(--paper); border-radius:10px; border:1px solid var(--border); overflow:hidden; margin: 0 28px 32px; }
  .table-scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead tr { background: var(--track); text-align:left; }
  th { padding:10px 14px; font-weight:600; color: var(--ink-soft); white-space:nowrap; border-bottom:1px solid var(--border); }
  td { padding:10px 14px; border-bottom:1px solid var(--track); }
  tbody tr:hover { background: color-mix(in srgb, var(--track) 55%, transparent); }
  .status-pill { border:none; border-radius:12px; padding:3px 10px; font-size:11.5px; font-weight:600; }
  .status-pago { background: var(--green-bg); color: var(--green); }
  .status-pendente { background: var(--orange-bg); color: var(--orange); }
  .icon-btn { border:none; background:none; padding:4px; display:inline-flex; }
  .icon-btn.edit { color:#4A5D73; margin-right:8px; }
  .icon-btn.del { color: var(--orange); }
  .obs-cell { color: var(--ink-mute); max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .modal-overlay {
    position:fixed; inset:0; background:rgba(20,17,14,0.55); display:flex; align-items:center; justify-content:center;
    z-index:50; padding:16px;
  }
  .modal {
    background: var(--paper); border-radius:12px; width:520px; max-width:100%; max-height:90vh; overflow-y:auto; padding:26px;
  }
  .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .modal-title { font-size:17px; font-weight:700; }
  .modal-close { border:none; background:none; color: var(--ink-mute); }
  .form-col { display:flex; flex-direction:column; gap:14px; }
  .field { display:flex; flex-direction:column; gap:6px; font-size:12.5px; color: var(--ink-soft); font-weight:500; }
  .field input, .field select, .field textarea {
    padding:9px 12px; border-radius:7px; border:1px solid var(--border-strong); font-size:13.5px; color: var(--ink);
    background: var(--paper); width:100%;
  }
  .field textarea { resize: vertical; }
  .field-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .error-text { font-size:13px; color: var(--orange); }
  .btn-submit {
    margin-top:6px; background: var(--accent); color:#fff; border:none; padding:11px; border-radius:7px;
    font-weight:600; font-size:14.5px; width:100%;
  }
  .attach-note { font-size:12px; color: var(--green); margin-top:4px; }
  .attach-uploading { font-size:12px; color: var(--ink-mute); margin-top:4px; }
  .autofill-note { font-size:12px; color: var(--accent); margin-top:4px; background: color-mix(in srgb, var(--accent) 12%, transparent); padding:7px 10px; border-radius:6px; }

  .loading-screen { display:flex; align-items:center; justify-content:center; height:400px; color: var(--ink-mute); font-size:14px; }
  .unavailable-banner { margin:16px 28px; padding:12px 16px; border-radius:8px; background: var(--orange-bg); color: var(--orange); font-size:13px; }

  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius:4px; }
[hidden]:not([hidden=until-found i]){display:none!important}
</style>

  if (n.includes('MOTOBOY')) return ICONS.bike;
  return ICONS.package;
}
function colorFor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return PALETTE[Math.abs(h) % PALETTE.length];
}

function setState(patch) { Object.assign(state, patch); render(); }

async function init() {
  if (state.started) return; state.started = true;
  try {
    state.ref = firebase.database().ref('controleFrete/lancamentos');
    subscribeExpenses();
    maybeSeed();
  } catch (e) {
    console.error(e);
    setState({ loading:false, dbUnavailable:true });
  }
}

function subscribeExpenses() {
  state.ref.on('value',
    (snap) => {
      const v = snap.val() || {};
      const items = Object.keys(v).map(id => ({ id, ...v[id] }));
      setState({ expenses: items, loading:false, dbUnavailable:false });
    },
    (err) => {
      console.error('db snapshot error', err);
      setState({ loading:false, dbUnavailable: state.expenses.length===0 });
    }
  );
}

// Na 1ª abertura (uma única vez, no mundo todo) carrega o histórico inicial.
async function maybeSeed() {
  try {
    const r = await firebase.database().ref('controleFrete/meta/semeado').transaction(cur => cur ? undefined : true);
    if (!r.committed) return;
    await Promise.all(SEED_DATA.map(d => state.ref.push({
      prestador: d.prestador,
      vencimento: d.vencimento,
      nfatura: d.nfatura,
      valor: d.valor,
      dataEnvio: d.dataEnvio,
      obs: d.obs || '',
      status: 'Pago',
    })));
  } catch (e) {
    console.error('seed error', e);
  }
}

const PERIOD_PRESETS = [
  ['todo','Todo o período'], ['mes_atual','Este mês'], ['mes_anterior','Mês anterior'],
  ['30d','Últimos 30 dias'], ['90d','Últimos 90 dias'], ['ano_atual','Este ano'], ['personalizado','Personalizado…']
];
function parseBRL(s) {
  s = String(s == null ? '' : s).replace(/R\$|\s/g, '');
  if (s.indexOf(',') !== -1) s = s.replace(/\./g, '').replace(',', '.');      // 3.150,50 -> 3150.50
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');          // 3.150 -> 3150
  return parseFloat(s);
}
function pad2(n) { return String(n).padStart(2,'0'); }
function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function periodRange() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  switch (state.periodPreset) {
    case 'mes_atual': return [ymd(new Date(y, m, 1)), ymd(new Date(y, m+1, 0))];
    case 'mes_anterior': return [ymd(new Date(y, m-1, 1)), ymd(new Date(y, m, 0))];
    case '30d': return [ymd(new Date(y, m, now.getDate()-29)), ymd(now)];
    case '90d': return [ymd(new Date(y, m, now.getDate()-89)), ymd(now)];
    case 'ano_atual': return [y + '-01-01', y + '-12-31'];
    case 'personalizado': return [state.dateFrom || null, state.dateTo || null];
    default: return [null, null];
  }
}
function fmtRangeText() {
  const r = periodRange();
  if (!r[0] && !r[1]) return '';
  return (r[0] ? fmtDate(r[0]) : 'início') + ' a ' + (r[1] ? fmtDate(r[1]) : 'hoje em diante');
}
function setPeriodPreset(v) { state.periodPreset = v; render(); }
function setDateFrom(v) { state.dateFrom = v; render(); }
function setDateTo(v) { state.dateTo = v; render(); }
function setMonthViewMode(m) { state.monthViewMode = m; render(); }

function findAnexo(id) { const it = state.expenses.find(e => e.id === id); return it && it.anexo ? it.anexo : null; }

function monthShort(key) { return MONTH_LABELS[parseInt(key.slice(5,7),10) - 1]; }
function monthFull(key) { return monthShort(key) + '/' + key.slice(0,4); }
function monthKeysFor(list) {
  const keys = list.map(e => (e.vencimento||'').slice(0,7)).filter(k => k.length === 7).sort();
  if (!keys.length) return [];
  let y = parseInt(keys[0].slice(0,4),10), m = parseInt(keys[0].slice(5,7),10);
  const ey = parseInt(keys[keys.length-1].slice(0,4),10), em = parseInt(keys[keys.length-1].slice(5,7),10);
  const out = [];
  while (y < ey || (y === ey && m <= em)) {
    out.push(y + '-' + pad2(m));
    m++; if (m > 12) { m = 1; y++; }
  }
  return out;
}
function fmtCompact(v) {
  const n = (x) => x.toLocaleString('pt-BR', { maximumFractionDigits: 1 });
  if (v >= 1e6) return n(v/1e6) + ' mi';
  if (v >= 1e3) return n(v/1e3) + ' mil';
  return n(v);
}
function niceMax(max) {
  const p = Math.pow(10, Math.floor(Math.log10(max)));
  const c = [1, 2, 2.5, 5, 10];
  for (let i = 0; i < c.length; i++) { if (c[i] * p >= max) return c[i] * p; }
  return 10 * p;
}
function barPath(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, h, w/2));
  return 'M' + x + ',' + (y+h) + ' V' + (y+r) + ' Q' + x + ',' + y + ' ' + (x+r) + ',' + y +
         ' H' + (x+w-r) + ' Q' + (x+w) + ',' + y + ' ' + (x+w) + ',' + (y+r) + ' V' + (y+h) + ' Z';
}

// items: [{key, value}]; o: {w,h,padL,padR,padT,padB,ticks,focusable,label}
function barsSvg(items, o) {
  const W = o.w, H = o.h, padL = o.padL, padR = o.padR, padT = o.padT, padB = o.padB;
  const n = items.length;
  const rawMax = Math.max(1, ...items.map(i => i.value));
  const yMax = o.ticks ? niceMax(rawMax) : rawMax;
  const innerW = W - padL - padR, innerH = H - padT - padB, base = padT + innerH;
  const slot = innerW / n;
  let bw = Math.min(24, slot - 4); if (bw < 2) bw = Math.max(1, slot - 2);
  const multiYear = items.length && items[0].key.slice(0,4) !== items[n-1].key.slice(0,4);
  const step = Math.max(1, Math.ceil(30 / slot));
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label) + '" style="width:100%;height:auto;display:block;overflow:visible">';
  if (o.ticks) {
    [0.5, 1].forEach(f => {
      const y = base - innerH * f;
      s += '<line class="ax-grid" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y + '" y2="' + y + '"/>';
      s += '<text class="ax-text" x="' + (padL - 6) + '" y="' + (y + 3.5) + '" text-anchor="end">' + fmtCompact(yMax * f) + '</text>';
    });
    s += '<text class="ax-text" x="' + (padL - 6) + '" y="' + (base + 3.5) + '" text-anchor="end">0</text>';
  }
  s += '<line class="ax-base" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + base + '" y2="' + base + '"/>';
  let peakIdx = -1, peakVal = 0;
  items.forEach((it, i) => { if (it.value > peakVal) { peakVal = it.value; peakIdx = i; } });
  items.forEach((it, i) => {
    const x = padL + i * slot + (slot - bw) / 2;
    const bh = (it.value / yMax) * innerH;
    const y = base - bh;
    s += '<g class="col"' + (o.focusable ? ' tabindex="0"' : '') + ' data-tip-a="' + esc(monthFull(it.key)) + '" data-tip-v="' + esc(currency(it.value)) + '">';
    s += '<rect class="hit" x="' + (padL + i * slot) + '" y="' + padT + '" width="' + slot + '" height="' + innerH + '" fill="transparent"/>';
    if (it.value > 0) s += '<path class="bar-mark" d="' + barPath(x, y, bw, bh, 4) + '"/>';
    s += '</g>';
    const cx = padL + i * slot + slot / 2;
    const jan = it.key.slice(5,7) === '01';
    if (i % step === 0) s += '<text class="ax-text" x="' + cx + '" y="' + (base + 13) + '" text-anchor="middle">' + monthShort(it.key) + '</text>';
    if (multiYear && (i === 0 || jan)) s += '<text class="ax-text" x="' + cx + '" y="' + (base + 25) + '" text-anchor="middle" style="font-weight:600">' + it.key.slice(0,4) + '</text>';
  });
  if (peakIdx >= 0) {
    const it = items[peakIdx];
    const bh = (it.value / yMax) * innerH;
    let cx = padL + peakIdx * slot + slot / 2;
    cx = Math.max(padL + 16, Math.min(W - padR - 16, cx));
    s += '<text class="ax-val" x="' + cx + '" y="' + (base - bh - 5) + '" text-anchor="middle">' + fmtCompact(it.value) + '</text>';
  }
  s += '</svg>';
  return s;
}

// ----- tooltip global (um só elemento, valores via textContent) -----
let tipEl = null;
function ensureTip() {
  if (tipEl) return tipEl;
  tipEl = document.createElement('div');
  tipEl.className = 'tip';
  const v = document.createElement('span'); v.className = 'tip-v';
  const a = document.createElement('span'); a.className = 'tip-a';
  tipEl.appendChild(v); tipEl.appendChild(a);
  document.body.appendChild(tipEl);
  return tipEl;
}
function hideTip() { if (tipEl) tipEl.style.display = 'none'; }
function showTip(target, x, y) {
  const t = ensureTip();
  t.querySelector('.tip-v').textContent = target.getAttribute('data-tip-v') || '';
  t.querySelector('.tip-a').textContent = target.getAttribute('data-tip-a') || '';
  t.style.display = 'block';
  const w = t.offsetWidth, hh = t.offsetHeight;
  let left = Math.min(x + 14, window.innerWidth - w - 8);
  let top = y - hh - 12; if (top < 8) top = y + 18;
  t.style.left = Math.max(8, left) + 'px';
  t.style.top = top + 'px';
}
document.addEventListener('pointermove', function(e) {
  const t = e.target && e.target.closest ? e.target.closest('[data-tip-v]') : null;
  if (t) showTip(t, e.clientX, e.clientY); else hideTip();
});
document.addEventListener('focusin', function(e) {
  const t = e.target && e.target.closest ? e.target.closest('[data-tip-v]') : null;
  if (t) { const r = t.getBoundingClientRect(); showTip(t, r.left + r.width / 2, r.top); }
});
document.addEventListener('focusout', hideTip);

function filteredExpenses() {

    if (range[0] && (!v || v < range[0])) return false;
    if (range[1] && (!v || v > range[1])) return false;
    if (state.filterPrestadores && !state.filterPrestadores.has(e.prestador)) return false;
    return true;
  });
}

async function handleFileChange(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { setState({ error: 'Arquivo muito grande (máximo 10 MB).' }); return; }
  setState({ attachUploading:true, error:'', autofillNote:'' });

  // Sobe o anexo e, em paralelo, tenta ler o PDF para autopreencher o formulário.
  const path = 'frete/' + Date.now() + '_' + file.name.replace(/[^A-Za-z0-9._-]+/g, '_');
  const sref = firebase.storage().ref(path);
  const uploadPromise = sref.put(file).then(() => sref.getDownloadURL()).then(url => ({ path, url })).catch(err => { console.error(err); return null; });
  const autofillPromise = (file.type === 'application/pdf') ? tryAutofillFromPdf(file) : Promise.resolve(null);

  const [res, autofill] = await Promise.all([uploadPromise, autofillPromise]);

  if (!res) {
    setState({ attachUploading:false, error:'Falha ao anexar o arquivo.' });
    return;
  }

  const patch = { attachment: { path: res.path, url: res.url, name: file.name }, attachUploading:false };
  if (autofill && autofill.filledFields.length > 0) {
    Object.assign(state.form, autofill.values);
    patch.autofillNote = 'Preenchido automaticamente a partir do PDF (' + autofill.filledFields.join(', ') + ') — confira antes de salvar.';
  } else if (file.type === 'application/pdf') {
    patch.autofillNote = '';
  }
  setState(patch);
}

// Tenta extrair transportadora/vencimento/nº fatura/valor de uma fatura ou nota
// fiscal de serviço em PDF. É uma leitura heurística baseada em padrões comuns de
// texto (não há um layout único entre transportadoras), então só preenche campos
// que ainda estiverem vazios e sempre pede para o usuário conferir os valores.
async function tryAutofillFromPdf(file) {
  try {
    if (!window.pdfjsLib) return null;
    const buf = await file.arrayBuffer();
    const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
    let text = '';
    for (let i = 1; i <= Math.min(pdf.numPages, 5); i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += ' ' + content.items.map(it => it.str).join(' ');
    }
    text = text.replace(/\s+/g, ' ').trim();
    if (!text) return null;

    const values = {};
    const filledFields = [];

    // Valor (R$): prioriza "valor total/do frete/a pagar/líquido", senão pega o maior valor em R$ do texto
    let valorMatch = text.match(/(?:VALOR\s+(?:TOTAL|L[IÍ]QUIDO|DO\s+FRETE|A\s+PAGAR|DA\s+NOTA)[^\d]{0,15})(R?\$?\s?[\d.]{1,12},\d{2})/i);
    if (!valorMatch) {
      const all = [...text.matchAll(/R\$\s?([\d.]{1,12},\d{2})/g)].map(m => m[1]);
      if (all.length) {
        const nums = all.map(s => parseFloat(s.replace(/\./g,'').replace(',','.')));
        const maxIdx = nums.indexOf(Math.max(...nums));
        valorMatch = [null, all[maxIdx]];
      }
    }
    if (valorMatch && !state.form.valor) {
      const raw = valorMatch[1].replace(/^R\$?\s?/,'');
      const num = parseFloat(raw.replace(/\./g,'').replace(',','.'));
      if (!isNaN(num) && num > 0) { values.valor = String(num.toFixed(2)).replace('.', ','); filledFields.push('valor'); }
    }

    // Vencimento
    const vencMatch = text.match(/VENC(?:IMENTO)?[^\d]{0,10}(\d{2}\/\d{2}\/\d{4})/i);
    if (vencMatch && !state.form.vencimento) {
      const [d,m,y] = vencMatch[1].split('/');
      values.vencimento = y + '-' + m + '-' + d;
      filledFields.push('vencimento');
    }

    // Nº da fatura / nota fiscal
    const nfMatch = text.match(/N[ºO°]?\s*(?:DA\s*)?(?:FATURA|NOTA\s*FISCAL|NF-?E?)[^\d]{0,10}(\d{2,12})/i);
    if (nfMatch && !state.form.nfatura) {
      values.nfatura = nfMatch[1];
      filledFields.push('nº da fatura');
    }

    // Transportadora / prestador (razão social, quando reconhecível no início do documento)
    const prestMatch = text.match(/(?:RAZ[ÃA]O\s+SOCIAL|EMITENTE|PRESTADOR)[:\s]{0,5}([A-ZÀ-Ú][A-ZÀ-Ú\s&.,-]{4,50})/i);
    if (prestMatch && !state.form.prestador) {
      values.prestador = prestMatch[1].trim().replace(/\s{2,}/g,' ');
      filledFields.push('transportadora');
    }

    if (filledFields.length === 0) return null;
    return { values, filledFields };
  } catch (err) {
    console.error('Falha ao ler PDF para autopreenchimento', err);
    return null;
  }
}

async function handleSubmit(e) {
  e.preventDefault();
  const f = state.form;
  if (!f.prestador || !f.vencimento || !f.valor) {
    setState({ error: 'Preencha ao menos transportadora, vencimento e valor.' });
    return;
  }
  if (!(parseBRL(f.valor) > 0)) { setState({ error: 'Valor inválido. Use o formato 3.150,00.' }); return; }
  const body = {
    prestador: f.prestador.trim(),
    vencimento: f.vencimento,
    nfatura: (f.nfatura||'').trim(),
    valor: parseBRL(f.valor),
    dataEnvio: f.dataEnvio || null,
    obs: (f.obs||'').trim(),
    status: f.status,
    anexo: state.attachment || null,
  };
  setState({ saving:true });
  try {
    if (state.editingId) {
      await state.ref.child(state.editingId).set(body);
    } else {
      await state.ref.push(body);
    }
    setState({ saving:false, showForm:false, editingId:null, form:{...EMPTY_FORM}, attachment:null, error:'' });
  } catch (err) {
    console.error(err);
    setState({ saving:false, error:'Não foi possível salvar. Tente novamente.' });
  }
}

function openExportModal() {
  const opts = prestadorOptions();
  const sel = state.filterPrestadores ? new Set(state.filterPrestadores) : new Set(opts);
  setState({ showExportModal:true, exportSelected: sel, exportError:'' });
}
function closeExportModal() {
  setState({ showExportModal:false, exportSelected:null, exportError:'' });
}
function toggleExportPrestador(name) {
  if (state.exportSelected.has(name)) state.exportSelected.delete(name); else state.exportSelected.add(name);
  render();
}
function toggleExportAll(checked) {
  const opts = prestadorOptions();
  state.exportSelected = checked ? new Set(opts) : new Set();
  render();
}
async function doExport() {
  if (!window.XLSX) { setState({ exportError:'Biblioteca de exportação não carregou. Tente novamente.' }); return; }
  const sel = state.exportSelected;
  if (!sel || sel.size === 0) { setState({ exportError:'Selecione ao menos uma transportadora.' }); return; }
  setState({ exporting:true, exportError:'' });
  try {
    const rows = filteredExpenses()
      .filter(e => sel.has(e.prestador))
      .slice()
      .sort((a,b) => (a.vencimento||'').localeCompare(b.vencimento||''))
      .map(e => ({
        'Transportadora': e.prestador || '',
        'Vencimento': e.vencimento ? fmtDate(e.vencimento) : '',
        'Nº Fatura': e.nfatura || '',
        'Valor (R$)': Number(e.valor) || 0,
        'Data de Envio': e.dataEnvio ? fmtDate(e.dataEnvio) : '',
        'Status': e.status || 'Pendente',
        'Observações': e.obs || '',
      }));
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{wch:26},{wch:12},{wch:12},{wch:13},{wch:12},{wch:11},{wch:40}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Lançamentos');
    const stamp = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, 'gastos-frete-' + stamp + '.xlsx');
    setState({ exporting:false, showExportModal:false, exportSelected:null });
  } catch (err) {
    console.error(err);
    setState({ exporting:false, exportError:'Não foi possível exportar. Tente novamente.' });
  }
}

    html += cardHtml('Lançamentos', String(filtered.length));

    html += cardHtml('Pendentes de pagamento', String(pendentesCount));
    html += '</div>';

    html += monthMultiSelectHtml(months);
    html += '</div>';
    if (boxSel !== null && boxSel.length === 0) {
      html += '<div class="empty-note">Selecione ao menos um mês.</div>';
    } else if (boxList.length === 0) {
      html += '<div class="empty-note">Sem dados no período.</div>';
    } else {
      html += '<div class="box-sub">' + (boxSel === null ? 'Total do período' : (boxSel.length === 1 ? 'Total em ' + esc(monthFull(boxSel[0])) : 'Total em ' + boxSel.length + ' meses selecionados')) + ': ' + currency(boxTotal) + '</div>';

    }

    html += '<div class="box"><div class="box-title">Pedidos lançados</div>';
    const panelList = filtered.slice().sort((a,b) => (b.vencimento||'').localeCompare(a.vencimento||''));
    if (panelList.length === 0) {
      html += '<div class="empty-note">Sem lançamentos no período.</div>';
    } else {
      html += '<div class="mini-table-scroll"><table class="mini-table"><thead><tr>' +

        '</tr></thead><tbody>';

        html += '<tr>';
        html += '<td style="font-weight:500">' + esc(e.prestador) + '</td>';

        html += '<td style="font-weight:600">' + currency(e.valor) + '</td>';
        html += '<td><span class="status-pill ' + statusClass + '">' + esc(e.status || 'Pendente') + '</span></td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';

    html += '</div>';
  } else {
    html += '<div class="table-wrap"><div class="table-scroll"><table>';
    html += '<thead><tr>' + ['Transportadora','Vencimento','Nº Fatura','Valor','Envio','Status','Obs','Anexo',''].map(h=>'<th>'+h+'</th>').join('') + '</tr></thead><tbody>';
    const sorted = filtered.slice().sort((a,b) => (b.vencimento||'').localeCompare(a.vencimento||''));
    if (sorted.length === 0) {
      html += '<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--ink-mute);">Nenhum lançamento encontrado para os filtros selecionados.</td></tr>';
    } else {

        html += '<tr>';
        html += '<td style="font-weight:500">' + esc(e.prestador) + '</td>';
        html += '<td>' + fmtDate(e.vencimento) + '</td>';
        html += '<td>' + esc(e.nfatura || '—') + '</td>';
        html += '<td style="font-weight:600">' + currency(e.valor) + '</td>';
        html += '<td>' + fmtDate(e.dataEnvio) + '</td>';
        html += '<td><button class="status-pill ' + statusClass + '" onclick=\'toggleStatusById(' + jsq(e.id) + ')\'>' + esc(e.status || 'Pendente') + '</button></td>';
        html += '<td class="obs-cell" title="' + esc(e.obs) + '">' + esc(e.obs || '—') + '</td>';
        html += '<td>' + (e.anexo ? '<span class="anexo-actions" title="' + esc(e.anexo.name || '') + '"><button type="button" class="link-btn" onclick=\'openAnexo(' + jsq(e.id) + ')\'>Abrir</button><button type="button" class="link-btn" onclick=\'downloadAnexo(' + jsq(e.id) + ')\'>Baixar</button></span>' : '—') + '</td>';
        html += '<td style="white-space:nowrap">';
        html += '<button class="icon-btn edit" onclick=\'editById(' + jsq(e.id) + ')\' aria-label="Editar">' + ICONS.pencil + '</button>';
        html += '<button class="icon-btn del" onclick=\'deleteById(' + jsq(e.id) + ')\' aria-label="Excluir">' + ICONS.trash + '</button>';
        html += '</td>';
        html += '</tr>';
      });
    }
    html += '</tbody></table></div></div>';
  }

  if (state.showForm) {
    html += formModalHtml();

function tabBtn(id, icon, label) {
  return '<button class="tab-btn' + (state.tab===id?' active':'') + '" onclick=\'setState({tab:' + jsq(id) + '})\'>' + icon + ' ' + label + '</button>';
}
function selectHtml(name, options, value, onchange) {
  let s = '<select class="filter-select" onchange="' + onchange + '">';
  options.forEach(([val,label]) => {
    s += '<option value="' + esc(val) + '"' + (val===value?' selected':'') + '>' + esc(label) + '</option>';
  });
  s += '</select>';
  return s;
}
function prestadorMultiSelectHtml(opts) {
  const selSet = state.filterPrestadores;
  const isAll = selSet === null;
  const count = isAll ? opts.length : selSet.size;
  const label = isAll
    ? 'Todas as transportadoras'
    : (count === 0 ? 'Nenhuma transportadora' : (count === 1 ? [...selSet][0] : count + ' transportadoras'));
  let html = '<div style="position:relative;display:inline-block;">';
  html += '<button type="button" class="filter-select ms-trigger" onclick="event.stopPropagation();togglePrestadorDropdown()">' + esc(label) + ' <span style="font-size:10px;color:var(--ink-mute);">\u25BE</span></button>';
  if (state.prestadorDropdownOpen) {
    html += '<div class="ms-backdrop" onclick="closePrestadorDropdown()"></div>';
    html += '<div class="ms-panel" onclick="event.stopPropagation()">';
    html += '<label class="ms-item ms-item-all"><input type="checkbox" ' + (isAll?'checked':'') + ' onchange="setAllFilterPrestadores(this.checked)"> Todas</label>';
    if (opts.length === 0) {
      html += '<div class="empty-note">Nenhuma transportadora lançada ainda.</div>';
    } else {
      opts.forEach(name => {
        const checked = isAll || selSet.has(name);
        html += '<label class="ms-item"><input type="checkbox" ' + (checked?'checked':'') + ' onchange=\'toggleFilterPrestador(' + jsq(name) + ')\'> ' + esc(name) + '</label>';
      });
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}
function cardHtml(label, value) {
  return '<div class="card"><div class="card-label">' + label + '</div><div class="card-value sg">' + value + '</div></div>';
}

function formModalHtml() {

  m += '<form class="modal" onsubmit="handleSubmit(event)">';

  m += '<button type="button" class="modal-close" onclick="closeForm()">' + ICONS.x + '</button></div>';
  m += '<div class="form-col">';

  m += '<label class="field">Transportadora / prestador *<input list="prestador-list" value="' + esc(f.prestador) + '" oninput="updateFormField(\'prestador\', this.value)" placeholder="Ex: TRANS MODEL, ATIVA, CORREIOS…"></label>';

  m += '<label class="field">Vencimento *<input type="date" value="' + esc(f.vencimento) + '" oninput="updateFormField(\'vencimento\', this.value)"></label>';

  m += '</div>';

  m += '<div class="field-row">';
  m += '<label class="field">Nº da fatura / nota<input value="' + esc(f.nfatura) + '" oninput="updateFormField(\'nfatura\', this.value)"></label>';
  m += '<label class="field">Valor (R$) *<input type="text" inputmode="decimal" value="' + esc(f.valor) + '" oninput="updateFormField(\'valor\', this.value)" placeholder="0,00"></label>';
  m += '</div>';

  m += '<label class="field">Status<select onchange="updateFormField(\'status\', this.value)">';
  m += '<option value="Pendente"' + (f.status==='Pendente'?' selected':'') + '>Pendente</option>';
  m += '<option value="Pago"' + (f.status==='Pago'?' selected':'') + '>Pago</option>';
  m += '</select></label>';

  m += '<label class="field">Observações<textarea rows="2" oninput="updateFormField(\'obs\', this.value)">' + esc(f.obs) + '</textarea></label>';

  m += '<label class="field">Anexar fatura ou nota fiscal (PDF ou imagem)<input type="file" accept=".pdf,image/*" onchange="handleFileChange(event)"></label>';

  m += '<button type="submit" class="btn-submit">' + (editing ? 'Salvar alterações' : 'Salvar lançamento') + '</button>';
  m += '</div></form></div>';
  return m;
}

  return m;
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-database-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-storage-compat.min.js"></script>
<script>
(function(){
  /* CADEADO PADRÃO DA ESTANTE. Só esta linha muda (o ✎ Editar troca ela). */
  var GRUPOS_PERMITIDOS = ["PCP"];
  var firebaseConfig = {
    apiKey: "AIzaSyCpG7o-CF3twF0Jti0bRchrS97SWYQBuyo",
    authDomain: "stinpharma-qualidade.firebaseapp.com",
    databaseURL: "https://stinpharma-qualidade-default-rtdb.firebaseio.com",
    projectId: "stinpharma-qualidade",
    storageBucket: "stinpharma-qualidade.firebasestorage.app",
    messagingSenderId: "422803826984",
    appId: "1:422803826984:web:6e72e2470f3678eb8d881d",
    measurementId: "G-6C0TLHH2VP"
  };
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  function norm(x){ return String(x).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().trim(); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function liberar(){
    var st = document.getElementById('__gateStyle');
    var ov = document.getElementById('__gateOverlay');
    if(st) st.remove();
    if(ov) ov.remove();
    window.__gateOk = true;
    if(window.__startApp) window.__startApp();
  }
  function negar(msg){
    document.getElementById('__gateMsg').innerHTML = msg + '<br><br><a href="./index.html" style="color:#4d9fff;">&larr; Voltar pra Estante</a>';
  }
  var jaResolveu = false;
  setTimeout(function(){
    if(!jaResolveu) negar('Não foi possível confirmar seu acesso (conexão lenta ou instável). <a href="javascript:location.reload()" style="color:#4d9fff;">Tentar de novo</a>');
  }, 10000);
  firebase.auth().onAuthStateChanged(function(user){
    jaResolveu = true;
    if(!user){ negar('Você precisa entrar pela Estante.'); return; }
    firebase.database().ref('centralApps/usuarios/' + user.uid).once('value').then(function(snap){
      var dados = snap.val() || {};
      var meus = (dados.grupos || []).map(norm);
      var permitido = dados.admin === true || GRUPOS_PERMITIDOS.some(function(g){ return meus.indexOf(norm(g)) !== -1; });
      if(permitido){ liberar(); return; }
      negar('Você não tem permissão pra acessar este app.<br><span style="font-size:12px;">Seus grupos: ' + esc((dados.grupos||[]).join(', ') || 'nenhum') + '<br>Grupos com acesso: ' + esc(GRUPOS_PERMITIDOS.join(', ')) + '</span>');
    }).catch(function(){ negar('Não foi possível checar sua permissão agora. Tente recarregar.'); });
  });
})();
</script>
</body></html>
